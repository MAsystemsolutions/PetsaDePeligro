<style>
:root{
  --bg:#F5F1EA; --surface:#FFFFFF; --surface-2:#FBF8F3; --surface-3:#EFE9DF;
  --ink:#24302B; --ink-2:#4E5A54; --muted:#87908A; --line:#E5DFD4; --line-2:#D3CBBE;
  --brand:#2F6B5A; --brand-2:#3E8A73; --brand-soft:#E3EFEA; --on-brand:#FBF8F2; --peach:#F2A97E; --peach-soft:#FCEADF;
  --gold:#E0A84F; --focus:#2F6B5A;
  --paid:#2F7A57; --paid-bg:#E1F1E8;
  --partial:#A4691A; --partial-bg:#FBEFD8;
  --unpaid:#66706A; --unpaid-bg:#E9EBE6;
  --overdue:#C2453B; --overdue-bg:#FBE3DF;
  --over:#7A57A6; --over-bg:#EFE7F8;
  --void:#9A948B; --void-bg:#F1EFEB;
  --c-expected:#CFC6B6; --c-actual:#2F6B5A; --c-income:#3E8A73; --c-out:#EE8D63;
  --radius:14px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(43,41,38,.04),0 6px 24px rgba(43,41,38,.05);
  --shadow-lg:0 20px 60px rgba(43,41,38,.18);
  --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --sidebar:248px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:28px 18px 18px}
.brand{padding:0 10px 26px;border-bottom:1px solid var(--line);margin-bottom:16px}
.brand-title{font-family:var(--serif);font-size:23px;line-height:1.1;font-weight:600;letter-spacing:.2px}
.brand-sub{margin-top:8px;font-size:10.5px;letter-spacing:2.2px;text-transform:uppercase;color:var(--muted);font-weight:600}
.brand-rule{width:28px;height:2px;background:var(--gold);margin-top:14px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--ink-2);font-weight:500;font-size:14.5px}
.nav a svg{width:18px;height:18px;flex:none;stroke:currentColor}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.active{background:var(--brand);color:var(--on-brand)}
.nav .badge{margin-left:auto;background:var(--partial-bg);color:var(--partial);font-size:11px;font-weight:700;border-radius:20px;padding:1px 8px}
.nav a.active .badge{background:rgba(255,255,255,.18);color:#fff}
.sidebar-foot{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:rgba(244,241,236,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 36px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.topbar h1{font-family:var(--serif);font-weight:600;font-size:22px;margin:0;flex:1;min-width:140px;letter-spacing:.2px}
.content{padding:28px 36px 60px;max-width:1320px;width:100%;margin:0 auto}
.bottomnav{display:none}

/* ---------- Status pill (connection) ---------- */
.conn{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.conn .dot{width:8px;height:8px;border-radius:50%;background:var(--paid);flex:none}
.conn[data-state=offline] .dot{background:var(--unpaid)}
.conn[data-state=syncing] .dot{background:var(--focus);animation:pulse 1s infinite}
.conn[data-state=pending] .dot,.conn[data-state=failed] .dot{display:none}
.conn[data-state=pending]{color:var(--partial);background:var(--partial-bg);border-color:transparent}
.conn[data-state=failed]{color:var(--overdue);background:var(--overdue-bg);border-color:transparent}
.conn[data-state=complete]{color:var(--paid);background:var(--paid-bg);border-color:transparent}
.conn[data-state=complete] .dot{display:none}
@keyframes pulse{50%{opacity:.3}}

/* ---------- Month selector ---------- */
.month-sel{display:inline-flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.month-sel button{border:0;background:transparent;width:32px;height:32px;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--ink-2)}
.month-sel button:hover{background:var(--surface-3)}
.month-sel label{position:relative;padding:0 10px;font-weight:600;font-size:14px;min-width:132px;text-align:center;cursor:pointer}
.month-sel input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}

/* ---------- Buttons & forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink);text-decoration:none;white-space:nowrap;min-height:40px;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2);border-color:var(--ink-2)}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.btn.primary:hover{background:#45413B}
.btn.danger{color:var(--overdue);border-color:#E7C3C0}
.btn.danger:hover{background:var(--overdue-bg)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-3)}
.btn.sm{padding:5px 11px;font-size:13px;min-height:32px;border-radius:8px}
.btn.pay{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.btn[disabled],.btn.busy{opacity:.55;cursor:not-allowed;pointer-events:none}
.btn svg{width:16px;height:16px}
.spinner{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:15px;min-height:44px;outline:none;transition:border-color .15s,box-shadow .15s}
textarea.input{min-height:76px;resize:vertical}
.input:focus{border-color:var(--ink-2);box-shadow:0 0 0 3px rgba(43,41,38,.08)}
.input.invalid{border-color:var(--overdue)}
.money-wrap{position:relative}
.money-wrap span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600}
.money-wrap .input{padding-left:28px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.form-error{color:var(--overdue);background:var(--overdue-bg);border-radius:10px;padding:10px 12px;font-size:13.5px;display:none}
.form-error.show{display:block}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:18px}
.filters .field{flex:1 1 160px;max-width:260px}
.filters .field.grow{flex:2 1 220px;max-width:none}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.toolbar .left{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:22px 24px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 24px 0}
.card-title{font-size:11.5px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--ink-2);margin:0}
.section-title{font-family:var(--serif);font-size:20px;font-weight:600;margin:0}
.eyebrow{font-size:11px;letter-spacing:2.2px;text-transform:uppercase;color:var(--muted);font-weight:700}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:24px}
.hero h2{font-family:var(--serif);font-size:38px;line-height:1.05;font-weight:600;margin:6px 0 0;letter-spacing:.2px}
.hero .sub{font-size:11.5px;letter-spacing:2.6px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:10px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.kpi{padding:18px 20px;position:relative;overflow:hidden}
.kpi .label{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;font-weight:700;color:var(--muted)}
.kpi .value{font-family:var(--serif);font-size:30px;font-weight:600;margin-top:6px;letter-spacing:.2px;font-variant-numeric:lining-nums tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .meta{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.kpi.lead{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.kpi.lead .label,.kpi.lead .meta{color:#CFC8BD}
.kpi.lead .value.neg-light{color:#F2A9A4}
.kpi .tone{position:absolute;left:0;top:18px;bottom:18px;width:3px;border-radius:0 3px 3px 0}
.neg{color:var(--overdue)}
.pos{color:var(--paid)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
.grid-3-1{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;margin-bottom:18px}

/* ---------- Household Financial Status (smart insight) ---------- */
.insight{--st:var(--paid);--st-bg:var(--paid-bg);margin-bottom:18px;overflow:hidden;position:relative;background:linear-gradient(180deg,#FFFFFF 0%,#FCFAF6 100%)}
.insight::before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:var(--st)}
.insight.st-STABLE{--st:#2470A8;--st-bg:#E3EDF6}
.insight.st-CAUTION{--st:var(--partial);--st-bg:var(--partial-bg)}
.insight.st-WARNING{--st:#B4552D;--st-bg:#F6E4DA}
.insight.st-CRITICAL{--st:var(--overdue);--st-bg:var(--overdue-bg)}
.ins-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:22px 28px 0;flex-wrap:wrap}
.ins-pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:var(--st-bg);color:var(--st);font-size:12px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase}
.ins-pill i{width:8px;height:8px;border-radius:50%;background:var(--st)}
.ins-body{display:grid;grid-template-columns:1.35fr 1fr;gap:0}
.ins-main{padding:14px 28px 26px}
.ins-headline{font-family:var(--serif);font-size:31px;line-height:1.18;font-weight:600;margin:6px 0 10px;letter-spacing:.1px}
.ins-comment{font-size:15.5px;line-height:1.6;color:var(--ink-2);margin:0 0 20px;max-width:62ch}
.ins-grid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.ins-tile{padding:13px 0;border-bottom:1px solid var(--line)}
.ins-tile:nth-child(odd){padding-right:18px;border-right:1px solid var(--line)}
.ins-tile:nth-child(even){padding-left:18px}
.t-label{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;font-weight:700;color:var(--muted)}
.t-value{font-size:19px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}
.t-note{font-size:12px;color:var(--muted);margin-top:1px}
.ins-side{background:var(--surface-2);border-left:1px solid var(--line);padding:18px 22px 22px;display:flex;flex-direction:column;gap:16px}
.ins-safe{background:var(--brand);color:var(--on-brand);border-radius:14px;padding:18px 20px}
.s-label{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;font-weight:700;color:#CFC8BD}
.s-big{font-family:var(--serif);font-size:40px;font-weight:600;line-height:1.1;margin-top:6px;font-variant-numeric:lining-nums tabular-nums}
.s-big.is-short{color:#F2A9A4}
.s-short{font-size:13px;color:#F2C1BC;margin-top:4px;font-weight:600}
.s-formula{font-size:11.5px;color:#BDB5A9;margin-top:10px;line-height:1.5}
.ins-rem{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ins-rem li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.45;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.rm-ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--st-bg);color:var(--st)}
.ins-rem li.rm-overdue .rm-ic,.ins-rem li.rm-crunch .rm-ic{background:var(--overdue-bg);color:var(--overdue)}
.ins-rem li.rm-healthy .rm-ic{background:var(--paid-bg);color:var(--paid)}
.ins-list .t-label{margin-bottom:4px}
.ins-li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.ins-li:first-of-type{border-top:0}
.ins-li .num{font-weight:600;font-variant-numeric:tabular-nums}
.ins-li .sub{font-size:12px;color:var(--muted)}
.ins-foot{border-top:1px solid var(--line);padding:11px 28px;font-size:11.5px;color:var(--muted);background:var(--surface)}
.ins-foot a{color:var(--ink-2)}

/* ---------- Lent money (colorful, interactive) ---------- */
.loan-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.loan-stat{--c:#2D8C8C;--bg:#E2F1F0;border-radius:var(--radius);padding:18px 20px;background:linear-gradient(135deg,var(--bg) 0%,#FFFFFF 85%);border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden}
.loan-stat::after{content:'';position:absolute;right:-26px;top:-26px;width:90px;height:90px;border-radius:50%;background:var(--c);opacity:.10}
.loan-stat .label{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;font-weight:700;color:var(--c)}
.loan-stat .value{font-family:var(--serif);font-size:30px;font-weight:600;margin-top:6px;color:var(--ink);font-variant-numeric:lining-nums tabular-nums}
.loan-stat .meta{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.ls-lent{--c:#7B4B94;--bg:#EFE6F3}.ls-back{--c:#3E7A55;--bg:#E6F0E9}.ls-late{--c:#B0363A;--bg:#F6E1DF}
.avatar{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:.5px;color:#fff;background:var(--av,#2470A8);box-shadow:0 0 0 3px #fff,0 0 0 4px color-mix(in srgb,var(--av,#2470A8) 35%,transparent)}
.avatar.sm{width:30px;height:30px;font-size:11.5px;box-shadow:none}
.owe-card{margin-bottom:6px}
.owe-list{display:flex;flex-direction:column;padding:10px 14px 8px}
.owe-row{display:grid;grid-template-columns:30px minmax(80px,150px) 1fr auto;gap:12px;align-items:center;padding:9px 10px;border:0;background:transparent;border-radius:10px;cursor:pointer;text-align:left;transition:background .15s}
.owe-row:hover,.owe-row.on{background:var(--surface-3)}
.owe-name{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.late-dot{width:8px;height:8px;border-radius:50%;background:var(--overdue);display:inline-block}
.owe-bar{height:14px;width:var(--w);min-width:10px;display:flex;gap:2px;border-radius:7px;overflow:hidden;animation:grow .7s cubic-bezier(.2,.8,.2,1) both;transform-origin:left}
.owe-bar i{display:block;height:100%;width:var(--p)}
.owe-bar i.paid{background:var(--paid)}
.owe-bar i.left{background:var(--av)}
.owe-amt{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.loan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.loan-card{--av:#2470A8;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;position:relative;transition:box-shadow .2s,transform .2s}
.loan-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--av)}
.loan-card:hover{box-shadow:0 2px 4px rgba(43,41,38,.05),0 12px 30px rgba(43,41,38,.09)}
.loan-head{display:grid;grid-template-columns:44px 1fr auto 18px;gap:14px;align-items:center;width:100%;padding:16px 18px 10px 20px;background:none;border:0;cursor:pointer;text-align:left}
.loan-head .who{display:flex;flex-direction:column;min-width:0}
.loan-head .who b{font-size:15.5px}
.loan-head .sub{font-size:12.5px;color:var(--muted)}
.loan-head .amt{display:flex;flex-direction:column;align-items:flex-end}
.loan-head .amt b{font-family:var(--serif);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.chev{font-size:22px;color:var(--muted);transition:transform .25s}
.loan-card.open .chev{transform:rotate(90deg)}
.loan-prog{padding:0 18px 14px 20px}
.loan-prog .bar{height:9px;border-radius:9px;background:color-mix(in srgb,var(--av) 14%,#F1EDE6);overflow:hidden}
.loan-prog .bar i{display:block;height:100%;width:100%;border-radius:9px;background:linear-gradient(90deg,var(--paid),#5DA374);transform-origin:left;transform:scaleX(var(--p));animation:fill .9s cubic-bezier(.2,.8,.2,1)}
@keyframes fill{from{transform:scaleX(0)}}
.prog-meta{display:flex;justify-content:space-between;gap:10px;margin-top:7px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.due{font-weight:600;padding:1px 9px;border-radius:999px;background:var(--surface-3)}
.due.late{color:var(--overdue);background:var(--overdue-bg)}
.due.soon{color:var(--partial);background:var(--partial-bg)}
.due.done{color:var(--paid);background:var(--paid-bg)}
.due.off{color:var(--void);background:var(--void-bg)}
.loan-card.s-REPAID{opacity:.92}
.loan-card.s-WRITTEN_OFF{opacity:.7}
.loan-more{max-height:0;overflow:hidden;padding:0 18px 0 20px;background:var(--surface-2);border-top:1px solid transparent;transition:max-height .35s ease,padding .3s ease}
.loan-card.open .loan-more{max-height:900px;padding:14px 18px 16px 20px;border-top-color:var(--line)}
.loan-note{margin:0 0 12px;font-size:13.5px;color:var(--ink-2);font-style:italic}
.timeline{list-style:none;margin:0 0 12px;padding:0 0 0 4px;border-left:2px solid color-mix(in srgb,var(--paid) 35%,transparent)}
.timeline li{display:flex;align-items:center;gap:10px;padding:6px 0 6px 14px;position:relative;font-size:13.5px}
.timeline .dot{position:absolute;left:-7px;width:12px;height:12px;border-radius:50%;background:var(--paid);box-shadow:0 0 0 3px var(--surface-2)}
.timeline .tl-main{flex:1;display:block}
.timeline .tl-main .sub{display:block}
.timeline .sub{font-size:12px;color:var(--muted)}
.loan-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Available money ---------- */
.avail{display:grid;grid-template-columns:1.15fr 1fr;overflow:hidden;margin-bottom:18px}
.avail-main{background:var(--brand);color:var(--on-brand);padding:24px 26px}
.avail-main .label{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;font-weight:700;color:#CFC8BD}
.avail-main .big{font-family:var(--serif);font-size:46px;font-weight:600;line-height:1.1;margin-top:8px;font-variant-numeric:lining-nums tabular-nums}
.avail-main .big.neg-light{color:#F2A9A4}
.avail-main .meta{font-size:13px;color:#E4DED4;margin-top:6px}
.avail-side{padding:18px 24px}
.avail-side .row{border-top:1px solid var(--line)}
.avail-side .row:first-child{border-top:0}

/* ---------- Status tags ---------- */
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.6px;white-space:nowrap}
.tag::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.PAID{color:var(--paid);background:var(--paid-bg)}
.tag.PARTIAL{color:var(--partial);background:var(--partial-bg)}
.tag.UNPAID{color:var(--unpaid);background:var(--unpaid-bg)}
.tag.OVERDUE{color:var(--overdue);background:var(--overdue-bg)}
.tag.OVER{color:var(--over);background:var(--over-bg)}
.tag.VOID{color:var(--void);background:var(--void-bg)}
.tag.RECEIVED{color:var(--paid);background:var(--paid-bg)}
.tag.PENDING{color:var(--unpaid);background:var(--unpaid-bg)}
.tag.CANCELLED{color:var(--void);background:var(--void-bg)}
.tag.local{color:var(--partial);background:var(--partial-bg)}
.tag.local::before{display:none}
.health{display:inline-flex;align-items:center;gap:8px;font-weight:700;letter-spacing:1.6px;font-size:13px;padding:6px 14px;border-radius:999px}
.health.ON{color:var(--paid);background:var(--paid-bg)}
.health.WATCH{color:var(--partial);background:var(--partial-bg)}
.health.OVER{color:var(--overdue);background:var(--overdue-bg)}

/* ---------- Lists (table on desktop, cards on mobile) ---------- */
.list{display:flex;flex-direction:column}
.row{display:grid;align-items:center;gap:14px;padding:14px 24px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.head{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);font-weight:700;padding-top:14px;padding-bottom:10px;border-top:0}
.row .name{font-weight:600}
.row .sub{font-size:12.5px;color:var(--muted)}
.row .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.row:hover:not(.head){background:var(--surface-2)}
.cols-bills{grid-template-columns:minmax(150px,2fr) 110px 110px 110px 110px 120px 180px}
.cols-exp{grid-template-columns:110px minmax(150px,2fr) 130px 130px 120px 130px}
.cols-inc{grid-template-columns:110px minmax(140px,2fr) 110px 120px 120px 110px 130px}
.cols-pay{grid-template-columns:110px minmax(150px,2fr) 110px 130px minmax(100px,1fr) 100px}
.cols-rec{grid-template-columns:minmax(150px,2fr) 120px minmax(150px,1.4fr) 130px 100px 190px}
.cols-mini{grid-template-columns:1fr auto auto;padding:12px 24px}
.dim{opacity:.55}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}
.empty .section-title{color:var(--ink);margin-bottom:6px;font-size:18px}
.list-foot{display:flex;justify-content:space-between;gap:12px;padding:14px 24px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 var(--radius) var(--radius);font-weight:600;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.chip b{font-variant-numeric:tabular-nums}

/* ---------- Health / progress ---------- */
.meter{position:relative;height:10px;border-radius:10px;background:var(--surface-3);overflow:visible;margin:18px 0 8px}
.meter .fill{position:absolute;left:0;top:0;bottom:0;border-radius:10px;background:linear-gradient(90deg,var(--brand-2),var(--brand))}
.meter .proj{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--gold)}
.meter-legend{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2);gap:10px;flex-wrap:wrap}
.reasons{margin:14px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.reasons li{font-size:13.5px;color:var(--ink-2);padding-left:18px;position:relative}
.reasons li::before{content:'';position:absolute;left:2px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--gold)}

/* ---------- Charts ---------- */
.chart{padding:8px 24px 22px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--sans);fill:var(--ink-2);font-size:11px}
.chart .axis{stroke:var(--line-2);stroke-width:1}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart [data-tip]{cursor:default}
.chart [data-tip]:hover{opacity:.82}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:12px 24px 0;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tooltip{position:fixed;z-index:100;pointer-events:none;background:var(--ink);color:#F7F4EF;font-size:12.5px;padding:8px 11px;border-radius:8px;box-shadow:var(--shadow-lg);max-width:260px;opacity:0;transition:opacity .1s;white-space:pre-line}
.tooltip.show{opacity:1}

/* ---------- Banner, toast, modal ---------- */
.banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:var(--surface-3);border:1px solid var(--line-2);color:var(--ink-2);font-size:13.5px;margin-bottom:18px;flex-wrap:wrap}
.banner.warn{background:var(--partial-bg);border-color:transparent;color:#6E4C10}
.banner.err{background:var(--overdue-bg);border-color:transparent;color:#7D2427}
.banner .grow{flex:1;min-width:200px}
.toasts{position:fixed;right:22px;bottom:22px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--ink);color:#F7F4EF;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow-lg);font-size:14px;display:flex;gap:10px;align-items:flex-start;animation:toastIn .2s ease-out}
.toast.err{background:#7D2427}
.toast.warn{background:#6E4C10}
.toast .x{margin-left:auto;background:none;border:0;color:inherit;opacity:.7;cursor:pointer;font-size:16px;line-height:1}
@keyframes toastIn{from{transform:translateY(8px);opacity:0}}
.modal-back{position:fixed;inset:0;background:rgba(43,41,38,.42);z-index:150;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);width:min(560px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;overflow:hidden}
.modal.wide{width:min(760px,100%)}
.modal-head{padding:22px 26px 6px;display:flex;align-items:flex-start;gap:12px}
.modal-head h3{font-family:var(--serif);font-size:23px;font-weight:600;margin:0;flex:1}
.modal-head .eyebrow{display:block;margin-bottom:4px}
.modal-body{padding:14px 26px 8px;overflow:auto}
.modal-foot{padding:16px 26px 22px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:10px}
.close-x{border:0;background:var(--surface-3);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;color:var(--ink-2)}
.summary-box{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px}
.summary-box div span{display:block;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:700}
.summary-box div b{font-size:17px;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;text-align:right}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all}
.report-table{width:100%;border-collapse:collapse;font-size:13.5px}
.report-table th{text-align:left;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.report-table td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.report-table td.n,.report-table th.n{text-align:right;font-variant-numeric:tabular-nums}
.report-table tfoot td{font-weight:700;border-top:1px solid var(--ink);border-bottom:0}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
[hidden]{display:none !important}
.install-top{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.install-top:hover{background:var(--brand-2)}
.install-steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;font-size:15px}
.install-steps b{white-space:nowrap}
.install-card{display:none}
.install-card.show{display:flex}
.print-only{display:none}

/* ---------- Responsive ---------- */
@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .cols-bills{grid-template-columns:minmax(140px,2fr) 100px 100px 100px 120px 160px}
  .cols-bills .c-diff{display:none}
}
@media (max-width:1020px){
  .grid-2,.grid-3-1{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .loan-stats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  .topbar{padding:12px 16px;gap:10px}
  .topbar h1{font-size:19px}
  .content{padding:18px 16px 110px}
  .hero h2{font-size:30px}
  .kpis{grid-template-columns:repeat(2,1fr);gap:10px}
  .avail{grid-template-columns:1fr}
  .ins-body{grid-template-columns:1fr}
  .loan-grid{grid-template-columns:1fr}
  .loan-stats{gap:10px}
  .loan-stat{padding:14px 16px}
  .loan-stat .value{font-size:24px}
  .owe-row{grid-template-columns:30px minmax(60px,100px) 1fr auto;gap:8px}
  .ins-top{padding:18px 18px 0}
  .ins-main{padding:10px 18px 18px}
  .ins-headline{font-size:25px}
  .ins-comment{font-size:14.5px}
  .ins-side{border-left:0;border-top:1px solid var(--line);padding:16px 16px 18px}
  .s-big{font-size:36px}
  .ins-foot{padding:10px 18px}
  .t-value{font-size:17px}
  .avail-main{padding:20px 18px}
  .avail-main .big{font-size:38px}
  .avail-side{padding:14px 16px}
  .kpi{padding:14px 16px}
  .kpi .value{font-size:23px}
  .kpi.lead{grid-column:1/-1}
  .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bottomnav a,.bottomnav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:10.5px;font-weight:600;color:var(--muted);text-decoration:none;background:none;border:0;cursor:pointer;border-radius:10px;position:relative}
  .bottomnav svg{width:21px;height:21px;stroke:currentColor}
  .bottomnav .active{color:var(--ink)}
  .bottomnav .badge{position:absolute;top:2px;right:calc(50% - 20px);background:var(--overdue);color:#fff;font-size:10px;border-radius:10px;padding:0 5px;line-height:16px}
  .row.head{display:none}
  .row{grid-template-columns:1fr auto !important;gap:6px 12px;padding:14px 16px}
  .row > [data-label]{display:flex;justify-content:space-between;gap:10px;grid-column:1/-1;font-size:13.5px;text-align:left}
  .row > [data-label]::before{content:attr(data-label);color:var(--muted);font-size:12px;font-weight:600}
  .row > .primary-cell{grid-column:1/2}
  .row > .status-cell{grid-column:2/3;grid-row:1;justify-self:end}
  .row .actions{grid-column:1/-1;justify-content:flex-start;margin-top:4px}
  .row .actions .btn{flex:1}
  .cols-mini{grid-template-columns:1fr auto !important}
  .cols-mini > .num{grid-column:2}
  .card-head{padding:16px 16px 0}
  .card-pad{padding:18px 16px}
  .chart{padding:8px 12px 18px}
  .legend{padding:12px 16px 0}
  .list-foot{padding:12px 16px}
  .filters .field{max-width:none;flex:1 1 140px}
  .modal-back{align-items:flex-end;padding:0}
  .modal,.modal.wide{width:100%;border-radius:20px 20px 0 0;max-height:92vh}
  .modal-head{padding:20px 18px 4px}
  .modal-body{padding:12px 18px 6px}
  .modal-foot{padding:14px 18px calc(18px + env(safe-area-inset-bottom))}
  .modal-foot .btn{flex:1}
  .toasts{left:16px;right:16px;bottom:84px;max-width:none}
}
@media (max-width:520px){
  .form-grid{grid-template-columns:1fr}
  .summary-box{grid-template-columns:1fr 1fr}
  .stat-grid{grid-template-columns:1fr 1fr;gap:10px}
  .stat-grid .kpi.lead{grid-column:1/-1}
  .stat-grid .kpi.lead:first-child ~ .kpi:nth-child(4):last-child{grid-column:1/-1}
  .month-sel label{min-width:112px;font-size:13px}
  .conn .txt,.sync-btn .txt{display:none}
  .install-top{padding:6px 10px}
  .sync-btn{padding:6px 9px}
  .topbar{flex-wrap:nowrap;gap:8px}
  .topbar h1{min-width:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  body.has-month:not(.gated) .topbar h1{display:none}
  body.has-month:not(.gated) .month-sel{margin-right:auto}
  body:not(.has-month) .topbar .month-sel{display:none}
  .month-sel button{width:28px;height:28px}
  .conn{padding:8px}
  .hero-actions{width:100%}
  .hero-actions .btn{flex:1}
}
.more-sheet a{display:flex;align-items:center;gap:14px;padding:14px 6px;border-bottom:1px solid var(--line);text-decoration:none;font-weight:600}
.more-sheet a svg{width:20px;height:20px;stroke:currentColor}


/* ---------- Subscription edition: welcome / renew / onboarding ---------- */
.banner.plan{background:#EAF1F8;border-color:#C9DBEC;color:#24496B}
.gated .bottomnav,.gated .sync-btn,.gated .nav{visibility:hidden}
.gated #monthSel{display:none !important}
.gate-wrap{display:flex;justify-content:center;padding:12px 0 40px}
.gate{max-width:520px;width:100%;text-align:left}
.gate-logo{width:56px;height:56px;border-radius:16px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font:600 30px var(--serif);margin-bottom:14px;box-shadow:inset 0 -6px 0 var(--peach)}
.gate-title{font-family:var(--serif);font-size:28px;line-height:1.15;margin:0 0 8px}
.gate-tag{color:var(--ink-2);margin:0 0 18px;font-size:15px}
.gate-box{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 14px}
.plan-card{border:1px solid var(--line-2);border-radius:14px;padding:12px 14px;background:var(--surface)}
.plan-card.best{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.plan-name{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.plan-name .save{background:var(--paid-bg);color:var(--paid);border-radius:20px;padding:1px 7px;letter-spacing:0;text-transform:none}
.plan-price{font:600 26px var(--serif);margin-top:4px}.plan-price span{font:500 13px var(--sans,inherit);color:var(--muted);margin-left:2px}
.pay-how{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px}
.pay-num{display:flex;align-items:center;gap:10px;padding:4px 0}.pay-num span{width:56px;color:var(--muted);font-weight:600}.pay-num b{flex:1;font-size:15px}
.acct-pill{display:inline-block;font-size:12px;font-weight:700;border-radius:20px;padding:2px 9px;background:var(--unpaid-bg);color:var(--unpaid)}
.acct-pill.s-ACTIVE{background:var(--paid-bg);color:var(--paid)}.acct-pill.s-TRIAL{background:#E6EEF8;color:#2470A8}
.acct-pill.s-GRACE{background:var(--partial-bg);color:var(--partial)}.acct-pill.s-EXPIRED,.acct-pill.s-SUSPENDED{background:var(--overdue-bg);color:var(--overdue)}
.gs-card{margin-bottom:18px;border-color:var(--line-2)}
.gs-step{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.gs-step .grow{flex:1;min-width:0}.gs-step .sub{font-size:13px;color:var(--muted)}
.gs-num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);font-weight:700;font-size:13px;flex:none}
.gs-step.done .gs-num{background:var(--paid-bg);color:var(--paid)}.gs-step.done b{color:var(--muted);text-decoration:line-through}
@media (max-width:520px){.plans{grid-template-columns:1fr}.gate-title{font-size:24px}}


/* ---------- Guided setup wizard ---------- */
body.wz-open{overflow:hidden}
.wz{position:fixed;inset:0;z-index:120;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;animation:fade .2s}
.wz-inner{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));min-height:100%;display:flex;flex-direction:column}
.wz-top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;margin-bottom:22px}
.wz-back,.wz-skipall{background:none;border:0;font:600 14px var(--sans,inherit);color:var(--ink-2);padding:8px 4px;cursor:pointer}
.wz-bar{height:6px;border-radius:6px;background:var(--surface-3);overflow:hidden}.wz-bar.hidden{visibility:hidden}
.wz-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--peach),var(--brand));border-radius:6px;transition:width .3s}
.wz-card{flex:1;display:flex;flex-direction:column}
.wz-eyebrow{font-size:11.5px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px}
.wz-title{font-family:var(--serif);font-size:30px;line-height:1.15;margin:0 0 10px;font-weight:600}
.wz-sub{color:var(--ink-2);font-size:15.5px;margin:0 0 20px;line-height:1.5}
.wz-body{display:flex;flex-direction:column;gap:12px}

.wz-seg{gap:0}.wz-seg .wz-chip{border-radius:0;flex:1;text-align:center}.wz-seg .wz-chip:first-child{border-radius:12px 0 0 12px}.wz-seg .wz-chip:last-child{border-radius:0 12px 12px 0;margin-left:-1.5px}

a{color:var(--brand)}

.room-card .t-label,.wz-rcap{font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:700}
.goal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.goal-card{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.goal-top{display:flex;justify-content:space-between;gap:10px}.goal-name{font:600 19px var(--serif)}.goal-pct{font:700 22px var(--serif);color:var(--brand)}
.goal-bar{height:12px;border-radius:12px;background:var(--surface-3);overflow:hidden}.goal-bar.sm{height:8px}
.goal-bar i{display:block;height:100%;border-radius:12px;background:linear-gradient(90deg,var(--peach),var(--brand-2));transition:width .4s}
.goal-nums{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink-2)}

.goal-entries .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px}
.goal-preview{min-height:10px}
.idea-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.idea{text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:3px;font:inherit;color:inherit}
.idea:hover{border-color:var(--brand)}.idea span{color:var(--brand);font-weight:600;font-size:13.5px}.idea small{color:var(--muted)}
.empty-goal p{margin:4px 0 0}
.dash-goals{margin-bottom:18px}.dash-goals.empty{display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap;background:linear-gradient(135deg,var(--surface),var(--peach-soft))}
.dg-list{padding:6px 24px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.dg-row{display:flex;flex-direction:column;gap:6px}.dg-head{display:flex;justify-content:space-between;gap:8px;align-items:center}
.dg-tag{font-size:12px;font-weight:700;border-radius:20px;padding:2px 9px}.dg-tag.ok{background:var(--paid-bg);color:var(--paid)}.dg-tag.no{background:var(--partial-bg);color:var(--partial)}
/* ---------- Calculator ---------- */
.calc-card{padding:18px}
.calc-screen{background:linear-gradient(135deg,var(--brand),#24564A);color:var(--on-brand);border-radius:16px;padding:18px 20px;text-align:right;margin-bottom:14px;min-height:96px}
#calcExpr{font:600 32px var(--serif);word-break:break-all}#calcLive{font-size:14px;opacity:.8;min-height:20px;margin-top:4px}
.calc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ck{border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:16px 0;font:600 20px var(--sans);color:var(--ink);cursor:pointer}
.ck:active{transform:scale(.97)}.ck.op{background:var(--brand-soft);color:var(--brand)}.ck.eq{background:var(--peach);color:#4A2414;border-color:var(--peach)}.ck.clr{color:var(--overdue)}.ck.back{grid-column:1/-1;padding:10px 0;font-size:16px}
.calc-tools{display:flex;flex-direction:column;gap:18px}.tool .explain{margin-bottom:8px}
.tool-row{display:flex;gap:8px;flex-wrap:wrap}.tool-out{margin-top:8px;font-size:14.5px;min-height:20px}
.wz-money.sm{flex:1;min-width:120px;padding:0 12px;border-radius:12px}.wz-money.sm span{font-size:18px}.wz-money.sm input{font-size:18px;padding:9px 0}

.donut-legend{flex:1;min-width:190px;display:flex;flex-direction:column;gap:7px}

.daily-card{margin-bottom:18px}.daily-card .chart{padding:6px 18px 16px}

.goal-top{align-items:center;gap:12px}.ring{flex:none}
.dg-head{gap:10px}

.ig-arrow.top{animation-name:igt}@keyframes igt{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}

/** Your Apps Script Web app link (not secret — it does nothing without a customer's private key). Personal links are just …/#k=<key>. */
const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbwEpQ_ew4_GGMIdokkQDX3_AzcOkrPfresCmtbWqQwhcD2y5a89xx6fNgAUi-t5WswdVg/exec';
const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
/** True inside Messenger / Facebook / Instagram / other apps' built-in browsers, which cannot install apps. */
const IN_APP_BROWSER = /FBAN|FBAV|FB_IAB|FB4A|FBIOS|Instagram|Messenger|Line\/|Viber|; wv\)/.test(navigator.userAgent || '');
const REQUEST_TIMEOUT_MS = 25000;
const SYNC_BATCH = 50;

/* ------------------------------------------------------------------ Util */
const U = {
  pad2: n => (n < 10 ? '0' : '') + n,
  today() {
    try {
      const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date()).map(x => [x.type, x.value]));
      return `${p.year}-${p.month}-${p.day}`;
    } catch (e) {
      const d = new Date(Date.now() + 8 * 3600 * 1000);   // Manila is UTC+8 with no DST
      return d.toISOString().slice(0, 10);
    }
  },
  nowIso: () => new Date().toISOString(),
  curMonth: () => U.today().slice(0, 7),
  isYmd: s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s),
  isYm: s => typeof s === 'string' && /^\d{4}-(0[1-9]|1[0-2])$/.test(s),
  dim: (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate(),
  ymdToDays: s => Math.floor(Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / 86400000),
  daysToYmd(n) { const d = new Date(n * 86400000); return d.getUTCFullYear() + '-' + U.pad2(d.getUTCMonth() + 1) + '-' + U.pad2(d.getUTCDate()); },
  addDays: (s, n) => U.daysToYmd(U.ymdToDays(s) + n),
  mIdx: ym => (+ym.slice(0, 4)) * 12 + (+ym.slice(5, 7) - 1),
  idxM: i => Math.floor(i / 12) + '-' + U.pad2((i % 12) + 1),
  addMonths: (ym, n) => U.idxM(U.mIdx(ym) + n),
  monthRange(a, b) { const out = []; for (let i = U.mIdx(a); i <= U.mIdx(b) && out.length < 240; i++) out.push(U.idxM(i)); return out; },
  lastDay: ym => ym + '-' + U.pad2(U.dim(+ym.slice(0, 4), +ym.slice(5, 7))),
  monthLabel: ym => U.isYm(ym) ? MONTHS[+ym.slice(5, 7) - 1] + ' ' + ym.slice(0, 4) : '—',
  monthShort: ym => U.isYm(ym) ? MONTHS[+ym.slice(5, 7) - 1].slice(0, 3) + ' ' + ym.slice(2, 4) : '—',
  /** Philippine style display, e.g. "Oct 15, 2026" — built from the string, never via Date, so no TZ shift. */
  fmtDate(s) { if (!U.isYmd(s)) return s || '—'; return MONTHS[+s.slice(5, 7) - 1].slice(0, 3) + ' ' + (+s.slice(8, 10)) + ', ' + s.slice(0, 4); },
  fmtDay(s) { if (!U.isYmd(s)) return s || '—'; const wd = WEEKDAYS[new Date(U.ymdToDays(s) * 86400000).getUTCDay()].slice(0, 3); return wd + ', ' + MONTHS[+s.slice(5, 7) - 1].slice(0, 3) + ' ' + (+s.slice(8, 10)); },
  fmtTime(iso) {
    if (!iso) return '—';
    try { return new Intl.DateTimeFormat('en-PH', { timeZone: TZ, month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }).format(new Date(iso)); } catch (e) { return iso; }
  },
  cents: v => (v === '' || v === null || v === undefined || !isFinite(Number(v))) ? 0 : Math.round(Number(v) * 100),
  fromCents: c => Math.round(c) / 100,
  round2: n => Math.round(Number(n) * 100) / 100,
  blank: v => v === '' || v === null || v === undefined,
  peso(n, compact) {
    if (U.blank(n) || !isFinite(Number(n))) return '—';
    const v = Number(n);
    try {
      return new Intl.NumberFormat('en-PH', { style: 'currency', currency: 'PHP', minimumFractionDigits: compact ? 0 : 2, maximumFractionDigits: compact ? 0 : 2 }).format(compact ? Math.round(v) : v);
    } catch (e) { return '₱' + v.toFixed(compact ? 0 : 2); }
  },
  parseMoney(v) {
    if (U.blank(v) || String(v).trim() === '') return '';
    const n = Number(String(v).replace(/[₱,\s]/g, ''));
    return isFinite(n) ? U.round2(n) : NaN;
  },
  hex(n) { const a = new Uint8Array(n); (self.crypto || window.crypto).getRandomValues(a); return Array.from(a, b => b.toString(16).padStart(2, '0')).join('').toUpperCase(); },
  uid: prefix => prefix + '-' + U.hex(8),
  opId: () => 'OP' + U.hex(10),
  esc: s => String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])),
  sleep: ms => new Promise(r => setTimeout(r, ms)),
  debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; },
  bool: v => v === true || String(v).toLowerCase() === 'true',
  withTimeout(p, ms, msg) {
    let t;
    return Promise.race([p, new Promise((_, rej) => { t = setTimeout(() => rej(Object.assign(new Error(msg || 'The request timed out.'), { code: 'TIMEOUT', retryable: true, network: true })), ms); })]).finally(() => clearTimeout(t));
  },
  ordinal(n) { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
};

/* ------------------------------------------------------------------ LocalDB (IndexedDB with in-memory fallback) */
const ENTITY = {
  recurringBills: { idField: 'recurringBillId', type: 'RECURRING_BILL' },
  billInstances: { idField: 'billInstanceId', type: 'BILL_INSTANCE' },
  payments: { idField: 'paymentId', type: 'PAYMENT' },
  expenses: { idField: 'expenseId', type: 'EXPENSE' },
  income: { idField: 'incomeId', type: 'INCOME' },
  budgets: { idField: 'budgetId', type: 'BUDGET' },
  categories: { idField: 'categoryId', type: 'CATEGORY' },
  recurringIncome: { idField: 'recurringIncomeId', type: 'RECURRING_INCOME' },
  loans: { idField: 'loanId', type: 'LOAN' },
  loanRepayments: { idField: 'repaymentId', type: 'LOAN_REPAYMENT' },
  goals: { idField: 'goalId', type: 'GOAL' },
  goalDeposits: { idField: 'depositId', type: 'GOAL_DEPOSIT' }
};
const STORES = Object.keys(ENTITY).concat(['meta', 'queue', 'conflicts', 'dashboard', 'syncLog']);

const LocalDB = {
  db: null, memory: null, persistent: false,
  async open() {
    if (!('indexedDB' in self)) return this.useMemory('IndexedDB is not available in this browser');
    try {
      this.db = await new Promise((resolve, reject) => {
        const req = indexedDB.open('petsa-de-peligro', 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          Object.keys(ENTITY).forEach(s => { if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: 'id' }); });
          if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'key' });
          if (!db.objectStoreNames.contains('queue')) db.createObjectStore('queue', { keyPath: 'operationId' }).createIndex('createdAt', 'createdAt');
          if (!db.objectStoreNames.contains('conflicts')) db.createObjectStore('conflicts', { keyPath: 'operationId' });
          if (!db.objectStoreNames.contains('dashboard')) db.createObjectStore('dashboard', { keyPath: 'month' });
          if (!db.objectStoreNames.contains('syncLog')) db.createObjectStore('syncLog', { keyPath: 'id', autoIncrement: true });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
        req.onblocked = () => reject(new Error('Database upgrade blocked by another open tab.'));
      });
      this.db.onversionchange = () => { this.db.close(); location.reload(); };
      return true;
    } catch (e) {
      return this.useMemory(e.message || 'IndexedDB failed to open');
    }
  },
  useMemory(reason) {
    console.warn('LocalDB fallback to memory:', reason);
    this.memory = {}; STORES.forEach(s => { this.memory[s] = new Map(); });
    this.memoryReason = reason;
    return false;
  },
  keyOf(store, rec) { return store === 'meta' ? rec.key : store === 'queue' || store === 'conflicts' ? rec.operationId : store === 'dashboard' ? rec.month : rec.id; },
  run(store, mode, fn) {
    if (this.memory) return Promise.resolve(fn(null));
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(store, mode);
      const os = tx.objectStore(store);
      let result;
      Promise.resolve(fn(os)).then(r => { result = r; });
      tx.oncomplete = () => resolve(result);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error || new Error('Transaction aborted'));
    });
  },
  getAll(store) {
    if (this.memory) return Promise.resolve(Array.from(this.memory[store].values()).map(x => JSON.parse(JSON.stringify(x))));
    return new Promise((resolve, reject) => {
      const req = this.db.transaction(store, 'readonly').objectStore(store).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  },
  put(store, rec) { return this.putMany(store, [rec]); },
  putMany(store, recs) {
    if (!recs.length) return Promise.resolve();
    if (this.memory) { recs.forEach(r => this.memory[store].set(this.keyOf(store, r), JSON.parse(JSON.stringify(r)))); return Promise.resolve(); }
    return this.run(store, 'readwrite', os => { recs.forEach(r => os.put(r)); });
  },
  del(store, key) {
    if (this.memory) { this.memory[store].delete(key); return Promise.resolve(); }
    return this.run(store, 'readwrite', os => { os.delete(key); });
  },
  clear(store) {
    if (this.memory) { this.memory[store].clear(); return Promise.resolve(); }
    return this.run(store, 'readwrite', os => { os.clear(); });
  },
  async addLog(entry) {
    const rec = Object.assign({ at: U.nowIso() }, entry);
    if (this.memory) { rec.id = Date.now() + Math.random(); this.memory.syncLog.set(rec.id, rec); }
    else await this.run('syncLog', 'readwrite', os => { os.add(rec); });
    Store.log.unshift(rec);
    if (Store.log.length > 200) Store.log.length = 200;
  }
};

/* ------------------------------------------------------------------ Store (in-memory mirror of IndexedDB) */
const Store = {
  data: {}, meta: {}, queue: [], conflicts: [], log: [], settings: {}, inFlight: new Set(),
  month: U.curMonth(),
  async load() {
    for (const s of Object.keys(ENTITY)) {
      this.data[s] = new Map((await LocalDB.getAll(s)).map(r => [r.id, r]));
    }
    (await LocalDB.getAll('meta')).forEach(m => { this.meta[m.key] = m.value; });
    this.queue = (await LocalDB.getAll('queue')).sort((a, b) => (a.createdAt < b.createdAt ? -1 : 1));
    this.conflicts = await LocalDB.getAll('conflicts');
    this.log = (await LocalDB.getAll('syncLog')).sort((a, b) => (a.at < b.at ? 1 : -1)).slice(0, 200);
    this.settings = this.meta.settings || {};
    if (!this.meta.clientId) await this.setMeta('clientId', (window.PDP_IOS_BROWSER && window.HomePrep) ? HomePrep.cid() : U.uid('DEV'));
  },
  async setMeta(key, value) { this.meta[key] = value; await LocalDB.put('meta', { key, value }); },
  /** Removes every cached record and queued change (used when this device switches to a different account). */
  async wipeAll() {
    for (const st of Object.keys(ENTITY).concat(['queue', 'conflicts', 'dashboard'])) await LocalDB.clear(st);
    Object.keys(ENTITY).forEach(st => { this.data[st] = new Map(); });
    this.queue = []; this.conflicts = [];
    for (const k of ['lastServerTime', 'lastSyncAt', 'dataResetAt']) await this.setMeta(k, '');
    for (const k of ['wizardDone', 'hideGettingStarted']) await this.setMeta(k, false);
    this.settings = {}; await this.setMeta('settings', {});
  },
  list(store) { return Array.from((this.data[store] || new Map()).values()); },
  get(store, id) { return (this.data[store] || new Map()).get(id) || null; },
  async save(store, rec) {
    if (!rec.id) rec.id = rec[ENTITY[store].idField];
    this.data[store].set(rec.id, rec);
    await LocalDB.put(store, rec);
    return rec;
  },
  async remove(store, id) { this.data[store].delete(id); await LocalDB.del(store, id); },
  categories(type) {
    const list = this.list('categories').filter(c => c.type === type && U.bool(c.isActive)).sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0)).map(c => c.name);
    return list.length ? list : DEFAULT_CATEGORIES[type];
  },
  pendingCount() { return this.queue.filter(o => o.status === 'PENDING' || o.status === 'RETRY').length; },
  failedCount() { return this.queue.filter(o => o.status === 'FAILED' || o.status === 'REJECTED').length; },
  reviewCount() { return this.queue.filter(o => o.status === 'NEEDS_REVIEW').length; }
};

/* ------------------------------------------------------------------ Calc (mirrors Code.gs rules exactly) */
const Calc = {
  status(expected, actual, dueDate, today, isVoid) {
    if (isVoid) return ST.VOID;
    const has = !U.blank(actual);
    const exp = U.cents(expected), act = has ? U.cents(actual) : 0;
    if (has && act > exp) return ST.OVER;
    if (has && act >= exp) return ST.PAID;
    if (dueDate && dueDate < today) return ST.OVERDUE;
    if (has && act > 0) return ST.PARTIAL;
    return ST.UNPAID;
  },
  paymentsByInstance() {
    const map = new Map();
    Store.list('payments').forEach(p => { if (!U.bool(p.isVoid)) { if (!map.has(p.billInstanceId)) map.set(p.billInstanceId, []); map.get(p.billInstanceId).push(p); } });
    return map;
  },
  /** Derived view of an instance from its (local + synced) payments. Never mutates the stored record. */
  derive(inst, payMap, today) {
    const pays = payMap.get(inst.billInstanceId) || [];
    let cents = 0, lastDate = '', lastMethod = '';
    pays.forEach(p => { cents += U.cents(p.amount); if (!lastDate || p.paymentDate >= lastDate) { lastDate = p.paymentDate; lastMethod = p.paymentMethod; } });
    const exp = U.cents(inst.expectedAmount);
    const d = Object.assign({}, inst);
    d.paymentCount = pays.length;
    d.actualAmount = pays.length ? U.fromCents(cents) : '';
    d.remainingAmount = U.fromCents(exp - (pays.length ? cents : 0));
    d.difference = pays.length ? U.fromCents(exp - cents) : '';
    d.paidDate = pays.length && cents >= exp ? lastDate : '';
    if (lastMethod) d.paymentMethod = lastMethod;
    d.isVoid = U.bool(inst.isVoid) && !pays.length;
    d.status = Calc.status(d.expectedAmount, d.actualAmount, d.dueDate, today, d.isVoid);
    d.hasLocal = pays.some(p => p.syncStatus !== 'synced') || (inst.syncStatus && inst.syncStatus !== 'synced');
    return d;
  },
  instances(today) {
    today = today || U.today();
    const payMap = Calc.paymentsByInstance();
    return Store.list('billInstances').map(i => Calc.derive(i, payMap, today));
  },
  budgetFor(month) {
    const row = Store.list('budgets').find(b => b.month === month);
    if (row && !U.blank(row.plannedAmount)) return { amount: Number(row.plannedAmount), source: 'month', row };
    const def = Number(Store.settings.defaultMonthlyBudget || 0);
    return { amount: isFinite(def) ? def : 0, source: 'default', row: null };
  },
  summary(month, instances, today) {
    today = today || U.today();
    instances = instances || Calc.instances(today);
    const c = { expectedBills: 0, actualBills: 0, paidBills: 0, unpaidBills: 0, partialBills: 0, overdueBills: 0, overBudgetAmount: 0, unpaidAmount: 0, otherExpenses: 0, expectedIncome: 0, actualIncome: 0, projected: 0 };
    const counts = { PAID: 0, PARTIAL: 0, UNPAID: 0, OVERDUE: 0, 'OVER BUDGET': 0 };
    const byCategory = {}, byBill = {};
    instances.forEach(i => {
      if (i.billingPeriod !== month || i.isVoid) return;
      const exp = U.cents(i.expectedAmount), act = U.cents(i.actualAmount);
      c.expectedBills += exp; c.actualBills += act; c.projected += Math.max(exp, act);
      if (counts[i.status] !== undefined) counts[i.status]++;
      if (i.status === ST.PAID || i.status === ST.OVER) c.paidBills += act;
      else c.unpaidAmount += Math.max(0, exp - act);
      if (i.status === ST.UNPAID) c.unpaidBills += exp;
      if (i.status === ST.PARTIAL) c.partialBills += Math.max(0, exp - act);
      if (i.status === ST.OVERDUE) c.overdueBills += Math.max(0, exp - act);
      if (act > exp) c.overBudgetAmount += act - exp;
      const cat = i.category || 'Other'; byCategory[cat] = (byCategory[cat] || 0) + act;
      const bk = i.recurringBillId || i.billName;
      if (!byBill[bk]) byBill[bk] = { name: i.billName, expected: 0, actual: 0 };
      byBill[bk].expected += exp; byBill[bk].actual += act;
    });
    Store.list('expenses').forEach(e => {
      if (U.bool(e.isDeleted) || String(e.date).slice(0, 7) !== month) return;
      const a = U.cents(e.amount); c.otherExpenses += a;
      const cat = e.category || 'Other'; byCategory[cat] = (byCategory[cat] || 0) + a;
    });
    Store.list('income').forEach(r => {
      if (U.bool(r.isDeleted) || r.status === 'CANCELLED' || String(r.date).slice(0, 7) !== month) return;
      c.expectedIncome += U.cents(r.expectedAmount); c.actualIncome += U.cents(r.actualAmount);
    });
    const planned = Calc.budgetFor(month);
    const budgetCents = Math.round(planned.amount * 100);
    const totalSpent = c.actualBills + c.otherExpenses;
    const f = U.fromCents;
    const s = {
      month, monthlyBudget: f(budgetCents), budgetSource: planned.source,
      expectedBills: f(c.expectedBills), actualBills: f(c.actualBills), paidBills: f(c.paidBills), unpaidBills: f(c.unpaidBills),
      partialBills: f(c.partialBills), overdueBills: f(c.overdueBills), overBudgetBills: f(c.overBudgetAmount),
      unpaidAmount: f(c.unpaidAmount), overBudgetAmount: f(c.overBudgetAmount), otherExpenses: f(c.otherExpenses),
      expectedIncome: f(c.expectedIncome), actualIncome: f(c.actualIncome), totalMoneyIn: f(c.actualIncome), totalMoneyOut: f(totalSpent),
      totalSpent: f(totalSpent), projectedSpend: f(c.projected + c.otherExpenses), remaining: f(budgetCents - totalSpent),
      netCashFlow: f(c.actualIncome - c.actualBills - c.otherExpenses), counts,
      byCategory: Object.keys(byCategory).map(k => ({ category: k, amount: f(byCategory[k]) })).filter(x => x.amount > 0).sort((a, b) => b.amount - a.amount),
      byBill: Object.keys(byBill).map(k => ({ name: byBill[k].name, expected: f(byBill[k].expected), actual: f(byBill[k].actual) })).sort((a, b) => b.expected - a.expected)
    };
    s.budget = Calc.budget(s, today, Number(Store.settings.watchThreshold || 0.9));
    return s;
  },
  budget(s, today, watch) {
    const budget = s.monthlyBudget, reasons = [];
    let health = 'ON TRACK';
    const basis = budget > 0 ? budget : s.expectedBills;
    const used = basis > 0 ? s.totalSpent / basis : (s.totalSpent > 0 ? 1 : 0);
    const cm = today.slice(0, 7);
    const elapsed = s.month < cm ? 1 : s.month > cm ? 0 : (+today.slice(8, 10)) / U.dim(+cm.slice(0, 4), +cm.slice(5, 7));
    const P = n => U.peso(n);
    if (basis > 0 && s.totalSpent > basis) { health = 'OVER BUDGET'; reasons.push('Spending exceeds the budget by ' + P(s.totalSpent - basis) + '.'); }
    else {
      if (basis > 0 && s.projectedSpend > basis) reasons.push('Projected spending ' + P(s.projectedSpend) + ' exceeds the budget by ' + P(s.projectedSpend - basis) + '.');
      if (basis > 0 && used >= (watch || 0.9)) reasons.push(Math.round(used * 100) + '% of the budget is already used.');
      if (s.counts.OVERDUE > 0) reasons.push(s.counts.OVERDUE + ' overdue bill' + (s.counts.OVERDUE > 1 ? 's' : '') + ' (' + P(s.overdueBills) + ' outstanding).');
      if (s.counts['OVER BUDGET'] > 0) reasons.push(s.counts['OVER BUDGET'] + ' bill' + (s.counts['OVER BUDGET'] > 1 ? 's' : '') + ' paid above the expected amount (+' + P(s.overBudgetAmount) + ').');
      if (basis > 0 && elapsed > 0 && elapsed < 1 && used > elapsed + 0.15 && used < (watch || 0.9)) reasons.push('Spending pace (' + Math.round(used * 100) + '% used) is ahead of the month (' + Math.round(elapsed * 100) + '% elapsed).');
      if (s.expectedIncome > 0 && s.projectedSpend > s.expectedIncome) reasons.push('Expected income ' + P(s.expectedIncome) + ' does not cover projected spending.');
      if (reasons.length) health = 'WATCH';
    }
    return { health, reasons, budget, basis: U.round2(basis), totalSpent: s.totalSpent, projectedSpend: s.projectedSpend, remaining: U.round2(basis - s.totalSpent), percentUsed: U.round2(used * 100), percentProjected: basis > 0 ? U.round2(s.projectedSpend / basis * 100) : 0, monthElapsed: U.round2(elapsed * 100) };
  },
  payDueText(b) {
    const v = +b.payDueValue;
    switch (b.payDueRule) {
      case 'SAME_MONTH': return 'due the ' + U.ordinal(v || 1);
      case 'NEXT_MONTH': return 'due the ' + U.ordinal(v || 1) + ' of next month';
      case 'DAYS_AFTER': return 'due ' + v + ' day' + (v === 1 ? '' : 's') + ' after';
      default: return 'due on arrival';
    }
  },
  /** "Arrives Oct 20 · Due Fri, Nov 13" style text for a bill instance. */
  datesText(i, today) {
    const arr = i.arrivalDate && i.arrivalDate !== i.dueDate ? i.arrivalDate : '';
    if (!arr) return 'Due ' + U.fmtDay(i.dueDate);
    return (arr > (today || U.today()) ? 'Arrives ' : 'Arrived ') + U.fmtDate(arr).replace(/, \d{4}$/, '') + ' · Due ' + U.fmtDay(i.dueDate);
  },
  upcoming(month, instances, today) {
    const cm = today.slice(0, 7);
    const horizon = U.addDays(today, 30);
    return instances.filter(i => !i.isVoid && i.status !== ST.PAID && i.status !== ST.OVER && i.status !== ST.OVERDUE &&
      (month === cm ? (i.dueDate >= today && (i.arrivalDate || i.dueDate) <= horizon) : i.billingPeriod === month))
      .sort((a, b) => (a.dueDate < b.dueDate ? -1 : a.dueDate > b.dueDate ? 1 : 0)).slice(0, 12);
  },
  /**
   * Savings per month, counted by the date money actually moved:
   *   saved = income received − bill payments − other expenses (from the starting-balance date on).
   * Running total = sum of monthly savings; cash on hand = starting balance + running total.
   */
  savings(today) {
    today = today || U.today();
    const st = Store.settings || {};

/** A friendly name for this phone, shown to the app owner (e.g. "Android · Chrome · app"). */
function deviceLabel() {
  const ua = navigator.userAgent || '';
  const os = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) ? 'iPad' : /Android/.test(ua) ? 'Android' : /Windows/.test(ua) ? 'Windows' : /Mac/.test(ua) ? 'Mac' : 'Device';
  const br = /SamsungBrowser/.test(ua) ? 'Samsung Internet' : /FBAN|FBAV|Messenger/.test(ua) ? 'Facebook' : /Edg\//.test(ua) ? 'Edge' : /CriOS|Chrome/.test(ua) ? 'Chrome' : /FxiOS|Firefox/.test(ua) ? 'Firefox' : /Safari/.test(ua) ? 'Safari' : 'Browser';
  let app = false;
  try { app = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) { /* ignore */ }

}

/* ------------------------------------------------------------------ Subscription (trial / paid / grace / expired) */
const Account = {

  status() {

    if (!a) return '';
    if (a.status === 'SUSPENDED' || a.status === 'EXPIRED') return a.status;   // server verdict stands until the server says otherwise
    const t = U.today();                                                         // otherwise let time pass offline too
    if (a.paidUntil && a.paidUntil >= t) return 'ACTIVE';
    if (a.trialEndsAt && a.trialEndsAt >= t) return 'TRIAL';

  locked() { const s = this.status(); return s === 'EXPIRED' || s === 'SUSPENDED'; },
  daysLeft() {

      if (q.localId === oldId) { q.localId = newId; changed = true; }
      if (q.entityId === oldId) { q.entityId = newId; changed = true; }
      if (q.payload && q.payload[ENTITY[store].idField] === oldId) { q.payload[ENTITY[store].idField] = newId; changed = true; }

  },
  /** Merge server records. Local records with unsynced edits are kept (their queued ops will win or conflict on the server). */
  async mergeRecords(recs, fromOwnOp) {

    const pendingIds = new Set(Store.queue.map(q => q.localId || q.entityId).filter(Boolean));
    for (const store of Object.keys(ENTITY)) {
      const list = recs[store];
      if (!Array.isArray(list) || !list.length) continue;

      for (const r of list) {

        if (!id) continue;

    let data = await Api.call('getAllData', { since, month: opts.month || Store.month }, { timeout: 45000 });

      const pendingIds = new Set(Store.queue.map(q => q.localId || q.entityId));
      const map = { goals: data.goals, goalDeposits: data.goalDeposits, loans: data.loans, loanRepayments: data.loanRepayments, recurringIncome: data.recurringIncome, recurringBills: data.recurringBills, billInstances: data.billInstances, payments: data.payments, expenses: data.expenses, income: data.income, budgets: data.budgets, categories: data.categories };

  schedule(ms) {
    clearTimeout(this.timer);

  },
  start() {

    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') this.run(); });
    setInterval(() => {
      if (!Api.configured()) return;
      const due = Store.queue.some(o => (o.status === 'PENDING' || o.status === 'RETRY') && (!o.nextAttemptAt || o.nextAttemptAt <= Date.now()));

  },
  /**
   * Save path used by every form: the operation is persisted locally first, then (if online)
   * pushed immediately. Returns 'synced' | 'local' | 'review' | 'rejected'.

  async commit(op) {
    await this.enqueue(op);

    if (q.status === 'NEEDS_REVIEW') return 'review';
    if (q.status === 'REJECTED') { this.lastRejection = q.lastError; return 'rejected'; }
    return 'local';
  }
};

/* =============================================================================
 *  SMART FINANCIAL INSIGHT ENGINE  (shared — the identical code runs in Code.gs
 *  and in index.html, so the phone gives the same answer offline as the server)
 *
 *  Rule-based, deterministic: every sentence is built from the household's own
 *  records. No AI model is involved. The result object is the contract a future
 *  AI commentary provider would receive (as `facts`) and return text for.
 *
 *  Safe to spend =  money available now
 *                 + expected income still to arrive this month
 *                 − every unpaid bill this month (and older overdue bills)
 *                 − expected everyday spending for the rest of the month
 *                 − a safety buffer
 * ========================================================================== */
var FinancialInsight = (function () {
  var RULES_VERSION = '1.0';
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  function c(v) { if (v === '' || v === null || v === undefined) return 0; var n = Number(v); return isFinite(n) ? Math.round(n * 100) : 0; }
  function f(cents) { return Math.round(cents) / 100; }
  function blank(v) { return v === '' || v === null || v === undefined; }
  function bool(v) { return v === true || String(v).toLowerCase() === 'true'; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function dim(ym) { return new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7), 0)).getUTCDate(); }
  function addMonths(ym, n) { var i = (+ym.slice(0, 4)) * 12 + (+ym.slice(5, 7) - 1) + n; return Math.floor(i / 12) + '-' + pad(i % 12 + 1); }
  function peso(cents) { var neg = cents < 0; var v = Math.round(Math.abs(cents) / 100); return (neg ? '-' : '') + '₱' + String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function dshort(s) { return s ? MON[+s.slice(5, 7) - 1] + ' ' + (+s.slice(8, 10)) : ''; }
  function monthName(ym) { return MONTH_NAMES[+ym.slice(5, 7) - 1]; }
  function joinList(a) { return a.length <= 1 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]; }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }
  function open(i) { return i.status !== 'PAID' && i.status !== 'OVER BUDGET' && !bool(i.isVoid); }

  /**
   * @param {Object} d { today:'YYYY-MM-DD', month:'YYYY-MM', instances:[derived bill instances],
   *                     income:[], payments:[], expenses:[], budgets:[], settings:{} }
   */
  function generate(d) {
    var today = d.today, M = d.month, cm = today.slice(0, 7);
    var mode = M === cm ? 'current' : (M < cm ? 'past' : 'future');
    var monthEnd = M + '-' + pad(dim(M));
    var st = d.settings || {};
    var instances = d.instances || [];

    /* ---------- income ---------- */
    var expInc = 0, actInc = 0, pending = 0, upcomingInc = 0, late = 0, lateItems = [], incomingItems = [];
    (d.income || []).forEach(function (r) {
      if (bool(r.isDeleted) || r.status === 'CANCELLED' || String(r.date).slice(0, 7) !== M) return;
      var e = c(r.expectedAmount), a = c(r.actualAmount);
      expInc += e; actInc += a;
      if (blank(r.actualAmount)) {
        pending += e;
        if (mode === 'future' || String(r.date) >= today) { upcomingInc += e; incomingItems.push(r); }
        else { late += e; lateItems.push(r); }
      }
    });
    incomingItems.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    lateItems.sort(function (a, b) { return a.date < b.date ? -1 : 1; });

    /* ---------- bills ---------- */
    var recurring = 0, paid = 0, remaining = 0, unpaid = [], overBills = [];
    instances.forEach(function (i) {
      if (bool(i.isVoid) || i.billingPeriod !== M) return;
      var e = c(i.expectedAmount), a = c(i.actualAmount);
      recurring += e; paid += a;
      if (open(i) && e - a > 0) { remaining += e - a; unpaid.push({ name: i.billName, amount: e - a, dueDate: i.dueDate, status: i.status, id: i.billInstanceId }); }
      if (a > e) overBills.push({ name: i.billName, over: a - e });
    });
    var carried = 0, carriedList = [];
    if (mode !== 'past') {
      instances.forEach(function (i) {
        if (bool(i.isVoid) || i.billingPeriod >= M || !open(i)) return;
        var rem = c(i.expectedAmount) - c(i.actualAmount);
        if (rem > 0) { carried += rem; carriedList.push({ name: i.billName, amount: rem, dueDate: i.dueDate, status: i.status, id: i.billInstanceId }); }
      });
    }
    var obligations = unpaid.concat(carriedList).sort(function (a, b) { return a.dueDate < b.dueDate ? -1 : a.dueDate > b.dueDate ? 1 : b.amount - a.amount; });
    var totalRemaining = remaining + carried;
    var overdue = obligations.filter(function (o) { return o.dueDate < today; });
    var overdueAmt = overdue.reduce(function (s, o) { return s + o.amount; }, 0);

    /* ---------- other expenses & history ---------- */
    var other = 0, byCat = {}, histOther = {}, histCat = {};
    var h1 = addMonths(M, -3), h3 = addMonths(M, -1);
    (d.expenses || []).forEach(function (e) {
      if (bool(e.isDeleted)) return;
      var m = String(e.date).slice(0, 7), a = c(e.amount), cat = e.category || 'Other';
      if (m === M) { other += a; byCat[cat] = (byCat[cat] || 0) + a; }
      else if (m >= h1 && m <= h3) { histOther[m] = (histOther[m] || 0) + a; histCat[cat] = (histCat[cat] || 0) + a; }
    });
    var histMonths = Object.keys(histOther).length;
    var histAvg = histMonths ? Object.keys(histOther).reduce(function (s, k) { return s + histOther[k]; }, 0) / histMonths : 0;

    /* ---------- budget ---------- */
    var budget = 0, row = null;
    (d.budgets || []).forEach(function (b) { if (b.month === M) row = b; });
    if (row && !blank(row.plannedAmount)) budget = c(row.plannedAmount); else budget = c(st.defaultMonthlyBudget || 0);
    var spent = paid + other;
    var budgetRemaining = budget - spent;
    var budgetUsed = budget > 0 ? spent / budget : 0;

    /* ---------- days, planned everyday spending, buffer ---------- */
    var day = +today.slice(8, 10), days = dim(M);
    var daysLeft = mode === 'current' ? days - day : mode === 'future' ? days : 0;
    var planned = 0;
    if (mode === 'current') {
      var daily = Math.max(day > 0 ? other / day : 0, histAvg / 30);
      planned = Math.round(daily * daysLeft);
    } else if (mode === 'future') planned = Math.round(histAvg);
    var buffer = mode === 'past' ? 0 : Math.max(200000, Math.round(expInc * 0.05));

    /* ---------- available money ---------- */
    var openingDate = /^\d{4}-\d{2}-\d{2}$/.test(String(st.openingBalanceDate || '')) ? st.openingBalanceDate : '0000-01-01';
    var cash = c(st.openingBalance || 0);
    (d.income || []).forEach(function (r) { if (!bool(r.isDeleted) && r.status !== 'CANCELLED' && !blank(r.actualAmount) && String(r.date) >= openingDate && String(r.date) <= today) cash += c(r.actualAmount); });
    (d.payments || []).forEach(function (p) { if (!bool(p.isVoid) && String(p.paymentDate) >= openingDate && String(p.paymentDate) <= today) cash -= c(p.amount); });
    (d.expenses || []).forEach(function (e) { if (!bool(e.isDeleted) && String(e.date) >= openingDate && String(e.date) <= today) cash -= c(e.amount); });
    (d.loans || []).forEach(function (l) { if (!bool(l.isDeleted) && String(l.dateLent) >= openingDate && String(l.dateLent) <= today) cash -= c(l.amount); });
    (d.loanRepayments || []).forEach(function (r) { if (!bool(r.isVoid) && String(r.date) >= openingDate && String(r.date) <= today) cash += c(r.amount); });
    /* money lent out that is still owed (expected back, but never counted as spendable) */
    var owed = 0, overdueLoans = [], dueSoonLoans = [];
    (d.loans || []).forEach(function (l) {
      if (bool(l.isDeleted) || bool(l.writtenOff)) return;
      var paidBack = 0;
      (d.loanRepayments || []).forEach(function (r) { if (r.loanId === l.loanId && !bool(r.isVoid)) paidBack += c(r.amount); });
      var rem = c(l.amount) - paidBack;
      if (rem <= 0) return;
      owed += rem;
      if (l.dueDate && l.dueDate < today) overdueLoans.push({ borrower: l.borrower, amount: rem, dueDate: l.dueDate });
      else if (l.dueDate && l.dueDate <= addDaysStr(today, 7)) dueSoonLoans.push({ borrower: l.borrower, amount: rem, dueDate: l.dueDate });
    });
    /* money set aside for savings goals (still yours, but not spendable) */
    var liveGoals = {};
    (d.goals || []).forEach(function (g) { if (!bool(g.isDeleted)) liveGoals[g.goalId] = true; });
    var setAside = 0;
    (d.goalDeposits || []).forEach(function (r) { if (!bool(r.isVoid) && liveGoals[r.goalId] && String(r.date) <= today) setAside += c(r.amount); });
    setAside = Math.max(0, setAside);
    var available, stillComing;
    if (mode === 'current') { available = cash - setAside; stillComing = upcomingInc; }
    else if (mode === 'future') { available = 0; stillComing = pending; }
    else { available = actInc - paid - other; stillComing = 0; }
    var safe = available + stillComing - totalRemaining - planned - buffer;

    /* ---------- next income & cash crunch (current month) ---------- */
    var nextIncome = incomingItems[0] || null;
    var crunch = null;
    if (mode === 'current') {
      var horizon = nextIncome ? nextIncome.date : monthEnd;
      var before = obligations.filter(function (o) { return o.dueDate <= horizon && (!nextIncome || o.dueDate < nextIncome.date); });
      var beforeAmt = before.reduce(function (s, o) { return s + o.amount; }, 0);
      if (beforeAmt > 0 && beforeAmt > cash) crunch = { amount: beforeAmt, cash: cash, count: before.length, until: nextIncome ? nextIncome.date : '' };
    }

    /* ---------- important upcoming bills ---------- */
    var upcoming = obligations.filter(function (o) { return mode === 'past' || o.dueDate >= today; });
    var majors = upcoming.slice().sort(function (a, b) { return b.amount - a.amount; }).slice(0, 3)
      .sort(function (a, b) { return a.dueDate < b.dueDate ? -1 : 1; });
    var E = Math.max(expInc, 1);
    var money = available + stillComing;

    /* ---------- status ---------- */

    if (mode === 'past') {
