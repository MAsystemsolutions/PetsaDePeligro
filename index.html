  async 'clear-local'() {
    const n = Store.queue.length;
    const ok = await Modal.confirm('Clear the local cache?', n ? `<b class="neg">${n} change(s) have not been synced and would be lost.</b> Sync first, or download a backup.` : 'Cached data on this device will be removed and downloaded again from Google Sheets. Nothing in the spreadsheet is affected.', n ? 'Clear anyway' : 'Clear cache', true);
    if (!ok) return;
    for (const s of Object.keys(ENTITY).concat(['queue', 'conflicts', 'dashboard'])) await LocalDB.clear(s);
    Object.keys(ENTITY).forEach(s => { Store.data[s] = new Map(); });
    Store.queue = []; Store.conflicts = [];
    await Store.setMeta('lastServerTime', ''); await Store.setMeta('lastSyncAt', '');
    UI.render(); UI.toast('Local cache cleared.');

  async install() {
    if (UI.deferredInstall) {
      const ev = UI.deferredInstall;

      let choice = null;
      try { choice = await ev.userChoice; } catch (e) { /* ignore */ }

      updateInstallUI();
      if (choice && choice.outcome === 'accepted') UI.toast('Installing ' + APP_NAME + '…');
      return;
    }
    if (InstallGuide.platform().phone) InstallGuide.open(true); else Forms.installHelp();
  },
  'install-guide'() { InstallGuide.open(true); },
  'install-guide-later'() { InstallGuide.later(); },
  async 'install-guide-go'() {
    const ev = UI.deferredInstall;
    InstallGuide.close();
    if (ev) return Actions.install();
  }
};

  { key: 'tuition', name: 'Tuition / School', category: 'Other', day: 1 },
  { key: 'insurance', name: 'Insurance', category: 'Insurance', day: 1 },
  { key: 'subscriptions', name: 'Streaming (Netflix, Spotify…)', category: 'Subscriptions', day: 1 },
  { key: 'helper', name: 'Kasambahay / Helper', category: 'Household Help', day: 30, freq: 'WEEKLY', weekday: 6 },
  { key: 'pet', name: 'Pet food', category: 'Pet', day: 1, freq: 'WEEKLY', weekday: 6 }
];
const WZ_INCOME_TYPES = [
  { label: 'Salary', category: 'Salary' }, { label: 'Side income', category: 'Side Income' }, { label: 'Freelance', category: 'Freelance' },
  { label: 'Business', category: 'Other' }, { label: 'Allowance', category: 'Other' }, { label: 'Pension', category: 'Other' }
];
const WZ_FREQ = [
  { v: 'MONTHLY', label: 'Once a month' }, { v: 'TWICE', label: 'Twice a month', sub: 'e.g. 15th and 30th' },
  { v: 'WEEKLY', label: 'Every week' }, { v: 'BIWEEKLY', label: 'Every 2 weeks' }
];
const WZ_WEEKEND = [
  { v: 'WEEKEND_TO_FRIDAY', label: 'The Friday before' }, { v: 'WEEKEND_TO_MONDAY', label: 'The Monday after' },
  { v: 'SUNDAY_TO_MONDAY', label: 'Only Sunday moves to Monday' }, { v: 'NONE', label: 'Same day, even on weekends' }
];
const SHORT_DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

function ordinal(n) { n = +n; const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
function wzMoney(v) { const n = Number(String(v === undefined || v === null ? '' : v).replace(/[₱,\s]/g, '')); return isFinite(n) && String(v).trim() !== '' ? Math.round(n * 100) / 100 : NaN; }

const Wizard = {
  el: null, idx: 0, st: null, saving: false, result: null,

  /** Opens automatically once: connected, active, data loaded, and nothing set up yet. */
  maybeOpen() {
    if (this.el || IS_GAS || !Api.configured() || Account.locked() || Store.meta.deviceBlocked || Store.meta.wizardDone || !Store.meta.lastSyncAt) return;
    if (Store.list('recurringIncome').length || Store.list('recurringBills').length) return;
    this.open();
  },
  open(rerun) {
    this.rerun = !!rerun;
    const a = Account.info || {};
    const nm = Store.settings.householdName && Store.settings.householdName !== APP_NAME ? Store.settings.householdName : (a.customerName || '');
    this.st = { name: nm, incomeCount: 0, incomes: [], bills: [], picked: [], custom: [], budget: '', balance: '', wantsGoal: null, goal: { name: '', targetAmount: '', targetDate: '' } };
    this.idx = 0; this.result = null; this.saving = false;
    this.el = document.createElement('div');
    this.el.className = 'wz'; this.el.id = 'wizard';
    this.el.setAttribute('role', 'dialog'); this.el.setAttribute('aria-modal', 'true');
    document.body.appendChild(this.el);
    document.body.classList.add('wz-open');
    const tb = document.getElementById('toasts'); if (tb) tb.innerHTML = '';
    this.el.addEventListener('input', () => { const e = this.el.querySelector('#wzErr'); if (e) e.classList.remove('show'); });
    this.el.addEventListener('click', e => this.onClick(e));
    this.el.addEventListener('submit', e => { e.preventDefault(); this.next(); });
    this.render();
  },
  close(done) {
    if (this.el) this.el.remove();
    this.el = null;
    document.body.classList.remove('wz-open');
    if (done) Store.setMeta('wizardDone', true);
    UI.render();
  },
  newIncome() { return { type: '', name: '', category: 'Salary', freq: '', day: '', day2: '', weekday: '', anchor: '', amount: '', amount2: '', weekend: '' }; },

  /** The question list is rebuilt from the answers so far (e.g. one set of questions per income and per bill). */
  steps() {
    const s = this.st, out = ['intro', 'name', 'incCount'];
    s.incomes.forEach((inc, i) => {
      out.push('incType:' + i, 'incFreq:' + i, 'incWhen:' + i, 'incAmount:' + i);
      if (inc.freq !== 'WEEKLY') out.push('incWeekend:' + i);
    });
    out.push('billsPick');
    s.bills.forEach((b, i) => out.push('bill:' + i));
    out.push('budget', 'goalAsk');
    if (s.wantsGoal) out.push('goal');
    out.push('balance', 'review', 'done');
    return out;
  },
  cur() { const id = this.steps()[this.idx] || 'intro'; const [k, n] = id.split(':'); return { id, k, i: n === undefined ? -1 : +n }; },

  /* ---------------- rendering ---------------- */
  render() {
    if (!this.el) return;
    const steps = this.steps(), c = this.cur();
    const q = this.screen(c);
    const qCount = steps.length - 2;      // intro and done are not questions
    const pos = Math.max(0, Math.min(qCount, this.idx));
    const showNav = c.k !== 'intro' && c.k !== 'done';
    this.el.innerHTML = `<div class="wz-inner">
      <div class="wz-top">${showNav ? `<button type="button" class="wz-back" data-wz="back" aria-label="Back">‹ Back</button>` : '<span></span>'}
        ${showNav ? `<div class="wz-bar" aria-hidden="true"><i style="width:${Math.round(pos / qCount * 100)}%"></i></div>` : '<div class="wz-bar hidden"></div>'}
        ${this.rerun && c.k !== 'done' ? '<button type="button" class="wz-skipall" data-wz="skipall">Exit</button>' : '<span></span>'}</div>
      <form class="wz-card" autocomplete="off" novalidate>
        ${q.eyebrow ? `<div class="wz-eyebrow">${q.eyebrow}</div>` : ''}
        <h2 class="wz-title">${q.title}</h2>
        ${q.sub ? `<p class="wz-sub">${q.sub}</p>` : ''}
        <div class="wz-body">${q.body || ''}</div>
        <div class="wz-err" id="wzErr" role="alert"></div>
        <div class="wz-actions">${q.actions !== undefined ? q.actions : `${q.skip ? `<button type="button" class="btn wz-skip" data-wz="skip">${q.skip}</button>` : ''}<button type="submit" class="btn primary wz-next">${q.next || 'Next'}</button>`}</div>
      </form></div>`;
    if (c.k === 'goal') { this.el.querySelector('form').addEventListener('input', () => this.goalCheck()); this.goalCheck(); }
    const f = this.el.querySelector('.wz-card input:not([type=hidden])');

  },
  money(name, val, ph) { return `<div class="wz-money"><span>₱</span><input name="${name}" inputmode="decimal" placeholder="${ph || '0'}" value="${U.esc(val === '' || val === undefined ? '' : val)}"></div>`; },
  chips(name, list, sel, opts) {
    opts = opts || {};
    return `<div class="wz-chips${opts.cls ? ' ' + opts.cls : ''}">${list.map(o => `<button type="button" class="wz-chip${String(sel) === String(o.v) ? ' on' : ''}" data-chip="${name}" data-v="${U.esc(o.v)}"${opts.auto ? ' data-auto="1"' : ''}>${U.esc(o.label)}${o.sub ? `<small>${U.esc(o.sub)}</small>` : ''}</button>`).join('')}</div><input type="hidden" name="${name}" value="${U.esc(sel === undefined ? '' : sel)}">`;
  },
  dayGrid(name, sel) {
    let h = `<div class="wz-days">`;
    for (let d = 1; d <= 31; d++) h += `<button type="button" class="wz-day${+sel === d ? ' on' : ''}" data-chip="${name}" data-v="${d}">${d}</button>`;
    return h + `</div><input type="hidden" name="${name}" value="${U.esc(sel || '')}"><p class="wz-hint">For 29–31, shorter months use their last day.</p>`;
  },
  weekdays(name, sel) { return this.chips(name, [1, 2, 3, 4, 5, 6, 0].map(d => ({ v: d, label: SHORT_DAYS[d] })), sel, { cls: 'wz-week' }); },

  screen(c) {

        body: `<div class="wz-intro"><div class="gate-logo">₱</div><ol><li>How many incomes you have, and their paydays</li><li>Your regular bills</li><li>Your monthly budget and the money you have now</li></ol><p class="wz-hint">You can change any of your answers later in the app.</p></div>`,

        body: this.chips('count', [1, 2, 3, 4, 5, 6].map(n => ({ v: n, label: n === 6 ? '6 or more' : String(n) })), s.incomeCount || '', { cls: 'wz-count', auto: true }), actions: s.incomeCount ? undefined : ''
      };
      case 'incType': return {
        eyebrow: nth, title: s.incomes.length === 1 ? 'What is your income?' : c.i === 0 ? 'Let’s start with your main income' : `Income number ${c.i + 1}`,
        sub: c.i === 0 ? 'Choose a type and give it a name you’ll recognize.' : 'For example your partner’s salary, a side job or rental income.',
        body: `${this.chips('type', WZ_INCOME_TYPES.map(t => ({ v: t.label, label: t.label })), inc.type)}<label class="wz-label" for="wzIncName">Name it</label><input id="wzIncName" class="wz-input" name="incName" maxlength="60" placeholder="e.g. Salary – Company name" value="${U.esc(inc.name)}">`
      };
      case 'incFreq': return {
        eyebrow: nth, title: `How often do you get ${incLabel}?`,

      };
      case 'incWhen': {

          body: `<div class="wz-two"><label>First payday<select class="wz-input" name="day">${this.dayOpts(inc.day || 15)}</select></label><label>Second payday<select class="wz-input" name="day2">${this.dayOpts(inc.day2 || 30)}</select></label></div>`
        };

        if (inc.freq === 'BIWEEKLY') return {
          eyebrow: nth, title: 'When was your last payday?', sub: 'We count every 2 weeks from this date. If it hasn’t started yet, pick the first payday.',
          body: `<input class="wz-input" type="date" name="anchor" value="${U.esc(inc.anchor || U.today())}">`
        };
        return { eyebrow: nth, title: 'What day of the month do you get paid?', body: this.dayGrid('day', inc.day) };
      }
      case 'incAmount': {
        if (inc.freq === 'TWICE') return {
          eyebrow: nth, title: 'How much do you receive each payday?', sub: 'Your take-home pay (after deductions). A usual amount is fine.',
          body: `<label class="wz-label">On the ${ordinal(inc.day || 15)}</label>${this.money('amount', inc.amount)}<label class="wz-label">On the ${ordinal(inc.day2 || 30)}</label>${this.money('amount2', inc.amount2 === '' ? inc.amount : inc.amount2)}`
        };
        return {
          eyebrow: nth, title: `How much do you receive ${inc.freq === 'WEEKLY' ? 'each week' : inc.freq === 'BIWEEKLY' ? 'every 2 weeks' : 'each payday'}?`,
          sub: 'Your take-home pay (after deductions). A usual amount is fine — you’ll type the exact amount when it arrives.',

        eyebrow: nth, title: 'If payday falls on a weekend, when does the money arrive?',
        body: this.chips('weekend', WZ_WEEKEND, inc.weekend, { auto: true, cls: 'wz-stack' })
      };
      case 'billsPick': {
        const all = WZ_BILLS.concat(s.custom.map(n => ({ key: 'custom:' + n, name: n })));
        return {
          eyebrow: '🧾 Bills', title: 'Which bills do you pay regularly?', sub: 'Tap all that apply. Next, we’ll ask how much and when each is due.',
          body: `<div class="wz-chips wz-multi">${all.map(b => `<button type="button" class="wz-chip${s.picked.includes(b.key) ? ' on' : ''}" data-toggle="${U.esc(b.key)}">${U.esc(b.name)}</button>`).join('')}</div>
            <div class="wz-addrow"><input class="wz-input" id="wzCustom" maxlength="60" placeholder="Something else? e.g. Car loan, Gym"><button type="button" class="btn" data-wz="addcustom">Add</button></div>`,
          skip: 'I have no regular bills', next: s.picked.length ? `Next (${s.picked.length})` : 'Next'
        };
      }
      case 'bill': {
        const b = s.bills[c.i];
        return {
          eyebrow: `🧾 Bill ${c.i + 1} of ${s.bills.length}`, title: billEmoji(b.name, b.category) + ' ' + U.esc(b.name), sub: 'How much is it usually, and when is it due?',
          body: `${this.money('amount', b.amount)}
            ${this.chips('freq', [{ v: 'MONTHLY', label: 'Every month' }, { v: 'WEEKLY', label: 'Every week' }], b.freq, { cls: 'wz-seg' })}
            <div data-for="MONTHLY" ${b.freq === 'WEEKLY' ? 'hidden' : ''}><label class="wz-label">Due day</label>${this.dayGrid('day', b.day)}</div>
            <div data-for="WEEKLY" ${b.freq === 'WEEKLY' ? '' : 'hidden'}><label class="wz-label">Paid every</label>${this.weekdays('weekday', b.weekday)}</div>`
        };
      }
      case 'budget': {
        const billsM = this.totals().bills;
        const sugg = [0, 5000, 10000, 15000, 20000].map(x => Math.ceil((billsM + x) / 500) * 500).filter((x, i, a) => x > 0 && a.indexOf(x) === i);
        return {
          eyebrow: '💰 Budget', title: 'What’s your monthly budget?',
          sub: `The total you’ll allow yourself to spend each month — your bills plus daily needs like food, transport and load.${billsM ? ` Your bills alone come to about <b>${U.peso(billsM)}</b> a month.` : ''}`,
          body: `${this.money('budget', s.budget)}${this.chips('budgetQuick', sugg.map(v => ({ v, label: U.peso(v).replace('.00', '') })), '', { cls: 'wz-quick' })}`
        };
      }
      case 'goalAsk': return {
        eyebrow: '🎯 Goal', title: 'Are you saving for something?',
        sub: `Like an emergency fund, Christmas, a trip or a new phone. With your plan, about <b>${U.peso(Math.max(0, this.totals().left))}</b> a month is left after your budget.`,
        body: this.chips('wants', [{ v: 'yes', label: 'Yes, I have a goal' }, { v: 'no', label: 'Not right now' }], s.wantsGoal === null ? '' : (s.wantsGoal ? 'yes' : 'no'), { auto: true, cls: 'wz-stack' }), actions: ''
      };

          eyebrow: '🎯 Goal', title: 'What’s your goal?', sub: 'Pick an idea or type your own. We’ll check if it’s possible with your income and budget.',
          body: `<div class="wz-chips wz-quick">${ideas.map((g, i) => `<button type="button" class="wz-chip" data-wz="idea" data-i="${i}">${goalEmoji(g.name)} ${U.esc(g.name)}</button>`).join('')}</div>
            <label class="wz-label">Goal name</label><input class="wz-input" name="gname" maxlength="80" placeholder="e.g. Emergency fund" value="${U.esc(s.goal.name)}">
            <label class="wz-label">How much do you need?</label>${this.money('gamount', s.goal.targetAmount)}
            <label class="wz-label">By when? <span class="wz-muted">(optional)</span></label><input class="wz-input" type="date" name="gdate" value="${U.esc(s.goal.targetDate)}">
            <div id="wzGoalCheck"></div>`
        };

      case 'balance': return {
        eyebrow: '👛 Starting point', title: 'How much money do you have right now?',

        body: this.money('balance', s.balance), skip: 'Skip for now'
      };
      case 'review': return { eyebrow: '✨ Almost done', title: 'Here’s your plan', sub: 'Check everything. Tap Edit to change something.', body: this.reviewHtml(), next: 'Looks good — set it up' };
      case 'done': return this.doneScreen();
    }
    return { title: '' };
  },
  /** Live "is this goal possible?" check inside the setup. */
  goalCheck() {
    const box = this.el && this.el.querySelector('#wzGoalCheck');
    if (!box) return;
    const f = this.el.querySelector('form');
    const amt = wzMoney(f.querySelector('[name=gamount]').value), date = f.querySelector('[name=gdate]').value;
    if (!(amt > 0)) { box.innerHTML = ''; return; }
    const w = Plan.words(Plan.evaluate(amt, date, Math.max(0, this.totals().left)), date);
    box.innerHTML = `<div class="goal-verdict ${w.cls}"><b>${w.title}</b><span>${w.text}</span></div>`;
  },
  goalWords() {
    const g = this.st.goal;
    return Plan.words(Plan.evaluate(g.targetAmount, g.targetDate, Math.max(0, this.totals().left)), g.targetDate);
  },
  dayOpts(sel) { let h = ''; for (let d = 1; d <= 31; d++) h += `<option value="${d}"${+sel === d ? ' selected' : ''}>${ordinal(d)}</option>`; return h; },

  /* ---------------- summaries ---------------- */
  incomeRecords() {
    const s = this.st, out = [];
    s.incomes.forEach(inc => {
      if (!inc.freq || !(inc.amount > 0)) return;
      // Everything starts today: money already received or spent is part of the starting balance.
      const base = { source: inc.name, category: inc.category, weekendRule: inc.freq === 'WEEKLY' ? 'NONE' : (inc.weekend || 'NONE'), paymentMethod: 'Online Bank', startDate: U.today(), endDate: '', notes: 'Added in guided setup', dueDay: '', dueWeekday: '', intervalDays: '' };
      if (inc.freq === 'TWICE') {
        out.push(Object.assign({}, base, { source: inc.name + ' (' + ordinal(inc.day) + ')', frequency: 'MONTHLY', dueDay: +inc.day, amount: inc.amount }));
        out.push(Object.assign({}, base, { source: inc.name + ' (' + ordinal(inc.day2) + ')', frequency: 'MONTHLY', dueDay: +inc.day2, amount: inc.amount2 > 0 ? inc.amount2 : inc.amount }));
      } else if (inc.freq === 'WEEKLY') out.push(Object.assign({}, base, { frequency: 'WEEKLY', dueWeekday: +inc.weekday, amount: inc.amount }));
      else if (inc.freq === 'BIWEEKLY') out.push(Object.assign({}, base, { frequency: 'BIWEEKLY', startDate: this.nextFrom(inc.anchor, 14), amount: inc.amount }));
      else out.push(Object.assign({}, base, { frequency: 'MONTHLY', dueDay: +inc.day, amount: inc.amount }));
    });
    return out;
  },
  billRecords() {
    return this.st.bills.filter(b => b.amount > 0).map(b => ({
      name: b.name, category: b.category || 'Other', amount: b.amount, frequency: b.freq, dueDay: b.freq === 'MONTHLY' ? +b.day : '',
      dueWeekday: b.freq === 'WEEKLY' ? +b.weekday : '', intervalDays: '', paymentMethod: 'GCash', startDate: U.today(), endDate: '',
      notes: 'Added in guided setup', payDueRule: 'ON_ARRIVAL', payDueValue: ''
    }));
  },
  /** First date on or after today in a repeating series that started on `anchor`. */
  nextFrom(anchor, every) {
    const d = x => Date.UTC(+x.slice(0, 4), +x.slice(5, 7) - 1, +x.slice(8, 10)) / 86400000;
    const a = d(anchor), t = d(U.today());
    const n = a >= t ? a : a + Math.ceil((t - a) / every) * every;
    return new Date(n * 86400000).toISOString().slice(0, 10);
  },
  monthlyOf(r) { return Calc.monthlyEquivalent({ amount: r.amount, frequency: r.frequency, intervalDays: r.intervalDays }); },
  whenText(r) {
    if (r.frequency === 'WEEKLY') return 'every ' + WEEKDAYS[r.dueWeekday];
    if (r.frequency === 'BIWEEKLY') return 'every 2 weeks from ' + U.fmtDate(r.startDate);
    return 'every ' + ordinal(r.dueDay);
  },
  totals() {
    const inc = this.incomeRecords().reduce((a, r) => a + this.monthlyOf(r), 0);
    const bills = this.billRecords().reduce((a, r) => a + this.monthlyOf(r), 0);
    const budget = this.st.budget > 0 ? this.st.budget : 0;
    return { inc, bills, budget, left: inc - budget };
  },
  reviewHtml() {
    const s = this.st, steps = this.steps(), t = this.totals();
    const edit = id => `<button type="button" class="wz-edit" data-wz="goto" data-step="${steps.indexOf(id)}">Edit</button>`;
    const incs = this.incomeRecords(), bills = this.billRecords();
    return `<div class="wz-review">
      <div class="wz-rsec"><div class="wz-rhead"><b>Name</b>${edit('name')}</div><div>${U.esc(s.name)}</div></div>
      <div class="wz-rsec"><div class="wz-rhead"><b>Income</b> <span>${U.peso(t.inc)}/month</span>${edit('incCount')}</div>${incs.length ? incs.map(r => `<div class="wz-rrow"><span>${U.esc(r.source)}<small>${U.esc(this.whenText(r))}</small></span><b>${U.peso(r.amount)}</b></div>`).join('') : '<div class="wz-muted">None added</div>'}</div>
      <div class="wz-rsec"><div class="wz-rhead"><b>Bills</b> <span>${U.peso(t.bills)}/month</span>${edit('billsPick')}</div>${bills.length ? bills.map(r => `<div class="wz-rrow"><span>${U.esc(r.name)}<small>due ${U.esc(this.whenText(r))}</small></span><b>${U.peso(r.amount)}</b></div>`).join('') : '<div class="wz-muted">None added</div>'}</div>
      <div class="wz-rsec"><div class="wz-rhead"><b>Monthly budget</b>${edit('budget')}</div><div>${U.peso(s.budget)}${t.bills > s.budget ? ` <span class="neg" style="font-size:13px">— less than your bills (${U.peso(t.bills)})</span>` : ''}</div></div>
      ${s.wantsGoal ? `<div class="wz-rsec"><div class="wz-rhead"><b>Goal</b>${edit('goal')}</div><div>${U.esc(s.goal.name)} · ${U.peso(s.goal.targetAmount)}${s.goal.targetDate ? ' by ' + U.esc(U.fmtDate(s.goal.targetDate)) : ''}</div><div class="goal-verdict ${this.goalWords().cls}" style="margin-top:8px"><b>${this.goalWords().title}</b><span>${this.goalWords().text}</span></div></div>` : ''}
      <div class="wz-rsec"><div class="wz-rhead"><b>Money you have now</b>${edit('balance')}</div><div>${s.balance !== '' && !isNaN(s.balance) ? U.peso(s.balance) : '<span class="wz-muted">Not set</span>'}</div></div>
    </div>`;
  },
  doneScreen() {
    const s = this.st, r = this.result || {}, t = this.totals();
    const inc = t.inc, bills = t.bills, label = 'Your typical month';
    const left = t.left;
    const upcoming = r.synced ? this.upcoming() : [];
    return {
      title: `🎉 You’re all set${s.name ? ', ' + U.esc(s.name.split(' ')[0]) : ''}!`,
      sub: r.synced ? 'Your paydays and bills are now scheduled for every month, starting today.' : r.offline ? 'Saved on this phone. It will finish setting up automatically when you’re online.' : 'Your plan is saved.',
      body: `<div class="wz-result">
        <div class="wz-rcap">${U.esc(label)}</div>
        <div class="wz-res-row"><span>Expected income</span><b class="pos">${U.peso(inc)}</b></div>
        <div class="wz-res-row"><span>Monthly budget<small>bills ${U.peso(bills)} + daily needs ${U.peso(Math.max(0, t.budget - bills))}</small></span><b>− ${U.peso(t.budget)}</b></div>
        <div class="wz-res-row total"><span>${left >= 0 ? 'Left to save' : 'Short by'}</span><b class="${left >= 0 ? 'pos' : 'neg'}">${U.peso(Math.abs(left))}</b></div>
        ${left < 0 ? '<p class="wz-hint">Your budget is more than you earn. The dashboard will help you see where to adjust.</p>' : ''}
      </div>
      ${s.wantsGoal ? `<div class="wz-coming"><div class="wz-rcap">Your goal: ${U.esc(s.goal.name)}</div><div class="goal-verdict ${this.goalWords().cls}"><b>${this.goalWords().title}</b><span>${this.goalWords().text}</span></div></div>` : ''}
      ${upcoming.length ? `<div class="wz-coming"><div class="wz-rcap">Coming up</div>${upcoming.map(u => `<div class="wz-res-row"><span>${U.esc(u.name)}<small>${U.esc(U.fmtDate(u.date))}</small></span><b class="${u.kind === 'in' ? 'pos' : ''}">${u.kind === 'in' ? '+' : '−'} ${U.peso(u.amount)}</b></div>`).join('')}</div>` : ''}
      <div class="wz-how"><div class="wz-rcap">How it works from here</div>
        <div class="wz-howrow"><i>1</i><span><b>Payday?</b> Tap <b>Mark received</b> and type the real amount. Expected becomes actual.</span></div>
        <div class="wz-howrow"><i>2</i><span><b>Paid a bill?</b> Tap <b>Mark as Paid</b>. Overdue bills turn red so nothing slips.</span></div>
        <div class="wz-howrow"><i>3</i><span><b>Spent money?</b> Tap <b>Add expense</b>. The dashboard compares expected vs actual for you.</span></div></div>
      <div class="wz-lock">✏️ <span>Pay changed, new bill, different budget? Edit them anytime under <b>Income</b>, <b>Fixed Bills</b> and <b>Settings</b>.</span></div>`,
      actions: `<button type="button" class="btn primary wz-next" data-wz="finish">Open my dashboard</button>`
    };
  },
  upcoming() {
    const today = U.today(), out = [];
    Calc.instances(today).filter(i => !i.isVoid && i.status !== ST.PAID && i.dueDate >= today).forEach(i => out.push({ kind: 'out', name: i.billName, date: i.dueDate, amount: i.remainingAmount > 0 ? i.remainingAmount : i.expectedAmount }));
    Store.list('income').filter(i => i.status === 'PENDING' && !U.bool(i.isDeleted) && i.date >= today).forEach(i => out.push({ kind: 'in', name: i.source, date: i.date, amount: i.expectedAmount }));
    return out.sort((a, b) => a.date.localeCompare(b.date)).slice(0, 5);
  },

  /* ---------------- interaction ---------------- */
  onClick(e) {
    const chip = e.target.closest('[data-chip]');
    if (chip) {
      const name = chip.dataset.chip, form = this.el.querySelector('form');
      form.querySelectorAll(`[data-chip="${name}"]`).forEach(x => x.classList.toggle('on', x === chip));
      const hid = form.querySelector(`input[type=hidden][name="${name}"]`);
      if (hid) hid.value = chip.dataset.v;
      if (name === 'type') { const n = form.querySelector('[name=incName]'); if (n && (!n.value || WZ_INCOME_TYPES.some(t => t.label === n.value))) n.value = chip.dataset.v; }
      if (name === 'budgetQuick') { const d = form.querySelector('[name=budget]'); if (d) d.value = chip.dataset.v; }
      if (name === 'freq' && this.cur().k === 'bill') form.querySelectorAll('[data-for]').forEach(x => { x.hidden = x.dataset.for !== chip.dataset.v; });
      if (chip.dataset.auto) setTimeout(() => this.next(), 160);
      return;
    }
    const tog = e.target.closest('[data-toggle]');
    if (tog) {
      const k = tog.dataset.toggle, p = this.st.picked;
      const i = p.indexOf(k); if (i >= 0) p.splice(i, 1); else p.push(k);
      tog.classList.toggle('on', i < 0);
      const nb = this.el.querySelector('.wz-next'); if (nb) nb.textContent = p.length ? `Next (${p.length})` : 'Next';
      return;
    }
    const b = e.target.closest('[data-wz]');
    if (!b) return;
    const a = b.dataset.wz;
    if (a === 'back') this.back();
    else if (a === 'skip') this.next(true);
    else if (a === 'skipall') this.exit();
    else if (a === 'goto') { this.idx = +b.dataset.step; this.render(); }
    else if (a === 'finish') { this.close(true); UI.go('dashboard'); }
    else if (a === 'idea') {
      const g = goalIdeas(this.st.budget || 0)[+b.dataset.i], f = this.el.querySelector('form');
      f.querySelector('[name=gname]').value = g.name; f.querySelector('[name=gamount]').value = g.targetAmount; f.querySelector('[name=gdate]').value = g.targetDate;
      this.goalCheck();
    }
    else if (a === 'addcustom') {
      const inp = this.el.querySelector('#wzCustom'), v = String(inp.value || '').trim().slice(0, 60);
      if (!v) return inp.focus();
      if (!this.st.custom.includes(v)) this.st.custom.push(v);
      if (!this.st.picked.includes('custom:' + v)) this.st.picked.push('custom:' + v);
      this.render();
    }
  },
  async exit() {
    if (this.cur().k === 'intro') return this.close(true);
    const ok = await Modal.confirm('Exit the guided setup?', 'Nothing you answered here will be saved. Your existing income and bills stay as they are.', 'Exit', true);
    if (ok) this.close(true);
  },
  back() { if (this.idx > 0) { this.idx--; this.render(); } },
  err(msg) { const e = this.el.querySelector('#wzErr'); e.textContent = msg; e.classList.add('show'); },
  async next(skipped) {
    if (this.saving) return;
    const c = this.cur(), form = this.el.querySelector('form');
    const v = n => { const el = form.querySelector(`[name="${n}"]`); return el ? String(el.value).trim() : ''; };
    const s = this.st;
    const inc = c.i >= 0 && c.k.startsWith('inc') ? s.incomes[c.i] : null;
    switch (c.k) {
      case 'name': if (!v('name')) return this.err('Please type a name.'); s.name = v('name').slice(0, 60); break;
      case 'incCount': {
        const n = +v('count');
        if (!(n >= 1)) return this.err('Choose how many.');
        s.incomeCount = n;
        while (s.incomes.length < n) s.incomes.push(this.newIncome());
        s.incomes.splice(n);
        break;
      }
      case 'incType': {
        const name = v('incName') || v('type');
        if (!name) return this.err('Choose a type or type a name.');
        inc.type = v('type'); inc.name = name.slice(0, 60);
        const t = WZ_INCOME_TYPES.find(x => x.label === inc.type); inc.category = t ? t.category : 'Other';
        break;
      }
      case 'incFreq': if (!v('freq')) return this.err('Choose how often.'); inc.freq = v('freq'); break;
      case 'incWhen':
        if (inc.freq === 'TWICE') { inc.day = +v('day'); inc.day2 = +v('day2'); if (inc.day === inc.day2) return this.err('Pick two different days.'); if (inc.day > inc.day2) [inc.day, inc.day2] = [inc.day2, inc.day]; }
        else if (inc.freq === 'WEEKLY') { if (v('weekday') === '') return this.err('Choose a day.'); inc.weekday = +v('weekday'); }
        else if (inc.freq === 'BIWEEKLY') { if (!U.isYmd(v('anchor'))) return this.err('Choose a date.'); inc.anchor = v('anchor'); }
        else { if (!v('day')) return this.err('Tap the day you get paid.'); inc.day = +v('day'); }
        break;
      case 'incAmount': {
        const a = wzMoney(v('amount'));
        if (!(a > 0)) return this.err('Type the amount (numbers only).');
        inc.amount = a;
        if (inc.freq === 'TWICE') { const b = wzMoney(v('amount2')); if (!(b > 0)) return this.err('Type the amount for the second payday.'); inc.amount2 = b; }
        break;
      }
      case 'incWeekend': if (!v('weekend')) return this.err('Choose one.'); inc.weekend = v('weekend'); break;
      case 'billsPick': {
        if (skipped) s.picked = [];
        const keep = {}; s.bills.forEach(b => { keep[b.key] = b; });
        s.bills = s.picked.map(k => {
          if (keep[k]) return keep[k];
          const p = WZ_BILLS.find(x => x.key === k);
          const name = p ? p.name : k.replace(/^custom:/, '');
          return { key: k, name, category: p ? p.category : 'Other', amount: '', freq: p && p.freq ? p.freq : 'MONTHLY', day: '', weekday: p && p.weekday !== undefined ? p.weekday : '' };
        });
        break;
      }
      case 'bill': {
        const b = s.bills[c.i];
        const a = wzMoney(v('amount'));
        if (!(a > 0)) return this.err('Type the usual amount (numbers only).');
        b.amount = a; b.freq = v('freq') || 'MONTHLY';
        if (b.freq === 'MONTHLY') { if (!v('day')) return this.err('Tap the day it’s due.'); b.day = +v('day'); }
        else { if (v('weekday') === '') return this.err('Choose the day of the week.'); b.weekday = +v('weekday'); }
        break;
      }
      case 'budget': {
        const a = wzMoney(v('budget'));
        if (!(a > 0)) return this.err('Type your monthly budget (numbers only).');
        s.budget = a; break;
      }
      case 'goalAsk': {
        const w = v('wants');
        if (!w) return this.err('Choose one.');
        s.wantsGoal = w === 'yes';
        break;
      }
      case 'goal': {
        const name = v('gname'), amt = wzMoney(v('gamount')), date = v('gdate');
        if (!name) return this.err('Give your goal a name.');
        if (!(amt > 0)) return this.err('Type how much you need (numbers only).');
        if (date && date <= U.today()) return this.err('Pick a date in the future, or leave it empty.');
        s.goal = { name: name.slice(0, 80), targetAmount: amt, targetDate: date };
        break;
      }
      case 'balance': {
        if (skipped) { s.balance = ''; break; }
        const a = wzMoney(v('balance'));
        if (isNaN(a)) return this.err('Type an amount, or tap “Skip for now”.');
        s.balance = a; break;
      }
      case 'review': return this.save();
    }
    this.idx = Math.min(this.idx + 1, this.steps().length - 1);
    this.render();
  },

  /* ---------------- saving ---------------- */
  uniqueName(name, taken) {
    let n = name, k = 2;
    while (taken.has(n.toLowerCase())) n = name + ' ' + k++;
    taken.add(n.toLowerCase());
    return n;
  },
  async queueCreate(store, rec) {
    const now = U.nowIso(), id = rec[ENTITY[store].idField];
    Object.assign(rec, { id, localId: id, serverId: '', syncStatus: 'pending', createdAt: now, updatedAt: now, lastSyncedAt: '' });
    await Store.save(store, rec);
    const payload = {}; Object.keys(rec).forEach(k => { if (!['id', 'localId', 'serverId', 'syncStatus', 'syncError', 'createdAt', 'updatedAt', 'lastSyncedAt', 'serverUpdatedAt'].includes(k)) payload[k] = rec[k]; });
    await Sync.enqueue({ entityType: ENTITY[store].type, action: 'CREATE', localId: id, entityId: id, payload });
  },
  async save() {
    this.saving = true;
    const btn = this.el.querySelector('.wz-next');
    if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Setting up your months…'; }
    try {
      const s = this.st, t = this.totals(), cm = U.curMonth();
      const settings = { householdName: s.name };
      if (s.balance !== '' && !isNaN(s.balance)) { settings.openingBalance = s.balance; settings.openingBalanceDate = U.today(); }
      const budget = Math.round(s.budget > 0 ? s.budget : 0);
      if (budget > 0) settings.defaultMonthlyBudget = budget;
      Store.settings = Object.assign({}, Store.settings, Object.fromEntries(Object.entries(settings).map(([k, v2]) => [k, String(v2)])));
      await Store.setMeta('settings', Store.settings);
      await Sync.enqueue({ entityType: 'SETTINGS', action: 'UPDATE', localId: 'SETTINGS', payload: settings });
      const takenI = new Set(Store.list('recurringIncome').map(r => String(r.source).toLowerCase()));
      for (const r of this.incomeRecords()) await this.queueCreate('recurringIncome', Object.assign({ recurringIncomeId: U.uid('RI'), isActive: true }, r, { source: this.uniqueName(r.source, takenI) }));
      const takenB = new Set(Store.list('recurringBills').map(r => String(r.name).toLowerCase()));
      for (const r of this.billRecords()) await this.queueCreate('recurringBills', Object.assign({ recurringBillId: U.uid('RB'), isActive: true }, r, { name: this.uniqueName(r.name, takenB) }));
      if (s.wantsGoal && s.goal.name && s.goal.targetAmount > 0) {
        await this.queueCreate('goals', { goalId: U.uid('GOAL'), name: s.goal.name, targetAmount: s.goal.targetAmount, targetDate: s.goal.targetDate || '', notes: '', savedAmount: 0, status: 'ACTIVE', isDeleted: false });
      }
      if (budget > 0) {
        const existing = Store.list('budgets').find(x => x.month === cm);
        const id = existing ? existing.id : 'MB-' + cm;
        await Store.save('budgets', Object.assign({}, existing || { budgetId: id, id, month: cm, createdAt: U.nowIso() }, { plannedAmount: budget, notes: 'From guided setup', updatedAt: U.nowIso(), syncStatus: 'pending' }));
        await Sync.enqueue({ entityType: 'BUDGET', action: 'UPDATE', localId: id, entityId: id, payload: { month: cm, plannedAmount: budget, notes: 'From guided setup' } });
      }
      await Store.setMeta('wizardDone', true);
      let synced = false, offline = !navigator.onLine;
      if (!offline) {
        const r = await Sync.run({ manual: true, full: true });
        synced = !r.error && !Store.queue.length;
        offline = !!r.network;
      }
      this.result = { synced, offline };
    } catch (e) {
      this.saving = false;
      if (btn) { btn.disabled = false; btn.textContent = 'Try again'; }
      return this.err('Something went wrong: ' + e.message);
    }
    this.saving = false;
    this.idx = this.steps().length - 1;
    this.render();
    confetti();
  }
};

 * GOALS · ASK · CALCULATOR
 * ========================================================================== */

/* ------------------------------------------------------------------ Goal planning (is it possible?) */
const Plan = {
  /** Typical monthly income from regular income (weekly/bi-weekly averaged). */
  monthlyIncome() { return Store.list('recurringIncome').filter(r => U.bool(r.isActive)).reduce((a, r) => a + Calc.monthlyEquivalent(r), 0); },
  monthlyBudget() { return Number(Store.settings.defaultMonthlyBudget || 0) || Calc.budgetFor(U.curMonth()).amount || 0; },
  /** What's left each month after the budget — the most that can go to goals. */
  room() { return Math.round((this.monthlyIncome() - this.monthlyBudget()) * 100) / 100; },
  /** Calendar months from today (Oct 8 → next Oct 8 = 12), with days as a fraction. */
  monthsUntil(date) {
    const t = U.today();
    return (+date.slice(0, 4) - +t.slice(0, 4)) * 12 + (+date.slice(5, 7) - +t.slice(5, 7)) + (+date.slice(8, 10) - +t.slice(8, 10)) / 30.4375;
  },
  addMonthsDate(n) {
    const t = U.today(); let y = +t.slice(0, 4), m = +t.slice(5, 7) + n;
    while (m > 12) { m -= 12; y++; }
    const dim = new Date(Date.UTC(y, m, 0)).getUTCDate();
    return `${y}-${U.pad2(m)}-${U.pad2(Math.min(+t.slice(8, 10), dim))}`;
  },
  /**
   * The core check. remaining = what's still needed; free = monthly room for this goal.
   * Returns ok/perMonth, or why not + when it would be possible + how much per month it would need.
   */
  evaluate(remaining, targetDate, free) {
    remaining = Math.max(0, remaining);
    if (remaining <= 0) return { state: 'reached' };
    const months = targetDate ? this.monthsUntil(targetDate) : null;
    if (targetDate && months <= 0) return { state: 'late', remaining, free, possibleBy: free > 0 ? this.addMonthsDate(Math.ceil(remaining / free)) : '', perMonthIfPossible: free > 0 ? free : 0 };
    if (free <= 0) {
      const need = targetDate ? Math.ceil(remaining / Math.max(1, months)) : 0;
      return { state: 'noRoom', remaining, need };
    }
    if (!targetDate) {
      const n = Math.ceil(remaining / free);
      return { state: 'ok', perMonth: Math.ceil(remaining / n), months: n, byDate: this.addMonthsDate(n), noDate: true };
    }
    const need = Math.ceil(remaining / Math.max(1, months));
    if (need <= free + 0.5) return { state: 'ok', perMonth: need, months: Math.max(1, Math.round(months)), byDate: targetDate };
    return { state: 'tooSoon', remaining, need, free, short: need - free, possibleBy: this.addMonthsDate(Math.ceil(remaining / free)) };
  },
  /** Plain-words verdict for a plan. */
  words(p, targetDate) {
    const P = v => U.peso(v, true), D = d => U.fmtDate(d);
    switch (p.state) {
      case 'reached': return { cls: 'ok', title: 'Goal reached! 🎉', text: 'You saved the full amount.' };
      case 'ok': return { cls: 'ok', title: p.noDate ? 'Possible ✓' : 'Possible ✓', text: `Put in about <b>${P(p.perMonth)} a month</b> and you’ll reach it ${p.noDate ? 'by <b>' + D(p.byDate) + '</b>' : 'by <b>' + D(targetDate) + '</b>'}.` };
      case 'tooSoon': return { cls: 'no', title: `Not possible by ${D(targetDate)}`, text: `You’d need <b>${P(p.need)} a month</b>, but only about <b>${P(p.free)}</b> is left after your budget. It’s possible by <b>${D(p.possibleBy)}</b> saving ${P(p.free)} a month — or free up <b>${P(p.short)} more a month</b> from your budget to keep the date.` };
      case 'noRoom': return { cls: 'no', title: 'Not possible yet', text: `Your budget uses all of your income, so there’s nothing left to save.${p.need ? ` To reach it by ${D(targetDate)} you’d need <b>${P(p.need)} a month</b>.` : ''} Lower your budget or add income, then it becomes possible.` };
      case 'late': return { cls: 'no', title: 'The target date has passed', text: p.possibleBy ? `At ${P(p.perMonthIfPossible)} a month you can still reach it by <b>${D(p.possibleBy)}</b>. Edit the goal to set a new date.` : 'Edit the goal to set a new date.' };
    }
    return { cls: '', title: '', text: '' };
  },
  /** Plans for all active goals; earlier goals get the monthly room first. */
  goals() {
    const list = Store.list('goals').filter(g => !U.bool(g.isDeleted)).sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt)));
    let free = this.room();
    return list.map(g => {
      const saved = goalSaved(g.goalId);
      const remaining = Math.max(0, Number(g.targetAmount) - saved);
      const p = this.evaluate(remaining, g.targetDate || '', free);
      if (p.state === 'ok') free = Math.max(0, free - p.perMonth);
      return { goal: g, saved, remaining, pct: Number(g.targetAmount) > 0 ? Math.min(100, saved / Number(g.targetAmount) * 100) : 0, plan: p };
    });
  },
  setAside() { return Math.max(0, Store.list('goals').filter(g => !U.bool(g.isDeleted)).reduce((a, g) => a + goalSaved(g.goalId), 0)); }
};
function depositAmount(r) { let a = Number(r.amount) || 0; if (r.kind === 'OUT' && a > 0) a = -a; return a; }
function goalSaved(goalId) { return Math.max(0, Store.list('goalDeposits').filter(r => r.goalId === goalId && !U.bool(r.isVoid)).reduce((a, r) => a + depositAmount(r), 0)); }

/** Sample goals sized to the person's own budget. */
function goalIdeas(budgetOverride) {
  const budget = budgetOverride || Plan.monthlyBudget() || 20000;
  const t = U.today(), y = +t.slice(0, 4);
  const dec = `${t.slice(5) > '12-10' ? y + 1 : y}-12-15`;
  const june = `${t.slice(5) > '05-15' ? y + 1 : y}-06-01`;
  const r1k = v => Math.round(v / 1000) * 1000;
  return [
    { name: 'Emergency fund', targetAmount: r1k(budget * 3), targetDate: Plan.addMonthsDate(12), note: '3 months of your budget, for surprises' },
    { name: 'Christmas & holidays', targetAmount: 15000, targetDate: dec, note: 'Noche Buena, gifts, bonus season' },
    { name: 'Travel / vacation', targetAmount: 30000, targetDate: Plan.addMonthsDate(10), note: 'A trip with family or barkada' },
    { name: 'New phone or gadget', targetAmount: 25000, targetDate: Plan.addMonthsDate(8), note: 'Buy in cash, no installment' },
    { name: 'Tuition / school', targetAmount: 40000, targetDate: june, note: 'Ready before enrollment' },
    { name: 'House or condo down payment', targetAmount: 200000, targetDate: Plan.addMonthsDate(36), note: 'A long-term goal' }
  ];
}

/* ------------------------------------------------------------------ Goal views */
Views.goals = function () {
  const plans = Plan.goals();
  const room = Plan.room(), inc = Plan.monthlyIncome(), bud = Plan.monthlyBudget();
  const setAside = Plan.setAside();
  const card = x => {
    const g = x.goal, w = Plan.words(x.plan, g.targetDate);
    const entries = Store.list('goalDeposits').filter(r => r.goalId === g.goalId && !U.bool(r.isVoid)).sort((a, b) => String(b.date).localeCompare(String(a.date))).slice(0, 4);
    return `<div class="card goal-card">
      <div class="goal-top">${ring(x.pct, 64, goalEmoji(g.name))}<div style="flex:1"><div class="goal-name">${U.esc(g.name)} ${localTag(g)}</div><div class="sub">${g.targetDate ? '📅 By ' + U.esc(U.fmtDate(g.targetDate)) : 'No deadline'}</div></div>
        <div class="goal-pct">${Math.floor(x.pct)}%</div></div>
      <div class="goal-bar"><i style="width:${x.pct.toFixed(1)}%"></i></div>
      <div class="goal-nums"><span><b>${U.peso(x.saved, true)}</b> saved</span><span>of ${U.peso(g.targetAmount, true)}</span></div>
      <div class="goal-verdict ${w.cls}"><b>${w.title}</b><span>${w.text}</span></div>
      <div class="goal-actions"><button class="btn sm primary" data-action="goal-in" data-id="${U.esc(g.goalId)}">+ Put money in</button>${x.saved > 0 ? `<button class="btn sm" data-action="goal-out" data-id="${U.esc(g.goalId)}">Take out</button>` : ''}<button class="btn sm ghost" data-action="edit-goal" data-id="${U.esc(g.goalId)}">Edit</button></div>
      ${entries.length ? `<div class="goal-entries">${entries.map(r => `<div><span>${U.esc(U.fmtDate(r.date))}</span><span class="${depositAmount(r) < 0 ? 'neg' : 'pos'}">${depositAmount(r) < 0 ? '−' : '+'} ${U.peso(Math.abs(depositAmount(r)), true)}</span><button class="x" title="Remove this entry" data-action="goal-entry-remove" data-id="${U.esc(r.depositId)}">×</button></div>`).join('')}</div>` : ''}
    </div>`;

      <div class="sub">Regular income ${U.peso(inc, true)} − budget ${U.peso(bud, true)}${room <= 0 ? ' · lower your budget or add income to start saving' : ''}</div></div>

      <div class="idea-grid">${goalIdeas().map((g, i) => `<button class="idea" data-action="goal-idea" data-i="${i}"><b>${goalEmoji(g.name)} ${U.esc(g.name)}</b><span>${U.peso(g.targetAmount, true)} · by ${U.esc(U.fmtDate(g.targetDate))}</span><small>${U.esc(g.note)}</small></button>`).join('')}</div></div>`;

/* ------------------------------------------------------------------ Goal forms */
Forms.goal = function (id, preset) {
  const cur = id ? Store.get('goals', id) : null;
  const v = cur || preset || {};
  Modal.open({
    title: cur ? 'Edit goal' : 'New goal', eyebrow: 'Goals',
    body: `<div class="form-grid">
      ${F.text('name', 'What are you saving for?', v.name || '', { required: true, full: true, max: 80, attrs: 'placeholder="e.g. Emergency fund"' })}
      ${F.money('targetAmount', 'How much do you need?', v.targetAmount === undefined ? '' : v.targetAmount, { required: true })}
      ${F.date('targetDate', 'By when? (optional)', v.targetDate || '', { hint: 'Leave empty and we’ll tell you the earliest date.' })}
      <div class="full goal-preview" id="goalPreview"></div>
    </div>`,
    foot: `${cur ? '<button type="button" class="btn danger" data-action="delete-goal" data-id="' + U.esc(cur.goalId) + '" style="margin-right:auto">Delete</button>' : ''}<button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary">${cur ? 'Save' : 'Create goal'}</button>`,
    onOpen(form) {
      const box = form.querySelector('#goalPreview');
      const upd = () => {
        const amt = U.parseMoney(form.querySelector('[name=targetAmount]').value);
        const date = form.querySelector('[name=targetDate]').value;
        if (!(amt > 0)) { box.innerHTML = '<span class="sub">Type an amount to check if it’s possible.</span>'; return; }
        const others = Plan.goals().filter(x => !cur || x.goal.goalId !== cur.goalId);
        const used = others.reduce((a, x) => a + (x.plan.state === 'ok' ? x.plan.perMonth : 0), 0);
        const free = Math.max(0, Plan.room() - used);
        const saved = cur ? goalSaved(cur.goalId) : 0;
        const w = Plan.words(Plan.evaluate(amt - saved, date, free), date);
        box.innerHTML = `<div class="goal-verdict ${w.cls}"><b>${w.title}</b><span>${w.text}</span></div>${used > 0 ? `<p class="sub" style="margin:6px 0 0">Your other goals already use ${U.peso(used, true)} of your ${U.peso(Math.max(0, Plan.room()), true)} monthly room.</p>` : ''}`;
      };
      form.addEventListener('input', upd); upd();
    },
    async onSubmit(fd) {
      const rec = { name: F.req(fd, 'name', 'Goal name'), targetAmount: F.amount(fd, 'targetAmount', 'Target amount'), targetDate: F.date10(fd, 'targetDate', 'Target date', true), notes: '' };
      if (!(rec.targetAmount > 0)) throw new Error('The amount must be more than ₱0.');
      let outcome;
      if (cur) outcome = await Data.update('goals', cur.id, rec, Modal.current.opId);
      else outcome = await Data.create('goals', Object.assign({ goalId: U.uid('GOAL'), savedAmount: 0, status: 'ACTIVE', isDeleted: false }, rec), Modal.current.opId);
      Modal.close();
      UI.saveOutcome(outcome, 'Goal');
      UI.refresh();
    }
  });
};

Forms.goalMoney = function (goalId, kind) {
  const g = Store.get('goals', goalId);
  if (!g) return;
  const saved = goalSaved(goalId);
  const x = Plan.goals().find(p => p.goal.goalId === goalId);
  const suggest = kind === 'IN' && x && x.plan.state === 'ok' ? Math.min(x.plan.perMonth, x.remaining) : '';
  Modal.open({
    title: kind === 'IN' ? 'Put money in' : 'Take money out', eyebrow: g.name,
    body: `<div class="summary-box"><div><span>Saved</span><b>${U.peso(saved)}</b></div><div><span>Goal</span><b>${U.peso(g.targetAmount)}</b></div><div><span>Still needed</span><b>${U.peso(Math.max(0, g.targetAmount - saved))}</b></div></div>
      <div class="form-grid">
        ${F.money('amount', 'Amount', suggest, { required: true, hint: kind === 'IN' ? 'This money is set aside — it won’t count as safe to spend.' : 'At most ' + U.esc(U.peso(saved)) + '. It goes back to your spendable money.' })}
        ${F.date('date', 'Date', U.today(), { required: true })}
      </div>`,
    async onSubmit(fd) {
      const amount = F.amount(fd, 'amount', 'Amount');
      if (!(amount > 0)) throw new Error('Type an amount more than ₱0.');
      if (kind === 'OUT' && U.cents(amount) > U.cents(saved)) throw new Error('You can take out at most ' + U.peso(saved) + '.');
      const id = U.uid('GDP'), now = U.nowIso();
      const rec = { depositId: id, id, localId: id, goalId, goalName: g.name, kind, date: F.date10(fd, 'date', 'Date'), amount: kind === 'OUT' ? -amount : amount, notes: '', isVoid: false, serverId: '', syncStatus: 'pending', createdAt: now, updatedAt: now, lastSyncedAt: '' };
      await Store.save('goalDeposits', rec);
      const outcome = await Sync.commit({ operationId: Modal.current.opId, entityType: 'GOAL_DEPOSIT', action: 'CREATE', localId: id, entityId: id, payload: { depositId: id, goalId, kind, amount, date: rec.date } });
      Modal.close();
      if (outcome === 'synced' || outcome === 'local') UI.toast(`${U.peso(amount, true)} ${kind === 'IN' ? 'put in' : 'taken out of'} ${g.name}.${outcome === 'local' ? ' It will sync when you’re online.' : ''}`);
      else UI.saveOutcome(outcome, 'Entry');
      const after = goalSaved(goalId);
      if (kind === 'IN' && after >= Number(g.targetAmount)) setTimeout(() => { confetti(); UI.toast('🎉 You reached your goal: ' + g.name + '!', '', 8000); }, 300);
      UI.refresh();
    }
  });
};

/* ------------------------------------------------------------------ Ask (answers from your own numbers) */
const ASK_SUGGESTIONS = ['💸 How much can I spend?', '📅 When is my next payday?', '🧾 What bills are due this week?', '🛒 How much did I spend this month?', '📊 Am I over budget?', '🐷 How much have I saved?', '🛍️ Can I afford ₱2,000?', '🎯 How are my goals?', '🤝 Who owes me money?', '🔝 What is my biggest expense?'];
const Ask = {
  history: [],
  ask(q) {
    q = String(q || '').replace(/^[^\p{L}\p{N}₱]+/u, '').trim();
    if (!q) return;
    let a;
    try { a = this.answer(q); } catch (e) { console.error(e); a = { text: 'Sorry, I couldn’t work that out. Try one of the suggestions below.' }; }
    this.history.push({ q, a });
    if (this.history.length > 30) this.history.shift();
    if (UI.view === 'ask') UI.render(); else UI.go('ask');
    setTimeout(() => { const el = document.querySelector('.ask-log'); if (el) el.scrollTop = el.scrollHeight; const last = document.querySelector('.ask-msg:last-child'); if (last && last.scrollIntoView) last.scrollIntoView({ block: 'end', behavior: 'smooth' }); }, 30);
  },
  P: v => U.peso(v, true),
  amountIn(q) {
    const m = q.replace(/,/g, '').match(/(?:₱|php|p)?\s*(\d+(?:\.\d+)?)\s*(k|thousand|libo)?/i);
    if (!m) return null;
    let n = Number(m[1]); if (m[2]) n *= 1000;
    return n > 0 ? n : null;
  },
  monthSpend(month) {
    const by = {}; let total = 0;
    Store.list('expenses').forEach(e => { if (!U.bool(e.isDeleted) && String(e.date).slice(0, 7) === month) { by[e.category || 'Other'] = (by[e.category || 'Other'] || 0) + Number(e.amount); total += Number(e.amount); } });
    Store.list('payments').forEach(p => { if (!U.bool(p.isVoid) && String(p.paymentDate).slice(0, 7) === month) { const inst = Store.get('billInstances', p.billInstanceId); const c = (inst && inst.category) || 'Bills'; by[c] = (by[c] || 0) + Number(p.amount); total += Number(p.amount); } });
    return { by, total };
  },
  answer(raw) {
    const q = raw.toLowerCase();
    const P = this.P, today = U.today(), cm = U.curMonth();
    const has = (...w) => w.some(x => q.includes(x));
    const how = t => `<div class="ask-how">How we got this: ${t}</div>`;
    const ins = Calc.insight(cm);
    const avail = Calc.available(today);

    // Can I afford X?
    if (has('afford') || (has('kaya ko', 'kaya ba', 'can i buy', 'can i spend', 'pwede ba', 'pwede ko', 'bumili') && this.amountIn(q))) {
      const amt = this.amountIn(q);
      if (!amt) return { text: 'Tell me the amount, like “Can I afford ₱2,500?”' };
      const safe = ins.safeToSpend, left = safe - amt;
      return { text: left >= 0 ? `<b>Yes ✓</b> — after ${P(amt)} you’d still have <b>${P(left)}</b> safe to spend this month.` : safe > 0 ? `<b>Not yet.</b> You have ${P(safe)} safe to spend, so ${P(amt)} would leave you short by <b>${P(-left)}</b>. Wait until your next income${ins.nextIncome ? ' (' + U.esc(U.fmtDate(ins.nextIncome.date)) + ')' : ''} or spend less elsewhere.` : `<b>Not right now.</b> Your bills and planned spending already use all your money this month.`,
        how: how(`safe to spend ${P(safe)} − ${P(amt)}. Safe to spend = money you have + income still coming − unpaid bills − usual daily spending − a small safety buffer${ins.goalSetAside ? ' − money saved in goals' : ''}.`) };
    }
    // Next payday
    if (has('payday', 'sweldo', 'next pay', 'next income', 'get paid', 'salary', 'sahod')) {
      const n = avail.nextIncome;
      if (!n) return { text: 'You have no upcoming income on your list. Add your regular income under <a href="#/income">Income</a>.' };
      const days = Math.round((Date.parse(n.date) - Date.parse(today)) / 86400000);
      return { text: `Your next income is <b>${U.esc(n.source)}</b>: <b>${P(n.expectedAmount)}</b> on <b>${U.esc(U.fmtDate(n.date))}</b>${days === 0 ? ' (today)' : days === 1 ? ' (tomorrow)' : ' (in ' + days + ' days)'}.`, how: how('the earliest regular income not yet marked received.') };
    }
    // Bills due
    if (has('due', 'bayarin', 'babayaran', 'overdue', 'late bill', 'unpaid', 'to pay')) {
      const late = has('late', 'overdue', 'hindi pa');
      const range = has('today', 'ngayon') ? 0 : has('month', 'buwan') ? 31 : 7;
      const end = U.addDays ? U.addDays(today, range) : new Date(Date.parse(today) + range * 86400000).toISOString().slice(0, 10);
      const list = Calc.instances(today).filter(i => !i.isVoid && i.status !== ST.PAID && i.status !== ST.OVER && (late ? i.status === ST.OVERDUE : (i.dueDate <= end))).sort((a, b) => a.dueDate.localeCompare(b.dueDate));
      if (!list.length) return { text: late ? 'Good news — <b>no late bills</b>.' : `No unpaid bills due ${range === 0 ? 'today' : range === 7 ? 'this week' : 'this month'}. 🎉` };
      const sum = list.reduce((a, i) => a + Math.max(0, i.remainingAmount), 0);
      return { text: `${late ? 'Late bills' : range === 0 ? 'Due today' : range === 7 ? 'Due in the next 7 days' : 'Due in the next 31 days'}: <b>${P(sum)}</b><ul class="ask-list">${list.slice(0, 8).map(i => `<li><span>${U.esc(i.billName)} · ${U.esc(U.fmtDate(i.dueDate))}${i.status === ST.OVERDUE ? ' <b class="neg">late</b>' : ''}</span><b>${P(i.remainingAmount)}</b></li>`).join('')}</ul>`, how: how('unpaid bills from your fixed bills list.') };
    }
    // Spending by category / total
    if (has('spend', 'spent', 'gastos', 'ginastos', 'gumastos', 'expense')) {
      const month = has('last month', 'nakaraang') ? U.addMonths(cm, -1) : cm;
      const s = this.monthSpend(month);
      const cats = Object.keys(s.by);
      const hit = cats.find(c => q.includes(c.toLowerCase())) || (has('food', 'pagkain', 'grocer') ? cats.find(c => /grocer|dining|food/i.test(c)) : '') || (has('fare', 'transport', 'pamasahe', 'gas') ? cats.find(c => /transport/i.test(c)) : '');
      if (hit) return { text: `In ${U.esc(U.monthLabel(month))} you spent <b>${P(s.by[hit])}</b> on <b>${U.esc(hit)}</b> (${s.total ? Math.round(s.by[hit] / s.total * 100) : 0}% of all spending).`, how: how('your spending and bill payments in that category.') };
      if (has('how much')) {
        const top = cats.sort((a, b) => s.by[b] - s.by[a]).slice(0, 4);
        return { text: `In ${U.esc(U.monthLabel(month))} you spent <b>${P(s.total)}</b> in total.${top.length ? `<ul class="ask-list">${top.map(c => `<li><span>${U.esc(c)}</span><b>${P(s.by[c])}</b></li>`).join('')}</ul>` : ''}`, how: how('bills paid + other spending you recorded.') };
      }
    }
    if (has('biggest', 'largest', 'pinakamalaki', 'most money')) {
      const s = this.monthSpend(cm);
      const cats = Object.keys(s.by).sort((a, b) => s.by[b] - s.by[a]);
      if (!cats.length) return { text: 'No spending recorded yet this month.' };
      return { text: `Your biggest spending this month is <b>${U.esc(cats[0])}</b>: <b>${P(s.by[cats[0]])}</b> of ${P(s.total)}.`, how: how('spending + bills paid this month, grouped by type.') };
    }
    // Budget
    if (has('budget', 'over budget', 'lampas')) {
      const sum = Calc.summary(cm, null, today);
      const left = sum.remaining;
      return { text: left >= 0 ? `You’re <b>within budget</b>: ${P(sum.totalSpent)} spent of ${P(sum.monthlyBudget)}, so <b>${P(left)}</b> is left this month.` : `You’re <b>over budget by ${P(-left)}</b>: ${P(sum.totalSpent)} spent of ${P(sum.monthlyBudget)}.`, how: how('budget − (bills paid + other spending) this month.') };
    }
    // Savings
    if (has('save', 'saved', 'savings', 'ipon', 'naipon')) {
      const sv = Calc.savings(today);
      const row = sv.rows.find(r => r.month === cm);
      return { text: `This month so far you kept <b>${P(row ? row.saved : 0)}</b>. Since you started, you saved <b>${P(sv.totalSaved)}</b> in total${sv.average !== null ? `, about ${P(sv.average)} a month` : ''}.${Plan.setAside() ? ` ${P(Plan.setAside())} of it is set aside in goals.` : ''}`, how: how('money in − bills paid − spending, each month.') };
    }
    // Goals
    if (has('goal', 'target', 'pangarap')) {
      const plans = Plan.goals();
      if (!plans.length) return { text: 'You have no goals yet. <a href="#/goals">Set one</a> and I’ll tell you if it’s possible.' };
      return { text: `<ul class="ask-list">${plans.map(x => { const w = Plan.words(x.plan, x.goal.targetDate); return `<li><span><b>${U.esc(x.goal.name)}</b> — ${Math.floor(x.pct)}% · ${w.title}</span><b>${P(x.saved)} / ${P(x.goal.targetAmount)}</b></li>`; }).join('')}</ul>You can put about <b>${P(Math.max(0, Plan.room()))}</b> a month into goals.`, how: how('regular income − budget = monthly room; each goal’s amount left ÷ months left.') };
    }
    // Lent money
    if (has('owe', 'utang', 'lent', 'pinautang', 'borrow')) {
      const lt = Calc.loanTotals(today);
      if (!lt.openCount) return { text: 'Nobody owes you money right now.' };
      const open = Calc.loans(today).filter(l => l.status !== 'REPAID' && l.status !== 'WRITTEN OFF');
      return { text: `<b>${P(lt.owed)}</b> is owed to you:<ul class="ask-list">${open.slice(0, 8).map(l => `<li><span>${U.esc(l.borrower)}${l.status === 'OVERDUE' ? ' <b class="neg">late</b>' : ''}</span><b>${P(l.remainingAmount)}</b></li>`).join('')}</ul>`, how: how('money lent minus what was paid back.') };
    }
    // Income
    if (has('income', 'earn', 'kita', 'received', 'natanggap')) {
      const sum = Calc.summary(cm, null, today);
      return { text: `This month you received <b>${P(sum.actualIncome)}</b> of <b>${P(sum.expectedIncome)}</b> expected.`, how: how('income you marked received vs your regular income schedule.') };
    }
    // Money now / safe to spend / how am I doing
    if (has('how much can', 'safe', 'money do i have', 'money i have', 'pera', 'balance', 'cash', 'left', 'natitira', 'magkano')) {
      return { text: `You can safely spend about <b>${P(Math.max(0, ins.safeToSpend))}</b> for the rest of the month${ins.safeToSpend < 0 ? ` — actually you’re <b class="neg">short ${P(-ins.safeToSpend)}</b>` : ''}. Money you have now: ${P(ins.cashOnHand)}${ins.goalSetAside ? ` (${P(ins.goalSetAside)} of it saved in goals)` : ''}.`, how: how('money you have + income still coming − unpaid bills − usual daily spending − a small safety buffer.') };
    }
    if (has('how am i', 'doing', 'status', 'okay', 'ok ba', 'kamusta', 'kumusta')) {
      return { text: `<b>${U.esc(ins.headline)}</b> ${U.esc(ins.comment)}`, how: how('your income, bills, spending and budget this month.') };
    }
    return { text: 'I can answer questions about <b>your</b> money in this app: spending, bills, income, budget, savings, goals and lent money. I can’t answer other topics. Try one of these:', help: true };
  }
};

/* ------------------------------------------------------------------ Calculator */
const CalcPad = {
  expr: '', result: '',
  /** Safe arithmetic: numbers, + − × ÷, %, parentheses. No eval. */
  evaluate(s) {
    const t = s.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/,/g, '');
    let i = 0;
    const peek = () => t[i], eat = c => { if (t[i] === c) { i++; return true; } return false; };
    const ws = () => { while (t[i] === ' ') i++; };
    function num() { ws(); let st = i; while (/[0-9.]/.test(t[i] || '')) i++; if (st === i) throw new Error('number'); let v = parseFloat(t.slice(st, i)); ws(); if (eat('%')) v = v / 100; return v; }
    function factor() { ws(); if (eat('-')) return -factor(); if (eat('(')) { const v = expr(); ws(); if (!eat(')')) throw new Error(')'); return v; } return num(); }
    function term() { let v = factor(); for (;;) { ws(); if (eat('*')) v *= factor(); else if (eat('/')) { const d = factor(); if (d === 0) throw new Error('÷0'); v /= d; } else return v; } }
    function expr() { let v = term(); for (;;) { ws(); if (eat('+')) v += term(); else if (eat('-')) v -= term(); else return v; } }
    const v = expr(); ws(); if (i < t.length) throw new Error('syntax');
    return Math.round(v * 100) / 100;
  },
  press(k) {
    if (k === 'C') { this.expr = ''; this.result = ''; }
    else if (k === '⌫') this.expr = this.expr.slice(0, -1);
    else if (k === '=') { try { this.result = this.evaluate(this.expr); this.expr = String(this.result); } catch (e) { this.result = 'Error'; } }
    else { if (this.result !== '' && /[0-9.]/.test(k) && this.expr === String(this.result)) this.expr = ''; this.result = ''; this.expr += k; }
    const d = document.getElementById('calcExpr'), r = document.getElementById('calcLive');
    if (d) d.textContent = this.expr || '0';
    if (r) { let live = ''; try { live = this.expr && /[+\-×÷*/%]/.test(this.expr) ? '= ' + U.peso(this.evaluate(this.expr)) : ''; } catch (e) { live = ''; } r.textContent = this.result === 'Error' ? 'Check the numbers' : live; }
  }
};

          <div class="tool-row"><div class="wz-money sm"><span>₱</span><input id="tAfford" inputmode="decimal" placeholder="Price"></div></div><div class="tool-out" id="oAfford"></div></div>

/* ------------------------------------------------------------------ Charts */
const CHART_COLORS = ['#2F6B5A', '#EE8D63', '#E0A84F', '#6FA8DC', '#B07CC6', '#7BC4A4', '#E57A8A', '#A3AEA8'];

/** "Where your money went" as a colorful donut with an emoji legend. */
Charts.categories = function (rows) {
  return w => {
    if (!rows.length) return this.empty('🌱 No spending recorded this month yet.');
    let list = rows.slice(0, 6);
    if (rows.length > 6) list.push({ category: 'All other', amount: rows.slice(6).reduce((a, b) => a + b.amount, 0) });
    const total = list.reduce((a, b) => a + b.amount, 0);
    const size = Math.min(180, Math.max(140, w * 0.42)), r = size / 2, rIn = r * 0.62, cx = r, cy = r;
    let a0 = -Math.PI / 2, paths = '';
    list.forEach((x, i) => {
      const frac = x.amount / total, a1 = a0 + frac * Math.PI * 2;
      const large = a1 - a0 > Math.PI ? 1 : 0, p = (ang, rr) => `${(cx + rr * Math.cos(ang)).toFixed(2)},${(cy + rr * Math.sin(ang)).toFixed(2)}`;
      const d = frac >= 0.9999 ? `M${cx},${cy - r}A${r},${r} 0 1 1 ${cx - 0.01},${cy - r}L${cx - 0.01},${cy - rIn}A${rIn},${rIn} 0 1 0 ${cx},${cy - rIn}Z`
        : `M${p(a0, r)}A${r},${r} 0 ${large} 1 ${p(a1, r)}L${p(a1, rIn)}A${rIn},${rIn} 0 ${large} 0 ${p(a0, rIn)}Z`;
      paths += `<path d="${d}" fill="${CHART_COLORS[i % CHART_COLORS.length]}" data-tip="${U.esc(x.category + '\n' + U.peso(x.amount) + ' · ' + Math.round(frac * 100) + '%')}"/>`;
      a0 = a1;
    });
    const svg = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Where your money went">${paths}<text x="${cx}" y="${cy - 4}" text-anchor="middle" class="donut-k">Total</text><text x="${cx}" y="${cy + 16}" text-anchor="middle" class="donut-v">${U.esc(this.compact(total))}</text></svg>`;
    const legend = list.map((x, i) => `<div class="lg-row"><i style="background:${CHART_COLORS[i % CHART_COLORS.length]}"></i><span>${CAT_EMOJI[x.category] || '📦'} ${U.esc(x.category)}</span><b>${U.peso(x.amount, true)}</b><em>${Math.round(x.amount / total * 100)}%</em></div>`).join('');
    return `<div class="donut-wrap">${svg}<div class="donut-legend">${legend}</div></div>`;
  };
};

/** Spending each day this month, with the daily budget as a dashed line. */
Charts.daily = function (month) {
  return w => {
    const y = +month.slice(0, 4), m = +month.slice(5, 7), days = new Date(Date.UTC(y, m, 0)).getUTCDate();
    const by = new Array(days + 1).fill(0);
    Store.list('expenses').forEach(e => { if (!U.bool(e.isDeleted) && String(e.date).slice(0, 7) === month) by[+String(e.date).slice(8, 10)] += Number(e.amount) || 0; });
    Store.list('payments').forEach(p => { if (!U.bool(p.isVoid) && String(p.paymentDate).slice(0, 7) === month) by[+String(p.paymentDate).slice(8, 10)] += Number(p.amount) || 0; });
    const total = by.reduce((a, b) => a + b, 0);
    if (!total) return this.empty('🌱 No spending yet this month — your daily bars will show here.');
    const budget = Calc.budgetFor(month).amount || 0, perDay = budget / days;
    const h = 150, padB = 20, padT = 10, max = this.niceMax(Math.max(...by, perDay));
    const bw = (w - 4) / days, today = U.today();
    let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Spending each day">`;
    for (let d = 1; d <= days; d++) {
      const v = by[d], bh = v / max * (h - padB - padT), x = 2 + (d - 1) * bw;
      const ds = `${month}-${U.pad2(d)}`, over = perDay && v > perDay;
      s += `<rect x="${(x + bw * 0.15).toFixed(1)}" y="${(h - padB - bh).toFixed(1)}" width="${(bw * 0.7).toFixed(1)}" height="${Math.max(v ? 2 : 0, bh).toFixed(1)}" rx="3" fill="${over ? '#EE8D63' : ds === today ? '#2F6B5A' : '#7BC4A4'}" data-tip="${U.esc(U.fmtDate(ds) + '\n' + U.peso(v))}"/>`;
      if (d === 1 || d === days || (d % 5 === 0 && days - d >= 3)) s += `<text x="${(x + bw / 2).toFixed(1)}" y="${h - 5}" text-anchor="middle" class="ax">${d}</text>`;
    }
    if (perDay > 0) { const ly = h - padB - perDay / max * (h - padB - padT); s += `<line x1="0" x2="${w}" y1="${ly.toFixed(1)}" y2="${ly.toFixed(1)}" stroke="#E0A84F" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${w - 2}" y="${(ly - 4).toFixed(1)}" text-anchor="end" class="ax gold">daily budget ${U.esc(this.compact(perDay))}</text>`; }
    return s + '</svg>';
  };
};

/** Semicircle gauge: how much of the budget is used. */
function gauge(pct) {
  const p = Math.max(0, Math.min(1, pct)), r = 70, cx = 90, cy = 84, a = Math.PI * (1 - p);
  const ex = (cx + r * Math.cos(a)).toFixed(1), ey = (cy - r * Math.sin(a)).toFixed(1);
  const col = pct > 1 ? '#C2453B' : pct > 0.85 ? '#EE8D63' : '#2F6B5A';
  return `<svg class="gauge" width="180" height="100" viewBox="0 0 180 100" role="img" aria-label="Budget used ${Math.round(pct * 100)}%"><path d="M20,84A70,70 0 0 1 160,84" fill="none" stroke="#EFE9DF" stroke-width="16" stroke-linecap="round"/>${p > 0 ? `<path d="M20,84A70,70 0 0 1 ${ex},${ey}" fill="none" stroke="${col}" stroke-width="16" stroke-linecap="round"/>` : ''}<text x="90" y="74" text-anchor="middle" class="g-v">${Math.round(pct * 100)}%</text><text x="90" y="94" text-anchor="middle" class="g-k">of budget used</text></svg>`;
}

/** Small progress ring for goals. */
