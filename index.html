      if ((result < 0 && remaining > 0) || budgetUsed >= 1.25) status = 'CRITICAL';
      else if (result < 0 || overdue.length >= 2 || budgetUsed > 1) status = 'WARNING';
      else if (remaining > 0 || late > 0 || budgetUsed >= 0.9) status = 'CAUTION';
      else if (result < E * 0.15) status = 'STABLE';
      else status = 'COMFORTABLE';
    } else {
      if (safe < 0 && coverage < 0.85) reasons.push('short');
      if (safe < 0 && overdueAmt >= E * 0.15 && overdue.length) reasons.push('majorOverdue');
      if (budgetUsed >= 1.25) reasons.push('farOverBudget');
      if (reasons.length) status = 'CRITICAL';
      else {
        if (crunch) reasons.push('crunch');
        if (safe < 0) reasons.push('negative');
        if (overdue.length >= 2) reasons.push('overdue');
        if (budgetUsed > 1) reasons.push('overBudget');
        if (lateRatio >= 0.3) reasons.push('lateIncome');
        if (reasons.length) status = 'WARNING';
        else {
          if (safe < Math.max(500000, expInc * 0.05)) reasons.push('lowRoom');
          if (overdue.length === 1) reasons.push('oneOverdue');
          if (budgetUsed >= 0.9) reasons.push('nearBudget');
          if (late > 0) reasons.push('lateIncome');
          if (unpaid.length >= 3 && totalRemaining >= money * 0.5) reasons.push('manyBills');
          if (reasons.length) status = 'CAUTION';
          else status = safe < Math.max(1500000, expInc * 0.15) ? 'STABLE' : 'COMFORTABLE';
        }
      }
    }

    /* ---------- wording ---------- */
    var mn = monthName(M);
    var majorText = joinList(majors.map(function (o) { return o.name + ' (' + peso(o.amount) + (o.dueDate ? ', ' + dshort(o.dueDate) : '') + ')'; }));
    var nextText = nextIncome ? (nextIncome.source + ' on ' + dshort(nextIncome.date)) : '';
    var headline, comment;
    if (mode === 'past') {
      var res = actInc - paid - other;
      headline = { COMFORTABLE: mn + ' finished comfortably.', STABLE: mn + ' finished on budget, with a thin margin.', CAUTION: mn + ' closed with loose ends.', WARNING: mn + ' cost more than it brought in.', CRITICAL: mn + ' ended in a serious shortfall.' }[status];
      comment = 'The household received ' + peso(actInc) + ' and paid out ' + peso(paid + other) + ', ' + (res >= 0 ? 'leaving ' + peso(res) + '.' : 'a shortfall of ' + peso(-res) + '.') +
        (remaining > 0 ? ' ' + plural(unpaid.length, 'bill') + ' from that month (' + peso(remaining) + ') are still unpaid.' : ' Every bill for the month was paid.');
    } else if (mode === 'future') {
      headline = { COMFORTABLE: mn + ' looks comfortable on paper.', STABLE: mn + ' looks manageable.', CAUTION: mn + ' will be tight.', WARNING: mn + ' needs planning now.', CRITICAL: mn + ' does not add up yet.' }[status];
      comment = 'If all ' + peso(expInc) + ' of expected income arrives, ' + mn + "'s bills (" + peso(totalRemaining) + ')' + (planned ? ' and usual everyday spending (about ' + peso(planned) + ')' : '') +
        (safe >= 0 ? ' leave about ' + peso(safe) + ' of spending room after a safety buffer.' : ' would leave you short by about ' + peso(-safe) + '.');
    } else {
      switch (status) {
        case 'COMFORTABLE':
          headline = "You're in a comfortable position this month.";
          comment = 'Your income covers all fixed bills, with about ' + peso(safe) + ' left after bills. You can spend, but keep some room for unexpected expenses.';
          break;
        case 'STABLE':
          headline = 'Your finances look stable.';
          comment = 'Your bills are covered, but your spending room is limited to about ' + peso(safe) + '. Keep extra spending moderate' + (nextText ? ' until ' + nextText + '.' : ' for the rest of the month.');
          break;
        case 'CAUTION':
          headline = 'A little caution is recommended.';
          if (reasons[0] === 'nearBudget') comment = 'Spending has reached ' + Math.round(budgetUsed * 100) + '% of this month’s budget with ' + plural(daysLeft, 'day') + ' to go. Consider limiting extra purchases.';
          else if (reasons[0] === 'oneOverdue') comment = overdue[0].name + ' (' + peso(overdue[0].amount) + ') is overdue — settle it first. Keep ' + peso(totalRemaining) + ' reserved for the rest of your bills.';
          else if (reasons[0] === 'lateIncome' && reasons.length === 1) comment = peso(late) + ' of expected income hasn’t been marked received yet. Keep spending conservative until it arrives.';
          else comment = 'Keep ' + peso(totalRemaining) + ' reserved for ' + plural(obligations.length, 'unpaid bill') + (majorText ? ' — the biggest are ' + majorText : '') + '. Limit extra spending' + (nextText ? ' until ' + nextText + '.' : ' until your next income arrives.');
          break;
        case 'WARNING':
          headline = 'Your household budget needs attention.';
          if (reasons[0] === 'crunch') comment = peso(crunch.amount) + ' in bills ' + (crunch.until ? 'is due before ' + nextText : 'is still due this month') + ', but only ' + peso(Math.max(0, crunch.cash)) + ' is on hand. Pay the most urgent bills first and avoid extra spending.';
          else if (reasons[0] === 'negative') comment = 'Your remaining bills (' + peso(totalRemaining) + ') are more than the money available and still coming in after everyday costs. Prioritize ' + (majorText || 'upcoming bills') + ' and avoid extra spending until more money comes in.';
          else if (reasons[0] === 'overdue') comment = plural(overdue.length, 'bill') + ' are overdue (' + peso(overdueAmt) + '). Pay those first and hold off on extra spending.';
          else if (reasons[0] === 'overBudget') comment = 'Household spending is ' + peso(spent - budget) + ' above your ' + peso(budget) + ' monthly budget. Pause extra purchases and review what can wait until next month.';
          else comment = peso(late) + ' of expected income hasn’t arrived yet, so there is less money for the remaining ' + peso(totalRemaining) + ' in bills. Keep spending to essentials until it comes in.';
          break;
        default:
          headline = 'Immediate attention is needed.';
          if (reasons[0] === 'farOverBudget') comment = 'Spending is ' + peso(spent - budget) + ' over the monthly budget (' + Math.round(budgetUsed * 100) + '% used). Pause extra spending and review upcoming expenses.';
          else comment = 'Your money available and still coming in isn’t enough to cover what’s still owed — you’re short about ' + peso(-safe) + '. Prioritize essential bills' + (majorText ? ' (' + majorText + ')' : '') + ', pause extra spending and review upcoming expenses.';
      }
    }

    /* ---------- reminders (most important first) ---------- */
    var reminders = [];
    function add(type, text) { reminders.push({ type: type, text: text }); }
    if (overdue.length === 1) add('overdue', overdue[0].name + ' (' + peso(overdue[0].amount) + ') was due ' + dshort(overdue[0].dueDate) + ' and is still unpaid.');
    else if (overdue.length > 1) add('overdue', plural(overdue.length, 'bill') + ' are overdue, totaling ' + peso(overdueAmt) + '.');
    if (crunch && reasons[0] !== 'crunch') add('crunch', peso(crunch.amount) + ' in bills is due before ' + (crunch.until ? dshort(crunch.until) : 'month end') + ', but only ' + peso(Math.max(0, crunch.cash)) + ' is on hand.');
    if (mode === 'current') {
      var big = upcoming.filter(function (o) { return o.dueDate >= today && o.dueDate <= addDaysStr(today, 7) && o.amount >= Math.max(500000, expInc * 0.05); })
        .sort(function (a, b) { return b.amount - a.amount; })[0];

    document.addEventListener('mousemove', e => { if (this.el.classList.contains('show')) this.place(e); });
    document.addEventListener('mouseout', e => { if (e.target.closest('[data-tip]')) this.hide(); });
    document.addEventListener('touchstart', e => { const t = e.target.closest('[data-tip]'); if (t) { const p = e.touches[0]; this.show(t.dataset.tip, p); clearTimeout(this.hideTimer); this.hideTimer = setTimeout(() => this.hide(), 2500); } }, { passive: true });
  },
  show(text, e) { this.el.textContent = text; this.el.classList.add('show'); this.place(e); },
  place(e) {
    const w = this.el.offsetWidth, h = this.el.offsetHeight;
    let x = e.clientX + 14, y = e.clientY - h - 12;
    if (x + w > innerWidth - 8) x = e.clientX - w - 14;
    if (y < 8) y = e.clientY + 18;
    this.el.style.left = Math.max(8, x) + 'px'; this.el.style.top = y + 'px';
  },
  hide() { this.el.classList.remove('show'); }
};

/* ------------------------------------------------------------------ Charts (hand-built SVG, sized to the container) */
const Charts = {
  pending: {},
  css: v => getComputedStyle(document.documentElement).getPropertyValue(v).trim(),
  drawAll() {
    document.querySelectorAll('[data-chart]').forEach(el => {
      const spec = this.pending[el.dataset.chart];
      if (!spec) return;
      const w = Math.max(260, el.clientWidth - (parseFloat(getComputedStyle(el).paddingLeft) + parseFloat(getComputedStyle(el).paddingRight)));
      try { el.innerHTML = spec.draw(w); } catch (e) { el.innerHTML = '<div class="empty">Chart unavailable</div>'; console.error(e); }
    });
  },
  register(id, draw) { this.pending[id] = { draw }; return `<div class="chart" data-chart="${id}"></div>`; },
  niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; },
  compact(v) { if (Math.abs(v) >= 1e6) return '₱' + U.round2(v / 1e6) + 'M'; if (Math.abs(v) >= 1000) return '₱' + Math.round(v / 100) / 10 + 'k'; return '₱' + Math.round(v); },
  trunc(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; },
  empty(msg) { return `<div class="empty" style="padding:28px 0">${U.esc(msg)}</div>`; },

  expectedVsActual(rows) {
    return w => {
      if (!rows.length) return this.empty('No bills for this month.');
      const labelW = Math.min(130, w * 0.32), valW = 74, plotW = w - labelW - valW, rowH = 34;
      const max = this.niceMax(Math.max(...rows.map(r => Math.max(r.expected, r.actual))));
      const h = rows.length * rowH + 8;
      const ce = this.css('--c-expected'), ca = this.css('--c-actual');
      let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Expected versus actual spending by bill">`;
      rows.forEach((r, i) => {
        const y = i * rowH + 4;
        const we = Math.max(r.expected > 0 ? 2 : 0, r.expected / max * plotW), wa = Math.max(r.actual > 0 ? 2 : 0, r.actual / max * plotW);
        const tip = `${r.name}\nExpected ${U.peso(r.expected)}\nActual ${r.actual ? U.peso(r.actual) : '— (not paid)'}`;
        s += `<g data-tip="${U.esc(tip)}"><rect x="0" y="${y - 2}" width="${w}" height="${rowH - 2}" fill="transparent"/>`;
        s += `<text x="0" y="${y + 17}" style="font-weight:600;fill:${this.css('--ink')}">${U.esc(this.trunc(r.name, Math.floor(labelW / 7)))}</text>`;
        s += `<rect x="${labelW}" y="${y + 3}" width="${we}" height="9" rx="3" fill="${ce}"/>`;
        s += `<rect x="${labelW}" y="${y + 15}" width="${wa}" height="9" rx="3" fill="${ca}"/>`;
        s += `<text x="${w}" y="${y + 23}" text-anchor="end" style="font-variant-numeric:tabular-nums">${r.actual ? U.peso(r.actual, true) : '—'}</text></g>`;
      });
      return s + '</svg>';
    };
  },
  incomeVsOut(trend) {
    return w => {
      const h = 220, padL = 52, padB = 26, padT = 10, plotW = w - padL - 4, plotH = h - padB - padT;
      const max = this.niceMax(Math.max(1, ...trend.map(t => Math.max(t.actualIncome, t.totalSpent))));
      const ci = this.css('--c-income'), co = this.css('--c-out');
      let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Income versus money out, last six months">`;
      for (let k = 0; k <= 4; k++) {
        const y = padT + plotH - plotH * k / 4;
        s += `<line class="grid" x1="${padL}" x2="${w}" y1="${y}" y2="${y}"/><text x="${padL - 8}" y="${y + 4}" text-anchor="end">${this.compact(max * k / 4)}</text>`;
      }
      const group = plotW / trend.length, bw = Math.min(22, (group - 14) / 2);
      trend.forEach((t, i) => {
        const cx = padL + group * i + group / 2;
        const hi = t.actualIncome / max * plotH, ho = t.totalSpent / max * plotH;
        const tip = `${U.monthLabel(t.month)}\nIncome received ${U.peso(t.actualIncome)}\nMoney out ${U.peso(t.totalSpent)}\nNet ${U.peso(t.actualIncome - t.totalSpent)}`;
        s += `<g data-tip="${U.esc(tip)}"><rect x="${cx - group / 2}" y="${padT}" width="${group}" height="${plotH}" fill="transparent"/>`;
        s += `<rect x="${cx - bw - 1}" y="${padT + plotH - hi}" width="${bw}" height="${Math.max(0, hi)}" rx="3" fill="${ci}"/>`;
        s += `<rect x="${cx + 1}" y="${padT + plotH - ho}" width="${bw}" height="${Math.max(0, ho)}" rx="3" fill="${co}"/>`;
        s += `<text x="${cx}" y="${h - 8}" text-anchor="middle" style="${t.month === Store.month ? 'font-weight:700;fill:' + this.css('--ink') : ''}">${U.monthShort(t.month)}</text></g>`;
      });
      s += `<line class="axis" x1="${padL}" x2="${w}" y1="${padT + plotH}" y2="${padT + plotH}"/>`;
      return s + '</svg>';
    };
  },
  categories(rows) {
    return w => {
      if (!rows.length) return this.empty('No spending recorded this month yet.');
      let list = rows.slice(0, 7);
      if (rows.length > 7) list.push({ category: 'All other', amount: rows.slice(7).reduce((a, b) => a + b.amount, 0) });
      const total = rows.reduce((a, b) => a + b.amount, 0);
      const labelW = Math.min(120, w * 0.3), valW = 92, plotW = w - labelW - valW, rowH = 28;
      const max = Math.max(...list.map(r => r.amount));
      const h = list.length * rowH;
      let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Spending by category">`;
      list.forEach((r, i) => {
        const y = i * rowH;
        const bw = Math.max(2, r.amount / max * plotW);
        s += `<g data-tip="${U.esc(r.category + '\n' + U.peso(r.amount) + ' · ' + Math.round(r.amount / total * 100) + '% of spending')}"><rect x="0" y="${y}" width="${w}" height="${rowH}" fill="transparent"/>`;
        s += `<text x="0" y="${y + 17}">${U.esc(this.trunc(r.category, Math.floor(labelW / 6.5)))}</text>`;
        s += `<rect x="${labelW}" y="${y + 8}" width="${bw}" height="11" rx="3" fill="${this.css('--ink')}"/>`;
        s += `<text x="${w}" y="${y + 17}" text-anchor="end" style="font-variant-numeric:tabular-nums;fill:${this.css('--ink')}">${U.peso(r.amount, true)}</text></g>`;
      });
      return s + '</svg>';
    };
  },
  savings(rows) {
    return w => {
      if (!rows.length) return this.empty('No months to show yet.');
      const h = 230, padL = 56, padB = 26, padT = 18, plotW = w - padL - 4, plotH = h - padB - padT;
      const vals = rows.map(r => r.saved);
      const hi = Math.max(0, ...vals), lo = Math.min(0, ...vals);
      const step = this.niceMax(Math.max(1, (hi - lo) / 4));
      const top = Math.max(step, Math.ceil(hi / step) * step), bottom = Math.floor(lo / step) * step;
      const range = top - bottom || 1;
      const y = v => padT + (top - v) / range * plotH;
      const fmt = v => (v < 0 ? '−' : '') + this.compact(Math.abs(v));
      const cPos = this.css('--c-income'), cNeg = this.css('--c-out');
      let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Money saved per month">`;
      for (let v = bottom; v <= top + 0.5; v += step) { s += `<line class="grid" x1="${padL}" x2="${w}" y1="${y(v)}" y2="${y(v)}"/><text x="${padL - 8}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`; }
      const group = plotW / rows.length, bw = Math.max(6, Math.min(34, group - 10));
      rows.forEach((r, i) => {
        const cx = padL + group * i + group / 2;
        const y0 = y(0), y1 = y(r.saved);
        const tip = `${U.monthLabel(r.month)}${r.partial ? ' (so far)' : ''}\nSaved ${U.peso(r.saved)}\nIncome ${U.peso(r.income)} · Out ${U.peso(r.out)}${r.rate === null ? '' : '\nSavings rate ' + Math.round(r.rate * 100) + '%'}`;
        s += `<g data-tip="${U.esc(tip)}"><rect x="${cx - group / 2}" y="${padT}" width="${group}" height="${plotH}" fill="transparent"/>`;
        s += `<rect x="${cx - bw / 2}" y="${Math.min(y0, y1)}" width="${bw}" height="${Math.max(1, Math.abs(y1 - y0))}" rx="3" fill="${r.saved >= 0 ? cPos : cNeg}" ${r.partial ? 'opacity=".55"' : ''}/>`;
        if (rows.length <= 12 && group > 44) s += `<text x="${cx}" y="${r.saved >= 0 ? y1 - 5 : y1 + 13}" text-anchor="middle" style="font-variant-numeric:tabular-nums;fill:${this.css('--ink')};font-weight:600">${fmt(r.saved)}</text>`;
        s += `<text x="${cx}" y="${h - 8}" text-anchor="middle">${U.monthShort(r.month)}</text></g>`;
      });
      s += `<line class="axis" x1="${padL}" x2="${w}" y1="${y(0)}" y2="${y(0)}"/>`;
      return s + '</svg>';
    };
  },
  status(counts) {
    const order = [['PAID', '--paid', 'Paid'], ['PARTIAL', '--partial', 'Partly paid'], ['UNPAID', '--unpaid', 'Not paid'], ['OVERDUE', '--overdue', 'Late'], ['OVER BUDGET', '--over', 'Paid more']];
    return w => {
      const total = order.reduce((a, o) => a + (counts[o[0]] || 0), 0);
      if (!total) return this.empty('No bills for this month.');
      const h = 22; let x = 0;
      let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Bill payment status">`;
      const segs = order.filter(o => counts[o[0]]);
      const gaps = (segs.length - 1) * 2, avail = w - gaps;
      segs.forEach((o, i) => {
        const sw = counts[o[0]] / total * avail;
        s += `<rect data-tip="${U.esc(o[2] + ': ' + counts[o[0]] + ' bill' + (counts[o[0]] > 1 ? 's' : ''))}" x="${x}" y="0" width="${Math.max(1, sw)}" height="${h}" rx="4" fill="${this.css(o[1])}"/>`;
        x += sw + 2;
      });
      s += '</svg>';
      s += `<div class="legend" style="padding:14px 0 0">${order.map(o => `<span><i style="background:var(${o[1]})"></i>${o[2]} <b>${counts[o[0]] || 0}</b></span>`).join('')}</div>`;
      return s;
    };
  }
};

            ${tile('Income received', P(r.actualIncome), r.lateIncome ? '<span class="neg">' + P(r.lateIncome) + ' late</span>' : '')}
            ${tile('Fixed bills', P(r.recurringBills), monthWord)}
            ${tile('Bills left to pay', P(r.remainingBills), r.overdueCount ? '<span class="neg">' + r.overdueCount + ' overdue</span>' : (r.carriedOverdue ? 'incl. older bills' : 'still to pay'), r.remainingBills > 0 ? '' : 'pos')}
            ${tile('Paid bills', P(r.paidBills), r.recurringBills ? Math.round(r.paidBills / r.recurringBills * 100) + '% of bills' : '')}
            ${tile('Other spending', P(r.otherExpenses), r.mode === 'current' && r.plannedExpenses ? '~' + P(r.plannedExpenses) + ' more expected' : '')}
            ${tile('Budget left', P(r.budgetRemaining), r.budget ? r.budgetUsedPercent + '% of ' + P(r.budget) + ' used' : 'no budget set', r.budgetRemaining < 0 ? 'neg' : '')}
            ${tile(r.mode === 'current' ? 'Days left' : 'Cash on hand', r.mode === 'current' ? String(r.daysLeft) : P(r.cashOnHand), r.mode === 'current' ? (r.nextIncome ? 'next income ' + U.esc(U.fmtDate(r.nextIncome.date).replace(/, \d{4}$/, '')) : 'in ' + U.esc(U.monthLabel(Store.month).split(' ')[0])) : 'today')}
          </div>
        </div>
        <aside class="ins-side">
          <div class="ins-safe">
            <div class="s-label">✨ Safe to spend${r.mode === 'future' ? ' (planned)' : r.mode === 'past' ? ' — month result' : ''}</div>
            <div class="s-big ${short ? 'is-short' : ''}" title="${U.esc(U.peso(r.safeToSpend))}">${short ? '₱0' : P(r.safeToSpend)}</div>
            ${short ? `<div class="s-short">${r.mode === 'past' ? 'Overspent' : 'Short'} by ${P(-r.safeToSpend)} — hold off on extra spending</div>` : ''}
            <div class="s-formula">${U.esc(formula)}</div>
          </div>
          ${r.reminders.length ? `<ul class="ins-rem">${r.reminders.slice(0, 3).map(x => `<li class="rm-${U.esc(x.type)}"><span class="rm-ic" aria-hidden="true">${icon[x.type] || '·'}</span><span><b>${x.type === 'healthy' ? '' : 'Reminder: '}</b>${U.esc(x.text)}</span></li>`).join('')}</ul>` : ''}
          ${r.upcomingBills.length ? `<div class="ins-list"><div class="t-label">${r.mode === 'past' ? 'Still unpaid' : 'Biggest bills coming up'}</div>${(r.majorBills.length ? r.majorBills.map(m => Object.assign({ status: (r.upcomingBills.find(u => u.billInstanceId === m.billInstanceId) || {}).status }, m)) : r.upcomingBills.slice(0, 3)).map(b => `<div class="ins-li"><span><b>${U.esc(b.name)}</b> <span class="sub">${b.status === 'OVERDUE' ? '<span class="neg">overdue · </span>' : ''}${U.esc(U.fmtDay(b.dueDate))}</span></span><span class="num">${P(b.amount)}</span>${b.billInstanceId ? `<button class="btn sm" data-action="pay" data-id="${U.esc(b.billInstanceId)}">Pay</button>` : ''}</div>`).join('')}</div>` : ''}
          ${incomeRows.length && r.mode !== 'past' ? `<div class="ins-list"><div class="t-label">Income to record</div>${incomeRows.map(x => `<div class="ins-li"><span><b>${U.esc(x.source)}</b> <span class="sub">${x.late ? '<span class="neg">expected </span>' : ''}${U.esc(U.fmtDay(x.date))}</span></span><span class="num">${P(x.expectedAmount)}</span><button class="btn sm ${x.late ? 'pay' : ''}" data-action="receive-income" data-id="${U.esc(x.incomeId)}">Received</button></div>`).join('')}</div>` : ''}
        </aside>
      </div>
      <div class="ins-foot">Worked out from your own records · updates with every change${Number(Store.settings.openingBalance || 0) ? '' : ' · <a href="#" data-action="edit-opening-balance">Set your starting balance</a> for an accurate cash figure'}</div>
    </section>`;
  },
  availablePanel() {
    const today = U.today();
    const a = Calc.available(today);
    const neg = a.safeToSpend < 0;
    const incRow = (r, late) => `<div class="row cols-mini" style="padding:10px 0">
        <div class="primary-cell"><div class="name">${billEmoji(r.source, r.category)} ${U.esc(r.source)}</div><div class="sub">${late ? '<span class="neg">Expected ' + U.esc(U.fmtDay(r.date)) + ' · not marked received</span>' : U.esc(U.fmtDay(r.date))}</div></div>
        <div class="num"><b>${U.peso(r.expectedAmount, true)}</b></div>
        <div class="actions"><button class="btn sm ${late ? 'pay' : ''}" data-action="receive-income" data-id="${U.esc(r.incomeId || r.id)}">Received</button></div></div>`;
    const noBalance = !Number(Store.settings.openingBalance || 0) && !Store.settings.openingBalanceConfirmed;
    return `<div class="card avail">
      <div class="avail-main">
        <div class="label">Safe to spend <span style="opacity:.7">· as of ${U.esc(U.fmtDay(today))}</span></div>
        <div class="big ${neg ? 'neg-light' : ''}" title="${U.esc(U.peso(a.safeToSpend))}">${U.peso(a.safeToSpend, true)}</div>
        <div class="meta">Cash on hand <b>${U.peso(a.cashOnHand, true)}</b>${a.committedBeforeNextIncome > 0 ? ` − <b>${U.peso(a.committedBeforeNextIncome, true)}</b> for ${a.billsBefore.length} bill${a.billsBefore.length === 1 ? '' : 's'} due ${a.nextIncome ? 'before ' + U.esc(U.fmtDay(a.nextIncome.date)) : 'in the next 31 days'}` : ' · no unpaid bills due before the next income'}</div>
        <div class="meta" style="margin-top:10px;opacity:.85">${a.nextIncome ? `Next income: <b>${U.esc(a.nextIncome.source)}</b> · ${U.peso(a.nextIncome.expectedAmount, true)} on ${U.esc(U.fmtDay(a.nextIncome.date))}` : 'No upcoming regular income.'}</div>
        ${noBalance ? `<button class="btn sm" style="margin-top:14px;background:transparent;color:#F7F4EF;border-color:rgba(255,255,255,.35)" data-action="edit-opening-balance">Set your starting balance</button>` : `<div class="meta" style="margin-top:6px;opacity:.65">Starting balance ${U.peso(a.openingBalance, true)}${a.openingBalanceDate ? ' on ' + U.esc(U.fmtDate(a.openingBalanceDate)) : ''} · received ${U.peso(a.incomeReceived, true)} · paid out ${U.peso(a.billsPaid + a.otherExpenses, true)}</div>`}
      </div>
      <div class="avail-side">
        <div class="card-title" style="margin-bottom:4px">Income</div>
        <div class="list">${a.lateIncome.slice(0, 3).map(r => incRow(r, true)).join('')}${a.upcomingIncome.slice(0, 4).map(r => incRow(r, false)).join('') || (a.lateIncome.length ? '' : '<div class="empty" style="padding:18px 0">No expected income. Add one under Income.</div>')}</div>
        <a class="btn sm ghost" href="#/income" style="margin-top:6px">All income</a>
      </div>
    </div>`;
  },
  recurringIncomeCard() {
    const list = Store.list('recurringIncome').sort((a, b) => (U.bool(b.isActive) - U.bool(a.isActive)) || String(a.source).localeCompare(b.source));
    if (!list.length) return `<div class="card card-pad" style="margin-bottom:18px"><div class="card-title" style="margin-bottom:6px">Regular income</div><p class="sub" style="color:var(--ink-2);margin:0">No schedules yet. Add one and its expected payments appear automatically every month.</p></div>`;
    const monthly = list.filter(r => U.bool(r.isActive)).reduce((a, r) => a + Math.round(Calc.monthlyEquivalent(r) * 100), 0);
    return `<div class="card" style="margin-bottom:18px"><div class="card-head"><h3 class="card-title">Regular income</h3><span class="sub" style="font-size:12.5px;color:var(--muted)">≈ ${U.peso(U.fromCents(monthly), true)} / month</span></div>
      <div class="list" style="margin-top:8px">${list.map(r => `<div class="row cols-rec ${U.bool(r.isActive) ? '' : 'dim'}">
        <div class="primary-cell"><div class="name">${billEmoji(r.source, r.category)} ${U.esc(r.source)} ${localTag(r)}</div><div class="sub">${U.esc(r.category)} · ${U.esc(r.paymentMethod)}</div></div>
        <div class="num" data-label="Expected"><b>${U.peso(r.amount)}</b></div>
        <div data-label="Schedule">${U.esc(Calc.scheduleText(r))}${r.weekendRule && r.weekendRule !== 'NONE' ? '<div class="sub">' + U.esc((WEEKEND_RULES.find(w => w.value === r.weekendRule) || {}).label || '') + '</div>' : ''}</div>
        <div data-label="Method">${U.esc(r.paymentMethod)}</div>
        <div class="status-cell">${U.bool(r.isActive) ? '<span class="tag PAID">ACTIVE</span>' : '<span class="tag VOID">PAUSED</span>'}</div>
        <div class="actions"><button class="btn sm" data-action="edit-recurring-income" data-id="${U.esc(r.id)}">Edit</button>${U.bool(r.isActive) ? `<button class="btn sm danger" data-action="toggle-recurring-income" data-id="${U.esc(r.id)}" data-on="0">Pause</button>` : `<button class="btn sm" data-action="toggle-recurring-income" data-id="${U.esc(r.id)}" data-on="1">Resume</button>`}</div>
      </div>`).join('')}</div></div>`;
  },

  /* ============================== LENT MONEY ============================== */
  loans() {
    const f = UI.filters.loans;
    const t = Calc.loanTotals();
    const counts = { open: 0, OVERDUE: 0, REPAID: 0, 'WRITTEN OFF': 0, all: t.list.length };
    t.list.forEach(l => { if (l.status !== 'REPAID' && l.status !== 'WRITTEN OFF') counts.open++; if (counts[l.status] !== undefined) counts[l.status]++; });
    const people = {};
    t.list.filter(l => l.status !== 'REPAID' && l.status !== 'WRITTEN OFF').forEach(l => {
      const k = l.borrower.trim(); people[k] = people[k] || { name: k, lent: 0, repaid: 0, left: 0, overdue: false };
      people[k].lent += U.cents(l.amount); people[k].repaid += U.cents(l.repaidAmount); people[k].left += U.cents(l.remainingAmount); if (l.status === 'OVERDUE') people[k].overdue = true;
    });
    const owe = Object.values(people).sort((a, b) => b.left - a.left);
    const maxLent = Math.max(1, ...owe.map(p => p.lent));
    const stat = (cls, label, value, meta) => `<div class="loan-stat ${cls}"><div class="label">${label}</div><div class="value">${value}</div><div class="meta">${meta}</div></div>`;
    return `${UI.cachedBanner()}
      <div class="toolbar"><div class="left"><h2 class="section-title">Lent Money</h2><span class="sub" style="color:var(--muted)">Money you lent to other people</span></div><button class="btn primary" data-action="add-loan">${svgIcon('plus', 16)} Lend money</button></div>
      <div class="loan-stats">
        ${stat('ls-owed', 'Owed to you', U.peso(t.owed, true), t.openCount ? `${t.openCount} open loan${t.openCount === 1 ? '' : 's'}` : 'Nobody owes you right now')}
        ${stat('ls-lent', 'Lent this month', U.peso(t.lentThisMonth, true), 'Leaves your cash on hand')}
        ${stat('ls-back', 'Repaid this month', U.peso(t.repaidThisMonth, true), 'Back in your cash on hand')}
        ${stat('ls-late', 'Past due', String(t.overdue.length), t.overdue.length ? U.peso(t.overdue.reduce((a, l) => a + l.remainingAmount, 0), true) + ' to follow up' : 'Everyone is on time')}
      </div>
      ${owe.length ? `<div class="card owe-card"><div class="card-head"><h3 class="card-title">Who owes you</h3><span class="sub" style="font-size:12.5px;color:var(--muted)">Tap a name to see their loans</span></div>
        <div class="owe-list">${owe.map(p => `<button class="owe-row ${f.borrower === p.name ? 'on' : ''}" data-action="loan-borrower" data-name="${U.esc(p.name)}" data-tip="${U.esc(p.name + '\nLent ' + U.peso(U.fromCents(p.lent)) + '\nRepaid ' + U.peso(U.fromCents(p.repaid)) + '\nStill owes ' + U.peso(U.fromCents(p.left)))}">
            <span class="avatar sm" style="--av:${avatarColor(p.name)}">${U.esc(initials(p.name))}</span>
            <span class="owe-name">${U.esc(p.name)}${p.overdue ? ' <span class="late-dot" title="Past due"></span>' : ''}</span>
            <span class="owe-bar" style="--w:${(p.lent / maxLent * 100).toFixed(1)}%"><i class="paid" style="--p:${(p.repaid / p.lent * 100).toFixed(1)}%"></i><i class="left" style="--av:${avatarColor(p.name)};--p:${(p.left / p.lent * 100).toFixed(1)}%"></i></span>
            <span class="owe-amt">${U.peso(U.fromCents(p.left), true)}</span></button>`).join('')}</div>
        <div class="legend" style="padding:4px 24px 18px"><span><i style="background:var(--paid)"></i>Repaid</span><span><i style="background:linear-gradient(90deg,#2470A8,#C0643A,#7B4B94)"></i>Still owed (each person's color)</span></div></div>` : ''}
      <div class="chips" style="margin-top:18px">${[['open', 'Still owed'], ['OVERDUE', 'Past due'], ['REPAID', 'Repaid'], ['WRITTEN OFF', 'Written off'], ['all', 'All']].map(c => `<button class="chip ${f.status === c[0] ? 'on' : ''}" data-action="loan-chip" data-status="${c[0]}">${c[1]} <b>${counts[c[0]]}</b></button>`).join('')}
        ${f.borrower ? `<button class="chip on" data-action="loan-borrower" data-name="${U.esc(f.borrower)}">${U.esc(f.borrower)} ×</button>` : ''}</div>
      <div class="filters" style="margin-bottom:14px"><div class="field grow"><label for="flS">Search</label><input id="flS" class="input" type="search" placeholder="Name or note" value="${U.esc(f.search)}" data-filter="loans.search"></div></div>
      <div id="listBody">${this.loansList()}</div>`;
  },
  loansList() {
    const f = UI.filters.loans, q = f.search.trim().toLowerCase();
    const list = Calc.loans().filter(l => (f.status === 'all' || (f.status === 'open' ? (l.status !== 'REPAID' && l.status !== 'WRITTEN OFF') : l.status === f.status)) &&
      (!f.borrower || l.borrower.trim() === f.borrower) && (!q || [l.borrower, l.notes].join(' ').toLowerCase().includes(q)))
      .sort((a, b) => ({ OVERDUE: 0, PARTIAL: 1, OUTSTANDING: 1, REPAID: 3, 'WRITTEN OFF': 4 }[a.status] - { OVERDUE: 0, PARTIAL: 1, OUTSTANDING: 1, REPAID: 3, 'WRITTEN OFF': 4 }[b.status]) || ((a.dueDate || '9999') < (b.dueDate || '9999') ? -1 : 1));
    if (!list.length) return `<div class="card empty"><div class="section-title">${Store.list('loans').length ? 'Nothing here' : 'No loans yet'}</div>${Store.list('loans').length ? 'Try another filter.' : 'When you lend money to someone, record it here to keep track of who owes you.'}<div style="margin-top:14px"><button class="btn primary" data-action="add-loan">Lend money</button></div></div>`;
    return `<div class="loan-grid">${list.map(l => {
      const color = avatarColor(l.borrower);
      const open = f.open[l.id];
      const done = l.status === 'REPAID' || l.status === 'WRITTEN OFF';
      let due = 'No repayment date', dueCls = '';
      if (!done && l.dueDate) {
        if (l.daysToDue < 0) { due = `${-l.daysToDue} day${l.daysToDue === -1 ? '' : 's'} late · was due ${U.fmtDate(l.dueDate).replace(/, \d{4}$/, '')}`; dueCls = 'late'; }
        else if (l.daysToDue === 0) { due = 'Due today'; dueCls = 'soon'; }
        else if (l.daysToDue <= 7) { due = `Due in ${l.daysToDue} day${l.daysToDue === 1 ? '' : 's'} · ${U.fmtDay(l.dueDate)}`; dueCls = 'soon'; }
        else due = 'Due ' + U.fmtDate(l.dueDate);
      } else if (l.status === 'REPAID') { const last = l.repayments[l.repayments.length - 1]; due = 'Fully repaid' + (last ? ' · ' + U.fmtDate(last.date) : ''); dueCls = 'done'; }
      else if (l.status === 'WRITTEN OFF') { due = 'Written off · ' + U.peso(l.remainingAmount, true) + ' not expected back'; dueCls = 'off'; }
      return `<article class="loan-card s-${l.status.replace(' ', '_')} ${open ? 'open' : ''}" data-loan="${U.esc(l.id)}" style="--av:${color}">
        <button class="loan-head" data-action="loan-toggle" data-id="${U.esc(l.id)}" aria-expanded="${open ? 'true' : 'false'}">
          <span class="avatar">${U.esc(initials(l.borrower))}</span>
          <span class="who"><b>${U.esc(l.borrower)}</b> ${localTag(l)}<span class="sub">Lent ${U.esc(U.fmtDate(l.dateLent))} · ${U.esc(l.paymentMethod || '')}</span></span>
          <span class="amt"><b>${U.peso(done ? l.amount : l.remainingAmount, true)}</b><span class="sub">${done ? 'lent' : 'of ' + U.peso(l.amount, true) + ' left'}</span></span>
          <span class="chev" aria-hidden="true">›</span>
        </button>
        <div class="loan-prog"><div class="bar"><i style="--p:${l.progress}"></i></div><div class="prog-meta"><span>${Math.round(l.progress * 100)}% repaid</span><span class="due ${dueCls}">${U.esc(due)}</span></div></div>
        <div class="loan-more">
          ${l.notes ? `<p class="loan-note">${U.esc(l.notes)}</p>` : ''}
          <div class="t-label" style="margin-bottom:6px">Repayments</div>
          ${l.repayments.length ? `<ol class="timeline">${l.repayments.map(r => `<li><span class="dot"></span><span class="tl-main"><b>${U.peso(r.amount)}</b> · ${U.esc(U.fmtDate(r.date))} · ${U.esc(r.paymentMethod || '')} ${localTag(r)}${r.notes ? `<span class="sub">${U.esc(r.notes)}</span>` : ''}</span><button class="btn sm ghost" data-action="void-loan-repayment" data-id="${U.esc(r.id)}" title="Remove this repayment">Undo</button></li>`).join('')}</ol>` : '<p class="sub" style="margin:0 0 10px;color:var(--muted)">Nothing paid back yet.</p>'}
          <div class="loan-actions">
            ${!done ? `<button class="btn sm pay" data-action="loan-repay" data-id="${U.esc(l.id)}">Record repayment</button>` : ''}
            <button class="btn sm" data-action="edit-loan" data-id="${U.esc(l.id)}">Edit</button>
            ${l.status === 'WRITTEN OFF' ? `<button class="btn sm" data-action="loan-writeoff" data-id="${U.esc(l.id)}" data-undo="1">Reopen</button>` : (!done ? `<button class="btn sm ghost" data-action="loan-writeoff" data-id="${U.esc(l.id)}">Write off</button>` : '')}
          </div>
        </div>
      </article>`;
    }).join('')}</div>`;
  },

  /* ============================== SAVINGS ============================== */
  savings() {
    const sv = Calc.savings();
    const cur = sv.rows[sv.rows.length - 1];
    const pct = r => r === null || r === undefined ? '—' : Math.round(r * 100) + '%';
    const tone = v => v < 0 ? 'neg' : '';
    Charts.pending = {};
    const rows = sv.rows.slice().reverse();
    return `${UI.cachedBanner()}
      <div class="hero" style="margin-bottom:18px"><div><div class="eyebrow">Since ${U.esc(sv.openingDate ? U.fmtDate(sv.openingDate) : U.monthLabel(sv.start))}</div><h2 style="font-size:32px">Savings</h2><div class="sub">Income received − everything paid out</div></div></div>
      <div class="stat-grid">
        <div class="card kpi lead"><div class="label">Saved in ${U.esc(U.monthLabel(cur.month).split(' ')[0])} so far</div><div class="value ${cur.saved < 0 ? 'neg-light' : ''}">${U.peso(cur.saved, true)}</div><div class="meta">${cur.rate === null ? 'No income received yet this month' : 'Saved ' + pct(cur.rate) + ' of income received'}</div></div>
        <div class="card kpi"><div class="label">Total saved</div><div class="value ${tone(sv.totalSaved)}">${U.peso(sv.totalSaved, true)}</div><div class="meta">${pct(sv.overallRate)} of ${U.peso(sv.totalIncome, true)} income</div></div>
        <div class="card kpi"><div class="label">Average per month</div><div class="value ${tone(sv.average || 0)}">${sv.average === null ? '—' : U.peso(sv.average, true)}</div><div class="meta">${sv.average === null ? 'Shows after your first full month' : 'Completed months only'}</div></div>
        <div class="card kpi"><div class="label">Cash on hand</div><div class="value ${tone(sv.openingBalance + sv.totalSaved - sv.netLent)}">${U.peso(sv.openingBalance + sv.totalSaved - sv.netLent, true)}</div><div class="meta">Starting ${U.peso(sv.openingBalance, true)} + saved${sv.netLent ? ' − lent out ' + U.peso(sv.netLent, true) : ''}${sv.owedToYou ? ' · <a href="#/loans">' + U.peso(sv.owedToYou, true) + ' owed to you</a>' : ''}</div></div>
      </div>
      <div class="card" style="margin-bottom:18px">
        <div class="card-head"><h3 class="card-title">Saved per month</h3><span class="sub" style="font-size:12.5px;color:var(--muted)">${sv.best ? 'Best: ' + U.esc(U.monthLabel(sv.best.month)) + ' · ' + U.peso(sv.best.saved, true) : ''}</span></div>
        <div class="legend"><span><i style="background:var(--c-income)"></i>Saved</span><span><i style="background:var(--c-out)"></i>Spent more than received</span><span><i style="background:var(--c-income);opacity:.55"></i>This month (so far)</span></div>
        ${Charts.register('savings', Charts.savings(sv.rows.slice(-12)))}
      </div>
      <div class="card">
        <div class="table-scroll" style="padding:6px 12px 14px"><table class="report-table">
          <thead><tr><th>Month</th><th class="n">Income received</th><th class="n">Bills paid</th><th class="n">Other expenses</th><th class="n">Saved</th><th class="n">Savings rate</th><th class="n">Running total</th></tr></thead>
          <tbody>${rows.map(r => `<tr><td>${U.esc(U.monthLabel(r.month))}${r.partial ? ' <span class="sub" style="color:var(--muted)">(so far)</span>' : ''}</td><td class="n">${U.peso(r.income)}</td><td class="n">${U.peso(r.bills)}</td><td class="n">${U.peso(r.other)}</td><td class="n ${tone(r.saved)}"><b>${U.peso(r.saved)}</b></td><td class="n">${pct(r.rate)}</td><td class="n">${U.peso(r.running)}</td></tr>`).join('')}</tbody>
        </table></div>
        <div class="list-foot"><span class="sub" style="font-weight:500">Counted by the date money actually came in or went out.${sv.openingDate ? '' : ' Set a starting balance in Settings to fix the start date.'}</span></div>
      </div>`;
  },

  /* ============================== BILLS ============================== */
  bills() {
    const f = UI.filters.bills;
    const cats = Array.from(new Set(Store.list('billInstances').map(i => i.category).filter(Boolean))).sort();
    const inst = Calc.instances().filter(i => i.billingPeriod === Store.month && !i.isVoid);
    const count = st => inst.filter(i => i.status === st).length;
    return `${UI.cachedBanner()}
      <div class="toolbar"><div class="left"><h2 class="section-title">Bills · ${U.esc(U.monthLabel(Store.month))}</h2></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn" href="#/recurring">Manage fixed bills</a></div></div>
      <div class="chips">${[['', 'All', inst.length], ['OVERDUE', 'Late', count('OVERDUE')], ['UNPAID', 'Not paid', count('UNPAID')], ['PARTIAL', 'Partly paid', count('PARTIAL')], ['PAID', 'Paid', count('PAID')], ['OVER BUDGET', 'Paid more', count('OVER BUDGET')]].map(c => `<button class="chip ${f.status === c[0] ? 'on' : ''}" data-action="bill-chip" data-status="${c[0]}">${c[1]} <b>${c[2]}</b></button>`).join('')}</div>
      <div class="filters">
        <div class="field grow"><label for="fbS">Search</label><input id="fbS" class="input" type="search" placeholder="Bill name, category or note" value="${U.esc(f.search)}" data-filter="bills.search"></div>
        <div class="field"><label for="fbSt">Status</label><select id="fbSt" class="input" data-filter="bills.status">${UI.options([{ value: 'OVERDUE', label: 'Late' }, { value: 'UNPAID', label: 'Not paid' }, { value: 'PARTIAL', label: 'Partly paid' }, { value: 'PAID', label: 'Paid' }, { value: 'OVER BUDGET', label: 'Paid more' }], f.status, 'All statuses')}</select></div>
        <div class="field"><label for="fbC">Category</label><select id="fbC" class="input" data-filter="bills.category">${UI.options(cats, f.category, 'All categories')}</select></div>
      </div>
      <div class="card" id="listBody">${this.billsList()}</div>`;
  },
  billsList() {
    const f = UI.filters.bills, q = f.search.trim().toLowerCase();
    const list = Calc.instances().filter(i => i.billingPeriod === Store.month && !i.isVoid && (!f.status || i.status === f.status) && (!f.category || i.category === f.category) &&
      (!q || [i.billName, i.category, i.notes, i.status].join(' ').toLowerCase().includes(q)))
      .sort((a, b) => (a.dueDate < b.dueDate ? -1 : a.dueDate > b.dueDate ? 1 : String(a.billName).localeCompare(b.billName)));
    if (!list.length) return `<div class="empty"><div class="section-title">No bills found</div>${Store.list('billInstances').length ? 'Try another filter or month.' : (Api.configured() ? 'Bills appear after the first sync.' : 'Connect to Google Sheets in Settings to load your bills.')}</div>`;
    let te = 0, tp = 0, tr = 0;
    const rows = list.map(i => {
      te += U.cents(i.expectedAmount); tp += U.cents(i.actualAmount); tr += Math.max(0, U.cents(i.remainingAmount));
      const done = i.status === ST.PAID || i.status === ST.OVER;
      return `<div class="row cols-bills">
        <div class="primary-cell"><div class="name">${billEmoji(i.billName, i.category)} ${U.esc(i.billName)} ${localTag(i.hasLocal ? { syncStatus: 'pending' } : null)}</div><div class="sub">${i.arrivalDate && i.arrivalDate !== i.dueDate ? (i.arrivalDate > U.today() ? 'Arrives ' : 'Arrived ') + U.esc(U.fmtDate(i.arrivalDate)) + ' · ' : ''}${U.esc(i.category || '')}${i.frequency ? ' · ' + U.esc(i.frequency.toLowerCase()) : ''}${i.notes ? ' · ' + U.esc(i.notes) : ''}</div></div>
        <div data-label="Due">${U.fmtDate(i.dueDate)}</div>
        <div class="num" data-label="Expected">${U.peso(i.expectedAmount)}</div>
        <div class="num" data-label="Paid">${i.paymentCount ? U.peso(i.actualAmount) : '<span style="color:var(--muted)">—</span>'}</div>
        <div class="num c-diff" data-label="${i.remainingAmount < 0 ? 'Overpaid' : 'Remaining'}">${i.remainingAmount < 0 ? '<span style="color:var(--over)">+' + U.peso(-i.remainingAmount) + '</span>' : U.peso(i.remainingAmount)}</div>
        <div class="status-cell">${tagFor(i.status)}</div>
        <div class="actions">${done ? '' : `<button class="btn sm pay" data-action="pay" data-id="${U.esc(i.billInstanceId)}">${i.paymentCount ? 'Pay balance' : 'Mark as Paid'}</button>`}<button class="btn sm" data-action="bill-details" data-id="${U.esc(i.billInstanceId)}">Details</button></div>
      </div>`;
    }).join('');
    return `<div class="list"><div class="row head cols-bills"><div>Bill</div><div>Due</div><div class="num">Expected</div><div class="num">Paid</div><div class="num c-diff">Remaining</div><div>Status</div><div></div></div>${rows}</div>
      <div class="list-foot"><span>${list.length} bill${list.length === 1 ? '' : 's'}</span><span>Expected ${U.peso(U.fromCents(te))} · Paid ${U.peso(U.fromCents(tp))} · Remaining ${U.peso(U.fromCents(tr))}</span></div>`;
  },

  /* ============================== EXPENSES ============================== */
  expenses() {
    const f = UI.filters.expenses;
    return `${UI.cachedBanner()}
      <div class="toolbar"><div class="left"><h2 class="section-title">Other Expenses</h2></div><button class="btn primary" data-action="add-expense">${svgIcon('plus', 16)} Add expense</button></div>
      <div class="filters">
        <div class="field grow"><label for="feS">Search</label><input id="feS" class="input" type="search" placeholder="Description, note, method" value="${U.esc(f.search)}" data-filter="expenses.search"></div>
        <div class="field"><label for="feC">Category</label><select id="feC" class="input" data-filter="expenses.category">${UI.options(Store.categories('EXPENSE'), f.category, 'All categories')}</select></div>
        <div class="field"><label for="feF">From</label><input id="feF" class="input" type="date" value="${U.esc(f.from)}" data-filter="expenses.from"></div>
        <div class="field"><label for="feT">To</label><input id="feT" class="input" type="date" value="${U.esc(f.to)}" data-filter="expenses.to"></div>
      </div>
      <div class="card" id="listBody">${this.expensesList()}</div>`;
  },
  dateScope(f, d) {
    if (f.from || f.to) return (!f.from || d >= f.from) && (!f.to || d <= f.to);
    return String(d).slice(0, 7) === Store.month;
  },
  scopeLabel(f) { return f.from || f.to ? (f.from ? U.fmtDate(f.from) : 'Start') + ' – ' + (f.to ? U.fmtDate(f.to) : 'today') : U.monthLabel(Store.month); },
  expensesList() {
    const f = UI.filters.expenses, q = f.search.trim().toLowerCase();
    const list = Store.list('expenses').filter(e => !U.bool(e.isDeleted) && this.dateScope(f, e.date) && (!f.category || e.category === f.category) &&
      (!q || [e.description, e.category, e.notes, e.paymentMethod].join(' ').toLowerCase().includes(q))).sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (a.createdAt < b.createdAt ? 1 : -1)));
    if (!list.length) return `<div class="empty"><div class="section-title">No expenses</div>Nothing recorded for ${U.esc(this.scopeLabel(f))}.<div style="margin-top:14px"><button class="btn primary" data-action="add-expense">Add expense</button></div></div>`;
    const total = list.reduce((a, e) => a + U.cents(e.amount), 0);
    return `<div class="list"><div class="row head cols-exp"><div>Date</div><div>Description</div><div>Category</div><div>Method</div><div class="num">Amount</div><div></div></div>
      ${list.map(e => `<div class="row cols-exp">
        <div data-label="Date">${U.fmtDate(e.date)}</div>
        <div class="primary-cell"><div class="name">${catEmoji(e.category)} ${U.esc(e.description)} ${localTag(e)}</div>${e.notes ? `<div class="sub">${U.esc(e.notes)}</div>` : ''}</div>
        <div data-label="Category">${U.esc(e.category)}</div>
        <div data-label="Method">${U.esc(e.paymentMethod)}</div>
        <div class="num status-cell"><b>${U.peso(e.amount)}</b></div>
        <div class="actions"><button class="btn sm" data-action="edit-expense" data-id="${U.esc(e.id)}">Edit</button><button class="btn sm danger" data-action="delete-expense" data-id="${U.esc(e.id)}">Delete</button></div>
      </div>`).join('')}</div>
      <div class="list-foot"><span>${list.length} expense${list.length === 1 ? '' : 's'} · ${U.esc(this.scopeLabel(f))}</span><span>Total ${U.peso(U.fromCents(total))}</span></div>`;
  },

    return `${UI.cachedBanner()}

  incomeList() {

      (!q || [r.source, r.category, r.notes, r.paymentMethod, r.status].join(' ').toLowerCase().includes(q))).sort((a, b) => (a.date < b.date ? 1 : -1));
    if (!list.length) return `<div class="empty"><div class="section-title">No income recorded</div>Nothing for ${U.esc(this.scopeLabel(f))}.<div style="margin-top:14px"><button class="btn primary" data-action="add-income">Add income</button></div></div>`;

      ${list.map(r => `<div class="row cols-inc ${r.status === 'CANCELLED' ? 'dim' : ''}">
        <div data-label="Date">${U.fmtDate(r.date)}</div>
        <div class="primary-cell"><div class="name">${billEmoji(r.source, r.category)} ${U.esc(r.source)} ${localTag(r)}</div><div class="sub">${U.esc(r.paymentMethod || '')}${r.notes ? ' · ' + U.esc(r.notes) : ''}</div></div>

        <div class="num" data-label="Expected">${U.peso(r.expectedAmount)}</div>

      </div>`).join('')}</div>
      <div class="list-foot"><span>${list.length} entr${list.length === 1 ? 'y' : 'ies'} · ${U.esc(this.scopeLabel(f))}</span><span>Expected ${U.peso(U.fromCents(te))} · Received ${U.peso(U.fromCents(ta))}</span></div>`;
  },

  /* ============================== RECURRING ============================== */
  recurring() {
    const list = Store.list('recurringBills').sort((a, b) => (U.bool(b.isActive) - U.bool(a.isActive)) || FREQUENCIES.indexOf(a.frequency) - FREQUENCIES.indexOf(b.frequency) || String(a.name).localeCompare(b.name));
    const active = list.filter(b => U.bool(b.isActive));
    const monthlyFixed = active.filter(b => b.frequency === 'MONTHLY').reduce((a, b) => a + U.cents(b.amount), 0);
    const weekly = active.filter(b => b.frequency === 'WEEKLY').reduce((a, b) => a + U.cents(b.amount), 0);
    const equiv = active.reduce((a, b) => a + Math.round(Calc.monthlyEquivalent(b) * 100), 0);
    const offline = !navigator.onLine || !Api.configured();
    return `${UI.cachedBanner()}
      <div class="toolbar"><div class="left"><h2 class="section-title">Fixed Bills</h2></div><button class="btn primary" data-action="add-recurring">${svgIcon('plus', 16)} Add fixed bill</button></div>
      ${offline ? '<div class="banner"><span class="grow">Changes to fixed bills are queued and applied when you are online — bill instances are generated by the server so that duplicates are impossible.</span></div>' : ''}
      <div class="stat-grid">
        <div class="card kpi lead"><div class="label">Fixed monthly bills</div><div class="value">${U.peso(U.fromCents(monthlyFixed), true)}</div><div class="meta">${active.filter(b => b.frequency === 'MONTHLY').length} active monthly bills</div></div>
        <div class="card kpi"><div class="label">Weekly recurring</div><div class="value">${U.peso(U.fromCents(weekly), true)}</div><div class="meta">per week</div></div>
        <div class="card kpi"><div class="label">Monthly equivalent</div><div class="value">${U.peso(U.fromCents(equiv), true)}</div><div class="meta">all active schedules, averaged</div></div>
        <div class="card kpi"><div class="label">Schedules</div><div class="value">${active.length}<span style="font-size:16px;color:var(--muted)"> / ${list.length}</span></div><div class="meta">active / total</div></div>
      </div>
      <div class="card">${list.length ? `<div class="list"><div class="row head cols-rec"><div>Bill</div><div class="num">Amount</div><div>Schedule</div><div>Method</div><div>Status</div><div></div></div>
      ${list.map(b => `<div class="row cols-rec ${U.bool(b.isActive) ? '' : 'dim'}">
        <div class="primary-cell"><div class="name">${billEmoji(b.name, b.category)} ${U.esc(b.name)} ${localTag(b)}</div><div class="sub">${U.esc(b.category)} · since ${U.fmtDate(b.startDate)}${b.endDate ? ' · ends ' + U.fmtDate(b.endDate) : ''}</div></div>
        <div class="num" data-label="Amount"><b>${U.peso(b.amount)}</b></div>
        <div data-label="Schedule">${U.esc(Calc.scheduleText(b))}</div>
        <div data-label="Method">${U.esc(b.paymentMethod)}</div>
        <div class="status-cell">${U.bool(b.isActive) ? '<span class="tag PAID">ACTIVE</span>' : '<span class="tag VOID">DISABLED</span>'}</div>
        <div class="actions"><button class="btn sm" data-action="edit-recurring" data-id="${U.esc(b.id)}">Edit</button>${U.bool(b.isActive) ? `<button class="btn sm danger" data-action="toggle-recurring" data-id="${U.esc(b.id)}" data-on="0">Disable</button>` : `<button class="btn sm" data-action="toggle-recurring" data-id="${U.esc(b.id)}" data-on="1">Enable</button>`}</div>
      </div>`).join('')}</div>` : `<div class="empty"><div class="section-title">No fixed bills yet</div>${Api.configured() ? 'They appear after the first sync.' : 'Connect to Google Sheets to load the defaults.'}</div>`}</div>`;
  },

  /* ============================== PAYMENTS ============================== */
  payments() {
    const f = UI.filters.payments;

        <div class="field"><label for="fpT">To</label><input id="fpT" class="input" type="date" value="${U.esc(f.to)}" data-filter="payments.to"></div>
      </div>
      <div class="card" id="listBody">${this.paymentsList()}</div>`;

  paymentsList() {

      (!q || [p.billName, p.notes, p.paymentMethod, p.billingPeriod].join(' ').toLowerCase().includes(q))).sort((a, b) => (a.paymentDate < b.paymentDate ? 1 : a.paymentDate > b.paymentDate ? -1 : (a.createdAt < b.createdAt ? 1 : -1)));

      ${list.map(p => `<div class="row cols-pay">
        <div data-label="Date">${U.fmtDate(p.paymentDate)}</div>
        <div class="primary-cell"><div class="name">${U.esc(p.billName || p.billInstanceId)} ${localTag(p)}</div><div class="sub">for ${U.esc(U.monthLabel(p.billingPeriod))}</div></div>
        <div class="num status-cell"><b>${U.peso(p.amount)}</b></div>
        <div data-label="Method">${U.esc(p.paymentMethod)}</div>
        <div data-label="Notes" class="sub">${U.esc(p.notes || '—')}</div>
        <div class="actions"><button class="btn sm danger" data-action="void-payment" data-id="${U.esc(p.id)}">Void</button></div>
      </div>`).join('')}</div>
      <div class="list-foot"><span>${list.length} payment${list.length === 1 ? '' : 's'} · ${U.esc(this.scopeLabel(f))}</span><span>Total paid ${U.peso(U.fromCents(total))}</span></div>`;
  },

  reports() {

      ${r.highlights ? `<div class="card-pad" style="padding-top:8px;padding-bottom:4px"><div class="summary-box" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">${r.highlights.map(h => `<div><span>${U.esc(h[0])}</span><b>${U.esc(h[1])}</b></div>`).join('')}</div></div>` : ''}
      <div class="table-scroll" style="padding:0 12px 18px">${r.rows.length ? `<table class="report-table"><thead><tr>${r.columns.map(c => `<th class="${c.money || c.num ? 'n' : ''}">${U.esc(c.label)}</th>`).join('')}</tr></thead>

      ${r.totals ? `<tfoot><tr>${r.columns.map((c, i) => `<td class="${c.money || c.num ? 'n' : ''}">${i === 0 ? 'Total' : (r.totals[c.key] !== undefined ? fmt(c, r.totals[c.key]) : '')}</td>`).join('')}</tr></tfoot>` : ''}</table>` : '<div class="empty">No records in this period.</div>'}</div></div>`;
  },

  /* ============================== SYNC CENTER ============================== */
  sync() {
    const online = navigator.onLine && Sync.reachable !== false;
    const q = Store.queue;
    const pending = Store.pendingCount(), failed = Store.failedCount();
    const label = o => ({ EXPENSE: 'Expense', INCOME: 'Income', PAYMENT: 'Payment', RECURRING_BILL: 'Fixed bill', BILL_INSTANCE: 'Bill', BUDGET: 'Budget', SETTINGS: 'Settings', LOAN: 'Lent money', LOAN_REPAYMENT: 'Loan repayment', RECURRING_INCOME: 'Regular income' }[o.entityType] || o.entityType) + ' · ' + ({ CREATE: 'create', UPDATE: 'update', DELETE: o.entityType === 'PAYMENT' ? 'void' : 'delete', PAYMENT: 'payment', DISABLE: 'disable', ENABLE: 'enable' }[o.action] || o.action.toLowerCase());
    const describe = o => { const p = o.payload || {}; return [p.description || p.source || p.name || p.billName || '', p.amount !== undefined ? U.peso(p.amount) : p.actualAmount ? U.peso(p.actualAmount) : p.plannedAmount !== undefined ? U.peso(p.plannedAmount) : '', p.date || p.paymentDate || p.month || ''].filter(Boolean).join(' · '); };
    return `
      <div class="stat-grid">
        <div class="card kpi ${online ? 'lead' : ''}"><div class="label">Connection status</div><div class="value" style="font-size:24px">${online ? 'ONLINE' : 'OFFLINE'}</div><div class="meta">${IS_GAS ? 'Apps Script hosted' : Api.configured() ? 'Google Sheets connected' : 'Not connected'}</div></div>

const AVATAR_COLORS = ['#2470A8', '#C0643A', '#3E7A55', '#7B4B94', '#B0832A', '#2D8C8C', '#B0466E', '#5A6B2E'];
function avatarColor(name) { let h = 0; String(name || '').toLowerCase().trim().split('').forEach(ch => { h = (h * 31 + ch.charCodeAt(0)) >>> 0; }); return AVATAR_COLORS[h % AVATAR_COLORS.length]; }
function initials(name) { const p = String(name || '?').trim().split(/\s+/); return ((p[0] || '?')[0] + (p.length > 1 ? p[p.length - 1][0] : (p[0] || '')[1] || '')).toUpperCase(); }
function fmtVal(v) { return U.blank(v) ? '(blank)' : typeof v === 'number' ? U.peso(v) : String(v); }

/* ------------------------------------------------------------------ Reports */
const Reports = {
  build() {
    const f = UI.filters.reports;
    let from = U.isYm(f.from) ? f.from : Store.month, to = U.isYm(f.to) ? f.to : from;
    if (to < from) [from, to] = [to, from];
    const months = U.monthRange(from, to).slice(0, 60);
    const inRange = d => { const m = String(d).slice(0, 7); return m >= from && m <= to; };
    const period = from === to ? U.monthLabel(from) : U.monthLabel(from) + ' – ' + U.monthLabel(to);
    const today = U.today();
    const inst = Calc.instances(today);
    const sum = (rows, k) => U.fromCents(rows.reduce((a, r) => a + U.cents(r[k]), 0));
    switch (f.type) {
      case 'income': {
        const rows = Store.list('income').filter(r => !U.bool(r.isDeleted) && inRange(r.date)).sort((a, b) => (a.date < b.date ? -1 : 1));
        const active = rows.filter(r => r.status !== 'CANCELLED');
        return { title: 'Income Report', period, rows, columns: [{ key: 'date', label: 'Date', date: true }, { key: 'source', label: 'Source' }, { key: 'category', label: 'Category' }, { key: 'paymentMethod', label: 'Method' }, { key: 'status', label: 'Status' }, { key: 'expectedAmount', label: 'Expected', money: true }, { key: 'actualAmount', label: 'Received', money: true }, { key: 'notes', label: 'Notes' }],
          totals: { expectedAmount: sum(active, 'expectedAmount'), actualAmount: sum(active, 'actualAmount') },
          highlights: [['Expected', U.peso(sum(active, 'expectedAmount'))], ['Received', U.peso(sum(active, 'actualAmount'))], ['Entries', String(rows.length)]] };
      }
      case 'expense': {
        const rows = Store.list('expenses').filter(r => !U.bool(r.isDeleted) && inRange(r.date)).sort((a, b) => (a.date < b.date ? -1 : 1));
        const byCat = {}; rows.forEach(r => { byCat[r.category] = (byCat[r.category] || 0) + U.cents(r.amount); });
        const top = Object.keys(byCat).sort((a, b) => byCat[b] - byCat[a]).slice(0, 3).map(k => [k, U.peso(U.fromCents(byCat[k]))]);
        return { title: 'Expense Report', period, rows, columns: [{ key: 'date', label: 'Date', date: true }, { key: 'description', label: 'Description' }, { key: 'category', label: 'Category' }, { key: 'paymentMethod', label: 'Method' }, { key: 'amount', label: 'Amount', money: true }, { key: 'notes', label: 'Notes' }],
          totals: { amount: sum(rows, 'amount') }, highlights: [['Total', U.peso(sum(rows, 'amount'))], ['Entries', String(rows.length)]].concat(top) };
      }
      case 'bill': {
        const rows = inst.filter(i => !i.isVoid && i.billingPeriod >= from && i.billingPeriod <= to).sort((a, b) => (a.dueDate < b.dueDate ? -1 : 1)).map(i => Object.assign({}, i, { remaining: Math.max(0, i.remainingAmount) }));
        return { title: 'Bill Report', period, rows, columns: [{ key: 'billingPeriod', label: 'Month', month: true }, { key: 'billName', label: 'Bill' }, { key: 'category', label: 'Category' }, { key: 'dueDate', label: 'Due', date: true }, { key: 'expectedAmount', label: 'Expected', money: true }, { key: 'actualAmount', label: 'Paid', money: true }, { key: 'remaining', label: 'Remaining', money: true }, { key: 'status', label: 'Status' }, { key: 'paidDate', label: 'Paid on', date: true }],
          totals: { expectedAmount: sum(rows, 'expectedAmount'), actualAmount: sum(rows, 'actualAmount'), remaining: sum(rows, 'remaining') },
          highlights: [['Bills', String(rows.length)], ['Paid', String(rows.filter(r => r.status === ST.PAID || r.status === ST.OVER).length)], ['Overdue', String(rows.filter(r => r.status === ST.OVERDUE).length)], ['Outstanding', U.peso(sum(rows, 'remaining'))]] };
      }
      case 'payments': {
        const rows = Store.list('payments').filter(p => !U.bool(p.isVoid) && inRange(p.paymentDate)).sort((a, b) => (a.paymentDate < b.paymentDate ? -1 : 1));
        return { title: 'Payment History', period, rows, columns: [{ key: 'paymentDate', label: 'Date', date: true }, { key: 'billName', label: 'Bill' }, { key: 'billingPeriod', label: 'For month', month: true }, { key: 'paymentMethod', label: 'Method' }, { key: 'amount', label: 'Amount', money: true }, { key: 'notes', label: 'Notes' }, { key: 'paymentId', label: 'Payment ID' }],
          totals: { amount: sum(rows, 'amount') }, highlights: [['Total paid', U.peso(sum(rows, 'amount'))], ['Payments', String(rows.length)]] };
      }
      case 'performance': {

      }
    }
  },
  csv() {
    const r = this.build();
    const cell = v => { let s = U.blank(v) ? '' : String(v); if (/^[=+\-@]/.test(s) && isNaN(Number(s))) s = "'" + s; return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const lines = [r.columns.map(c => cell(c.label)).join(',')].concat(r.rows.map(row => r.columns.map(c => cell(c.money ? (U.blank(row[c.key]) ? '' : Number(row[c.key]).toFixed(2)) : row[c.key])).join(',')));
    if (r.totals) lines.push(r.columns.map((c, i) => i === 0 ? 'Total' : r.totals[c.key] !== undefined ? Number(r.totals[c.key]).toFixed(2) : '').join(','));
    download('﻿' + lines.join('\r\n'), (r.title.toLowerCase().replace(/\s+/g, '-')) + '-' + (UI.filters.reports.from || Store.month) + (UI.filters.reports.to && UI.filters.reports.to !== UI.filters.reports.from ? '_to_' + UI.filters.reports.to : '') + '.csv', 'text/csv;charset=utf-8');
  }
};
function download(content, name, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ------------------------------------------------------------------ Modal */
const Modal = {
  current: null,
  open({ title, eyebrow, body, foot, wide, onSubmit, onOpen }) {
    this.close();
    const root = document.getElementById('modalRoot');
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = `<form class="modal ${wide ? 'wide' : ''}" novalidate role="dialog" aria-modal="true" aria-label="${U.esc(title)}">
      <div class="modal-head"><div style="flex:1">${eyebrow ? `<span class="eyebrow">${U.esc(eyebrow)}</span>` : ''}<h3>${U.esc(title)}</h3></div><button type="button" class="close-x" data-close aria-label="Close">×</button></div>
      <div class="modal-body">${body}<div class="form-error" data-err></div></div>
      ${foot !== null ? `<div class="modal-foot">${foot || '<button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary">Save</button>'}</div>` : ''}
    </form>`;
    root.appendChild(back);
    const form = back.querySelector('form');
    const state = { back, form, opId: U.opId(), submitting: false };
    this.current = state;
    back.addEventListener('mousedown', e => { if (e.target === back) this.close(); });
    back.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => this.close()));
    form.addEventListener('submit', async e => {
      e.preventDefault();
      if (state.submitting || !onSubmit) return;
      const btn = form.querySelector('button[type=submit]');
      state.submitting = true;
      this.error('');
      try {
        await UI.busy(btn, btn && btn.dataset.busyLabel || 'Saving…', () => onSubmit(new FormData(form), form, state));
      } catch (err) {
        console.error(err);
        this.error(err.message || 'Something went wrong.');
      } finally { state.submitting = false; }
    });
    if (onOpen) onOpen(form, state);
    const first = form.querySelector('input:not([type=hidden]):not([readonly]),select,textarea');
    if (first && matchMedia('(min-width:901px)').matches) first.focus({ preventScroll: true });
    return state;
  },
  error(msg) { if (!this.current) return; const el = this.current.form.querySelector('[data-err]'); el.textContent = msg; el.classList.toggle('show', !!msg); },
  close() { if (this.current) { this.current.back.remove(); this.current = null; } },
  confirm(title, message, okLabel, danger) {
    return new Promise(resolve => {
      let done = false;
      const finish = v => { if (!done) { done = true; resolve(v); } };
      this.open({ title, body: `<p style="margin:0;color:var(--ink-2)">${message}</p>`, foot: `<button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn ${danger ? 'danger' : 'primary'}">${U.esc(okLabel || 'Confirm')}</button>`, onSubmit: async () => { finish(true); this.close(); } });
      const st = this.current;
      st.back.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => finish(false)));
      st.back.addEventListener('mousedown', e => { if (e.target === st.back) finish(false); });
      const obs = new MutationObserver(() => { if (!st.back.isConnected) { obs.disconnect(); finish(false); } });
      obs.observe(document.getElementById('modalRoot'), { childList: true });
    });
  }
};

/* Form helpers */
const F = {
  money(name, label, value, opts) { opts = opts || {}; return `<div class="field ${opts.full ? 'full' : ''}"><label for="f_${name}">${label}</label><div class="money-wrap"><span>₱</span><input id="f_${name}" name="${name}" class="input" inputmode="decimal" autocomplete="off" placeholder="${opts.placeholder || '0.00'}" value="${U.blank(value) ? '' : U.esc(Number(value).toFixed(2))}" ${opts.required ? 'required' : ''}></div>${opts.hint ? `<span class="hint" id="h_${name}">${opts.hint}</span>` : ''}</div>`; },
  text(name, label, value, opts) { opts = opts || {}; return `<div class="field ${opts.full ? 'full' : ''}"><label for="f_${name}">${label}</label><input id="f_${name}" name="${name}" class="input" type="${opts.type || 'text'}" value="${U.esc(value || '')}" ${opts.required ? 'required' : ''} ${opts.attrs || ''} maxlength="${opts.max || 200}">${opts.hint ? `<span class="hint">${opts.hint}</span>` : ''}</div>`; },
  date(name, label, value, opts) { opts = opts || {}; return `<div class="field ${opts.full ? 'full' : ''}"><label for="f_${name}">${label}</label><input id="f_${name}" name="${name}" class="input" type="date" value="${U.esc(value || '')}" ${opts.required ? 'required' : ''}>${opts.hint ? `<span class="hint">${opts.hint}</span>` : ''}</div>`; },
  select(name, label, list, value, opts) { opts = opts || {}; return `<div class="field ${opts.full ? 'full' : ''}"><label for="f_${name}">${label}</label><select id="f_${name}" name="${name}" class="input">${UI.options(list, value, opts.placeholder)}</select>${opts.hint ? `<span class="hint">${opts.hint}</span>` : ''}</div>`; },
  notes(value) { return `<div class="field full"><label for="f_notes">Notes</label><textarea id="f_notes" name="notes" class="input" maxlength="1000" placeholder="Optional">${U.esc(value || '')}</textarea></div>`; },
  req(fd, k, label) { const v = String(fd.get(k) || '').trim(); if (!v) throw new Error(label + ' is required.'); return v; },
  amount(fd, k, label, opts) {
    opts = opts || {};
    const v = U.parseMoney(fd.get(k));
    if (v === '') { if (opts.allowBlank) return ''; throw new Error(label + ' is required.'); }
    if (isNaN(v)) throw new Error(label + ' must be a number.');
    if (opts.positive && v <= 0) throw new Error(label + ' must be greater than zero.');
    if (v < 0) throw new Error(label + ' cannot be negative.');
    if (v > 1e9) throw new Error(label + ' is too large.');
    return v;
  },
  date10(fd, k, label, allowBlank) { const v = String(fd.get(k) || '').trim(); if (!v && allowBlank) return ''; if (!U.isYmd(v)) throw new Error(label + ' must be a valid date.'); return v; }
};

/* ------------------------------------------------------------------ Data actions (local-first) */
const Data = {
  same: (a, b) => (U.blank(a) && U.blank(b)) || (typeof a === 'number' || typeof b === 'number' ? (!U.blank(a) && !U.blank(b) && U.cents(a) === U.cents(b)) : String(a) === String(b)),
  editableOp(type, id) {
    if (Sync.running) return null;
    return Store.queue.find(q => q.entityType === type && (q.localId === id || q.entityId === id) && (q.action === 'CREATE' || q.action === 'UPDATE') && ['PENDING', 'RETRY', 'FAILED', 'REJECTED'].includes(q.status) && !Store.inFlight.has(q.operationId)) || null;
  },
  async create(store, rec, opId) {
    const now = U.nowIso();
    const id = rec[ENTITY[store].idField];
    Object.assign(rec, { id, localId: id, serverId: '', syncStatus: 'pending', createdAt: rec.createdAt || now, updatedAt: now, lastSyncedAt: '' });
    await Store.save(store, rec);
    const payload = {}; Object.keys(rec).forEach(k => { if (!['id', 'localId', 'serverId', 'syncStatus', 'syncError', 'createdAt', 'updatedAt', 'lastSyncedAt', 'serverUpdatedAt'].includes(k)) payload[k] = rec[k]; });
    return Sync.commit({ operationId: opId, entityType: ENTITY[store].type, action: store === 'payments' ? 'PAYMENT' : 'CREATE', localId: id, entityId: id, payload });
  },
  /** Field-level update with conflict metadata; coalesces into a not-yet-sent queued op. */
  async update(store, id, changes, opId, extraPayload) {
    const cur = Store.get(store, id);
    if (!cur) throw new Error('Record not found on this device.');
    const changed = Object.keys(changes).filter(k => !this.same(cur[k], changes[k]));
    if (!changed.length && !extraPayload) return 'nochange';
    const before = Object.assign({}, cur);
    const type = ENTITY[store].type, idField = ENTITY[store].idField;
    Object.assign(cur, changes, { updatedAt: U.nowIso(), syncStatus: 'pending' });
    await Store.save(store, cur);
    const existing = this.editableOp(type, id);
    if (existing) {
      Object.assign(existing.payload, changes, extraPayload || {});
      if (existing.action === 'UPDATE') {
        existing.changedFields = Array.from(new Set((existing.changedFields || []).concat(changed)));
        existing.baseValues = Object.assign({}, changed.reduce((o, k) => (o[k] = before[k], o), {}), existing.baseValues || {});
      }
      Object.assign(existing, { status: 'PENDING', retryCount: 0, nextAttemptAt: 0, lastError: '', clientUpdatedAt: U.nowIso() });
      await Sync.updateOp(existing);
      return Sync.commit(existing);
    }
    return Sync.commit({
      operationId: opId, entityType: type, action: 'UPDATE', localId: id, entityId: id,
      payload: Object.assign({ [idField]: id }, changes, extraPayload || {}), changedFields: changed,
      baseValues: changed.reduce((o, k) => (o[k] = before[k], o), {}), baseUpdatedAt: before.serverUpdatedAt || before.updatedAt
    });
  },
  /** Delete (or void a payment). A never-synced record is simply discarded locally. */
  async remove(store, id) {
    const cur = Store.get(store, id);
    if (!cur) return 'nochange';
    const type = ENTITY[store].type, idField = ENTITY[store].idField;
    const createOp = !Sync.running && Store.queue.find(q => q.entityType === type && q.localId === id && (q.action === 'CREATE' || q.action === 'PAYMENT') && !Store.inFlight.has(q.operationId));
    if (createOp && !cur.serverId) {
      for (const q of Store.queue.filter(q => q.localId === id || q.entityId === id)) await Sync.removeOp(q.operationId);
      await Store.remove(store, id);
      UI.refresh();
      return 'discarded';
    }
    if (store === 'payments' || store === 'loanRepayments' || store === 'goalDeposits') cur.isVoid = true; else cur.isDeleted = true;
    cur.updatedAt = U.nowIso(); cur.syncStatus = 'pending';
    await Store.save(store, cur);
    return Sync.commit({ operationId: U.opId(), entityType: type, action: 'DELETE', localId: id, entityId: id, payload: { [idField]: id }, baseUpdatedAt: cur.serverUpdatedAt || '' });
  }
};

        const upd = () => { const v = U.parseMoney(amt.value); if (isNaN(v) || v === '') { hint.textContent = ''; return; } const left = U.fromCents(U.cents(l.remainingAmount) - U.cents(v)); hint.innerHTML = left > 0 ? `${U.esc(l.borrower)} will still owe <b>${U.esc(U.peso(left))}</b>.` : left === 0 ? '<b>Fully repaid</b> after this.' : `That is <b>${U.esc(U.peso(-left))}</b> more than what is owed.`; };
        amt.addEventListener('input', upd); upd();
      },
      async onSubmit(fd) {
        const amount = F.amount(fd, 'amount', 'Amount received', { positive: true });
        const outcome = await Data.create('loanRepayments', { repaymentId, loanId: l.loanId, borrower: l.borrower, date: F.date10(fd, 'date', 'Date received'), amount, paymentMethod: fd.get('paymentMethod'), notes: String(fd.get('notes') || '').trim(), isVoid: false }, Modal.current.opId);
        Modal.close();
        const after = Calc.loan(Store.get('loans', l.id));
        if (outcome === 'synced' || outcome === 'local') UI.toast(after.status === 'REPAID' ? `✓ ${l.borrower} has fully repaid ${U.peso(l.amount, true)}.` : `${l.borrower} repaid ${U.peso(amount, true)} · ${U.peso(after.remainingAmount, true)} still owed.`);

        UI.filters.loans.open[l.id] = true;
        UI.refresh();
      }
    });

  async 'sync-now'(el) {
    if (!Api.configured()) { UI.go('settings'); return; }
    if (!navigator.onLine) return UI.toast('You are offline. Changes will sync automatically when the connection returns.', 'warn');
    await UI.busy(el, 'Syncing…', async () => {
      const before = Store.queue.length;
      const r = await Sync.run({ manual: true });
      if (r.error) UI.toast('Unable to synchronize: ' + r.error + ' It will be retried.', 'err');
      else if (r.failed) UI.toast(r.failed + ' change(s) could not be synchronized. They will be retried.', 'err');
      else if (r.conflicts) UI.toast(r.conflicts + ' change(s) need your review.', 'warn');
      else UI.toast(before ? '✓ All changes synced.' : 'Up to date with Google Sheets.');
    });
  },
  async 'full-refresh'(el) {
    if (!Api.configured() || !navigator.onLine) return UI.toast('Connect to the internet to refresh from Google Sheets.', 'warn');
    await UI.busy(el, 'Refreshing…', async () => {
      const r = await Sync.run({ manual: true, full: true });
      UI.toast(r.error ? 'Refresh failed: ' + r.error : 'Reloaded everything from Google Sheets.', r.error ? 'err' : '');
    });
  },
  async 'retry-op'(el) {
    const op = Store.queue.find(q => q.operationId === el.dataset.id);
    if (!op) return;
    Object.assign(op, { status: 'PENDING', nextAttemptAt: 0 });
    await Sync.updateOp(op);
    await Actions['sync-now'](el);
  },
  async 'discard-op'(el) {
    const op = Store.queue.find(q => q.operationId === el.dataset.id);
    if (!op) return;
    const isCreate = op.action === 'CREATE' || op.action === 'PAYMENT';
    const ok = await Modal.confirm('Discard this change?', isCreate ? 'This entry was never saved to Google Sheets. Discarding removes it from this device permanently.' : 'This device\'s change will be dropped and the server version restored on the next sync.', 'Discard', true);
    if (!ok) return;
    await Sync.removeOp(op.operationId);
    Store.conflicts = Store.conflicts.filter(c => c.operationId !== op.operationId);
    await LocalDB.del('conflicts', op.operationId);
    const store = Object.keys(ENTITY).find(s => ENTITY[s].type === op.entityType);
    if (store && isCreate) { const rec = Store.get(store, op.localId); if (rec && !rec.serverId) await Store.remove(store, op.localId); }
    else if (store) { const rec = Store.get(store, op.localId || op.entityId); if (rec) { rec.syncStatus = 'synced'; await Store.save(store, rec); } }
    await LocalDB.addLog({ type: 'DISCARDED', message: 'Discarded queued ' + op.entityType + ' ' + op.action, operationId: op.operationId });
    UI.refresh();
    if (!isCreate && Api.configured() && navigator.onLine) Sync.run({ full: true });
  },
  async 'conflict-mine'(el) {
    const c = Store.conflicts.find(x => x.operationId === el.dataset.id);
    if (!c) return;
    await Sync.removeOp(c.operationId);
    await LocalDB.del('conflicts', c.operationId);
    Store.conflicts = Store.conflicts.filter(x => x.operationId !== c.operationId);
    const op = Object.assign({}, c.op, { operationId: U.opId(), force: true, status: 'PENDING', retryCount: 0, nextAttemptAt: 0, lastError: '', createdAt: U.nowIso(), clientUpdatedAt: U.nowIso() });
    await LocalDB.addLog({ type: 'CONFLICT', message: 'Kept this device\'s version (' + c.op.entityType + ')', operationId: op.operationId });
    const outcome = await Sync.commit(op);
    UI.saveOutcome(outcome, 'Your version');
    UI.refresh();
  },
  async 'conflict-server'(el) {
    const c = Store.conflicts.find(x => x.operationId === el.dataset.id);
    if (!c) return;
    await Sync.removeOp(c.operationId);
    await LocalDB.del('conflicts', c.operationId);
    Store.conflicts = Store.conflicts.filter(x => x.operationId !== c.operationId);
    const store = Object.keys(ENTITY).find(s => ENTITY[s].type === c.op.entityType);
    if (store) { const rec = Store.get(store, c.entityId); if (rec) { rec.syncStatus = 'synced'; await Store.save(store, rec); } }
    await LocalDB.addLog({ type: 'CONFLICT', message: 'Kept the server version (' + c.op.entityType + ')', operationId: c.operationId });
    await Sync.run({ full: true });
    UI.toast('Server version restored.');
  },
  async 'save-connection'(el, e) {
    const form = document.getElementById('connForm');
    const err = document.getElementById('connErr');
    const fail = msg => { err.textContent = msg; err.classList.add('show'); };
    err.classList.remove('show');
    const parsed = parseLink(new FormData(form).get('link'));
    if (!parsed) return fail('That does not look like your personal link. Copy the whole link you received and paste it here.');
    if (!navigator.onLine) return fail('You are offline. Connecting needs the internet once; after that the app works offline.');
    await UI.busy(el, 'Connecting…', async () => {
      const r = await connectWithLink(parsed.key, parsed.url, parsed.dev);
      if (r.error) return fail(r.error);
      form.reset();
    });

  async 'copy-text'(el) { UI.toast(await copyText(el.dataset.text || '') ? 'Copied.' : 'Copy failed — select it and copy by hand.', ''); },
  async 'check-account'(el) {
    if (!navigator.onLine) return UI.toast('You are offline. Connect to the internet and try again.', 'err');
    await UI.busy(el, 'Checking…', async () => {

      foot: '<button type="button" class="btn" data-close>Close</button>' });
  },
  'open-wizard': () => Wizard.open(true),
  async 'hide-getting-started'() { await Store.setMeta('hideGettingStarted', true); UI.render(); },
  'print': () => window.print(),
  'export-csv': () => { Reports.csv(); UI.toast('CSV exported.'); },
  async 'export-backup'() {
    const out = { exportedAt: U.nowIso(), app: 'petsa-de-peligro', version: APP_VERSION, queue: Store.queue, conflicts: Store.conflicts };
