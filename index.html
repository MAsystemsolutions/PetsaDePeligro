        <div class="ig-btns"><button type="button" class="btn primary" data-action="install-guide-later">Got it</button></div>`;
    } else if (p.android && UI.deferredInstall) {
      body = `<h2>Install Petsa on your phone</h2><p class="ig-sub">One tap — it opens from your home screen like a real app, even with no signal.</p>
        <div class="ig-btns" style="margin-bottom:8px"><button type="button" class="btn primary" data-action="install-guide-go">📲 Install now</button></div>
        <div class="ig-btns">${laterBtn}</div>`;
    } else {
      arrow = `<div class="ig-arrow top">👆<span class="lbl">Tap ⋮</span></div>`;
      body = `<h2>Install Petsa on your phone</h2><p class="ig-sub">It opens from your home screen like a real app, even with no signal.</p>
        <ol class="ig-steps">${step(1, '⋮', 'Tap <b>⋮</b> at the top right of Chrome')}
        ${step(2, '📲', 'Tap <b>Install app</b> or <b>Add to Home screen</b>')}
        ${step(3, '✓', 'Choose <b>Install</b> <span class="muted">(not “Create shortcut”)</span>')}</ol>
        <div class="ig-btns"><button type="button" class="btn primary" data-action="install-guide-later">Got it</button></div>`;
    }
    const el = document.createElement('div');
    el.className = 'ig'; el.id = 'ig'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', 'How to install');
    el.innerHTML = arrow + `<div class="ig-card">${body}</div>`;
    el.addEventListener('click', e => { if (e.target === el) InstallGuide.later(); });
    document.body.appendChild(el);
  }
};

/* ------------------------------------------------------------------ Server reconciliation (frontend never has the last word) */
Store.verified = {};
const Verify = {
  last: 0,
  async run() {
    if (!Api.configured() || !navigator.onLine || Store.queue.length || UI.view !== 'dashboard' || Date.now() - this.last < 60000) return;
    this.last = Date.now();
    const month = Store.month;
    try {
      const d = await Api.call('getDashboardData', { month }, { timeout: 30000 });
      const local = Calc.summary(month, null, d.today || U.today());
      const keys = ['monthlyBudget', 'expectedBills', 'actualBills', 'otherExpenses', 'unpaidAmount', 'overBudgetAmount', 'expectedIncome', 'actualIncome', 'netCashFlow'];
      let diff = keys.filter(k => U.cents(local[k]) !== U.cents(d.summary[k]));
      if (d.available && U.cents(Calc.available(d.today || U.today()).cashOnHand) !== U.cents(d.available.cashOnHand)) diff = diff.concat(['cashOnHand']);
      if (d.insight) { const li = Calc.insight(month, d.today || U.today()); if (li.status !== d.insight.status || U.cents(li.safeToSpend) !== U.cents(d.insight.safeToSpend)) diff = diff.concat(['insight']); }
      Store.verified[month] = { ok: !diff.length, at: U.nowIso(), diff };
      if (diff.length) {
        console.warn('Local and server totals differ:', diff, local, d.summary);
        await LocalDB.addLog({ type: 'RECONCILE', message: 'Local totals differed from the server (' + diff.join(', ') + '); reloading from Google Sheets.' });
        await Sync.pull({ full: true });
        const again = Calc.summary(month, null, d.today || U.today());
        Store.verified[month] = { ok: keys.every(k => U.cents(again[k]) === U.cents(d.summary[k])), at: U.nowIso() };
      }
      if (UI.view === 'dashboard') UI.refresh();
    } catch (e) { /* verification is best-effort */ }
  }
};
const _origRun = Sync._run.bind(Sync);
Sync._run = async function (opts) {
  const r = await _origRun(opts);
  if (!r.error && !r.skipped) setTimeout(() => Verify.run(), 50);
  if (!r.error && !r.skipped) setTimeout(() => Wizard.maybeOpen(), 400);
  return r;
};

/* ------------------------------------------------------------------ Install button */
function runningAsApp() {
  try { return matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: minimal-ui)').matches || navigator.standalone === true; } catch (e) { return false; }
}
/** The top-bar Install button shows whenever the page is open in a browser (not already as the installed app). */
function updateInstallUI() {
  const inApp = runningAsApp();
  const btn = document.getElementById('installTop');
  if (btn) btn.hidden = inApp;
  document.querySelectorAll('.install-card').forEach(b => b.classList.toggle('show', !inApp && !!UI.deferredInstall));
}

/* ------------------------------------------------------------------ Personal link */
/** Accepts the full personal link (…#connect=<key>&url=<server>) or just the key. */
function parseLink(text) {
  const t = String(text || '').trim();
  if (!t) return null;
  const m = t.match(/[#?&](?:connect|k)=([^&#\s]+)(?:&url=([^&#\s]+))?(?:&dev=([A-Za-z0-9_-]{6,60}))?/);
  if (m) {
    let key = '', url = '';
    const dev = m[3] || '';
    try { key = decodeURIComponent(m[1]).trim(); url = m[2] ? decodeURIComponent(m[2]).trim() : ''; } catch (e) { return null; }
    if (!/^[0-9a-f]{20,80}$/i.test(key)) return null;
    if (url && !/^https:\/\/script\.google(usercontent)?\.com\/.+\/exec$/.test(url) && !/^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?\//.test(url)) return null;
    return { key, url, dev };
  }
  return /^[0-9a-f]{20,80}$/i.test(t) ? { key: t, url: '' } : null;
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* fall back */ }
  try {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }
}
/** Saves the link, confirms it with the server, then loads the account's data. */
async function connectWithLink(key, url, dev) {
  const prev = { apiKey: Store.meta.apiKey, apiUrl: Store.meta.apiUrl };
  // A brand-new install opened with a "same phone" link keeps that phone's ID (iPhone home-screen apps).
  if (dev && !Store.meta.lastSyncAt && !Store.queue.length && dev !== Store.meta.clientId) await Store.setMeta('clientId', dev);
  if (!url && !prev.apiUrl && !DEFAULT_API_URL) return { error: 'This link is incomplete. Copy the whole link you received.' };
  await Store.setMeta('apiKey', key);
  if (url) await Store.setMeta('apiUrl', url);
  await Store.setMeta('accountKey', '');
  Sync.lastError = ''; Sync.lastErrorCode = '';
  if (!navigator.onLine) { UI.render(); return { offline: true }; }
  if (Sync.running) { try { await Sync.running; } catch (e) { /* the old run's result no longer matters */ } }
  const r = await Sync.run({ manual: true, full: true });
  if (r && r.error && !r.network) {
    if (Sync.lastErrorCode === 'UNAUTHORIZED') {
      await Store.setMeta('badKey', key);
      await Store.setMeta('apiKey', prev.apiKey || ''); await Store.setMeta('apiUrl', prev.apiUrl || ''); await Store.setMeta('accountKey', prev.apiKey ? Store.meta.accountKey : '');
      Sync.lastError = ''; Sync.lastErrorCode = '';
      UI.render();
      return { error: 'This link is not valid anymore. Please ask for a new link.' };
    }
  }
  UI.render();
  if (Store.meta.deviceBlocked) { /* the phone-limit screen explains it */ }
  else if (r && r.error) UI.toast('Link saved. ' + (r.network ? 'It will connect when you are back online.' : 'First sync failed: ' + r.error), 'err');
  else if (r && r.skipped === 'locked') UI.toast('Connected — your subscription needs renewing.', 'warn');
  else { const a = Account.info; UI.toast('✓ Connected' + (a && a.customerName ? ' — welcome, ' + a.customerName.split(' ')[0] + '!' : '.')); }
  if (!(r && r.error) && !Store.meta.deviceBlocked) {
    if (window.PDP_IOS_BROWSER) HomePrep.apply(key, Store.meta.clientId);
    setTimeout(() => InstallGuide.auto(), 1200);
  }
  return r || {};
}

/* ------------------------------------------------------------------ Boot */
async function boot() {
  const view = document.getElementById('view');
  view.innerHTML = '<div class="empty"><span class="spinner"></span> Loading your finances…</div>';
  await LocalDB.open();
  try { await Store.load(); } catch (e) { console.error(e); LocalDB.useMemory('Local data could not be read: ' + e.message); await Store.load(); }

  if (navigator.storage && navigator.storage.persist) {
    try { LocalDB.persistent = await navigator.storage.persisted() || await navigator.storage.persist(); } catch (e) { /* optional */ }
  }

  // Service worker: only where the browser allows it (HTTPS / localhost, not inside the Apps Script iframe)
  if ('serviceWorker' in navigator && !IS_GAS && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('service-worker.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (nw) nw.addEventListener('statechange', () => { if (nw.state === 'installed' && navigator.serviceWorker.controller) UI.toast('An app update is ready — it will be used the next time you open the app.'); });
      });
    }).catch(err => console.warn('Service worker registration failed:', err));
    navigator.serviceWorker.addEventListener('controllerchange', () => { const el = document.getElementById('swState'); if (el) el.textContent = 'Active'; });
  }

  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    UI.deferredInstall = e;
    updateInstallUI();
  });
  window.addEventListener('appinstalled', () => { UI.deferredInstall = null; updateInstallUI(); UI.toast(APP_NAME + ' installed. Find the ₱ icon on your home screen.'); });
  try { matchMedia('(display-mode: standalone)').addEventListener('change', updateInstallUI); } catch (e) { /* older browsers */ }
  document.addEventListener('submit', e => { if (e.target.id === 'connForm') { e.preventDefault(); Actions['save-connection'](e.target.querySelector('[data-action=save-connection]'), e); } });
  window.addEventListener('unhandledrejection', e => { console.error(e.reason); });

  if (LocalDB.memory) setTimeout(() => UI.toast('This browser blocked offline storage (' + LocalDB.memoryReason + '). Entries will be lost if you close the app before syncing.', 'err', 10000), 500);
  // Personal link: …/#connect=<key>&url=<server> (the #part never reaches the web host's servers)
  let fromLink = null;
  try {
    if (/^#(connect|k)=/.test(location.hash || '') || /[?&]k=/.test(location.search || '')) {
      fromLink = parseLink(location.href);
      // Home Screen app (iPhone) opened with ?k=…: remove it from the address once read.
      if (/[?&]k=/.test(location.search || '') && !window.PDP_IOS_BROWSER) { try { history.replaceState(null, '', location.pathname + '#/dashboard'); } catch (e) { /* ignore */ } }
      // Inside Messenger/Facebook the key stays in the address, so "Open in browser" brings the account along.
      // In iPhone Safari it stays too, so "Add to Home Screen" brings the account along.
      if (!IN_APP_BROWSER && !window.PDP_IOS_BROWSER) { try { location.replace('#/dashboard'); } catch (e) { /* ignore */ } }
      // The Home Screen app opens with the link every time: only connect when it is a different, usable link.
      if (fromLink && (fromLink.key === Store.meta.apiKey || fromLink.key === Store.meta.badKey)) fromLink = null;
    }
  } catch (e) { /* ignore malformed links */ }
  UI.view = UI.hashView() || 'dashboard';
  UI.init();
  updateInstallUI();
  setTimeout(() => Wizard.maybeOpen(), 600);
  if (window.PDP_IOS_BROWSER && Store.meta.apiKey) HomePrep.apply(Store.meta.apiKey, Store.meta.clientId);
  if (fromLink) {
    UI.toast('Connecting your account…');
    connectWithLink(fromLink.key, fromLink.url, fromLink.dev);
  } else if (Store.meta.apiKey) setTimeout(() => InstallGuide.auto(), 1500);
  // The personal link opened while the app is already open (only the #part changes, no reload).
  window.addEventListener('hashchange', () => {
    if (!/^#(connect|k)=/.test(location.hash || '')) return;
    const l = parseLink(location.href);
    if (!IN_APP_BROWSER && !window.PDP_IOS_BROWSER) { try { location.replace('#/dashboard'); } catch (e) { /* ignore */ } }
    if (l && l.key !== Store.meta.apiKey) { UI.toast('Connecting your account…'); connectWithLink(l.key, l.url, l.dev); }
  });
  Sync.start();
}
boot();
</script>
